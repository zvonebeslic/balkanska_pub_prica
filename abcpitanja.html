const SUPABASE_URL='https://hssfjguysejbosvholqu.supabase.co',SUPABASE_KEY='sb_publishable_1wlZVov1csReXuZEgcuInA_7F7_gzIy';const supabaseClient=window.supabase?.createClient?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
const BASE='ABC%20pitanja/',STATS_KEY='kviztogo_extra_modes_v1',GUEST_KEY='kviztogo_guest_identity_v1',MAIN_STATS='kviztogo_player_stats_v1',DIRTY='kviztogo_progress_dirty_v1';const MODES=[{id:'blitz',label:'Blitz 60s',files:['questions-blitz.json','Svastara.json']},{id:'relax',label:'Bez vremena',files:['questions-blitz.json','Svastara.json']},{id:'AntickiRim',label:'Antički Rim',files:['AntickiRim.json']},{id:'AmerickiPredsjednici',label:'Američki predsjednici',files:['AmerickiPredsjednici.json']},{id:'Zemljopis',label:'Zemljopis',files:['Zemljopis.json']},{id:'Nogomet',label:'Nogomet',files:['Nogomet.json']},{id:'FloraFauna',label:'Flora i fauna',files:['FloraFauna.json']},{id:'Film',label:'Film',files:['Film.json']},{id:'Znanost',label:'Znanost',files:['Znanost.json']},{id:'Glazba',label:'Glazba',files:['Glazba.json']},{id:'Knjizevnost',label:'Književnost',files:['Knjizevnost.json']},{id:'Povijest',label:'Povijest',files:['povijest.json']},{id:'Gaming',label:'Svijet Gaminga',files:['Gaming.json']},{id:'Moreplovci',label:'Moreplovci',files:['Moreplovci.json']},{id:'Sport',label:'Sport',files:['Sport.json']}];let pool=[],current,index=0,correct=0,wrong=0,answered=false,mode=MODES[0],timer,timeLeft=60,history=[],gameStreak=0,bestGameStreak=0,gameSaved=false,activePlayId=null,activeSessionId=null,activeStartedAt=null,activeUserId=null;const $=id=>document.getElementById(id);
function guestId(){try{const g=JSON.parse(localStorage.getItem(GUEST_KEY)||'null');if(g?.id)return String(g.id)}catch(e){}let id=crypto?.randomUUID?.()||'guest-'+Date.now();localStorage.setItem(GUEST_KEY,JSON.stringify({id,createdAt:new Date().toISOString(),timestamp:String(Date.now()),suffix:id.slice(-8),displayName:''}));return id}function sessionId(){return crypto?.randomUUID?.()||'abc-session-'+Date.now()}function trackingTopic(){return mode.id==='blitz'||mode.id==='relax'?'Svaštara':mode.label}function questionId(q){return 'abc:'+trackingTopic()+':'+String(q?.question||'').slice(0,220)}function trackedQuestionText(q){return 'ABC · '+trackingTopic()+' · '+String(q?.question||'')}
async function startTracking(){if(!supabaseClient)return;await finishTracking(false);activeSessionId=sessionId();activeStartedAt=Date.now();try{const{data:auth}=await supabaseClient.auth.getSession();activeUserId=auth?.session?.user?.id||null;const key=activeUserId||guestId();const{data,error}=await supabaseClient.from('quiz_plays').insert({user_id:activeUserId,session_id:activeSessionId,quiz_mode:'abc',topic:trackingTopic(),correct_answers:0,wrong_answers:0,completed:false,visitor_id:activeUserId?null:key,player_key:key}).select('id').single();if(error)throw error;activePlayId=data.id}catch(e){console.error('ABC quiz_plays:',e)}}
async function saveTrackedAnswer(q,k,status){if(!supabaseClient||!activeSessionId||!q)return;const good=String(q.correct_answer).toUpperCase(),skipped=status==='skip',ok=status==='correct',key=activeUserId||guestId();try{const{error}=await supabaseClient.from('quiz_answers').insert({quiz_play_id:activePlayId,session_id:activeSessionId,user_id:activeUserId,question_id:questionId(q),question_text:trackedQuestionText(q),question_topic:trackingTopic(),question_type:'abc',quiz_mode:'abc',selected_theme:trackingTopic(),user_answer:skipped?null:q.answers[k],correct_answer:q.answers[good],matched_answer:ok?q.answers[good]:null,is_correct:ok,is_exact:ok,was_skipped:skipped,was_scrolled:false,was_viewed:true,match_reason:skipped?'skipped':'abc',language:'hr',player_key:key});if(error)throw error;await updateTracking()}catch(e){console.error('ABC quiz_answers:',e)}}
async function updateTracking(){if(!activePlayId)return;await supabaseClient.from('quiz_plays').update({duration_seconds:Math.max(0,Math.round((Date.now()-activeStartedAt)/1000)),correct_answers:correct,wrong_answers:wrong,viewed_questions:history.length}).eq('id',activePlayId)}async function finishTracking(completed){if(!activePlayId)return;const id=activePlayId;activePlayId=null;try{await supabaseClient.from('quiz_plays').update({finished_at:new Date().toISOString(),duration_seconds:Math.max(0,Math.round((Date.now()-activeStartedAt)/1000)),correct_answers:correct,wrong_answers:wrong,viewed_questions:history.length,completed:!!completed}).eq('id',id)}catch(e){console.error(e)}}
function emptyMode(){return{gamesPlayed:0,totalCorrect:0,totalWrong:0,bestScore:0,bestTotal:0,bestPercent:0,longestStreak:0,answered:0,skipped:0}}function loadExtra(){try{const x=JSON.parse(localStorage.getItem(STATS_KEY)||'{}');return{abc:{...emptyMode(),...(x.abc||{})},scroll:{...emptyMode(),...(x.scroll||{})}}}catch(e){return{abc:emptyMode(),scroll:emptyMode()}}}function saveExtra(x){localStorage.setItem(STATS_KEY,JSON.stringify(x));renderFab()}function renderFab(){const s=loadExtra().abc;$('pGames').textContent=s.gamesPlayed;$('pCorrect').textContent=s.totalCorrect;$('pStreak').textContent=s.longestStreak;$('pBest').textContent=s.bestScore;$('fabScore').textContent=s.totalCorrect;const unlocked=[1,5,10,25,50].filter(n=>s.gamesPlayed>=n).length;$('pCrowns').textContent='👑 ABC krune: '+unlocked+'/5'}$('profileFab').onclick=()=>$('fabPanel').classList.toggle('hidden');renderFab();
async function syncMainProfile(){if(!history.length)return;try{const{data:auth}=await supabaseClient.auth.getSession(),uid=auth?.session?.user?.id||null,key=uid?MAIN_STATS+':'+uid:MAIN_STATS+':guest:'+guestId();let s={};try{s=JSON.parse(localStorage.getItem(key)||'{}')||{}}catch(e){}s.gamesPlayed=(+s.gamesPlayed||0)+1;s.totalCorrect=(+s.totalCorrect||0)+correct;s.totalWrong=(+s.totalWrong||0)+wrong;s.longestStreak=Math.max(+s.longestStreak||0,bestGameStreak);s.bestScore=Math.max(+s.bestScore||0,correct);s.bestPercent=Math.max(+s.bestPercent||0,Math.round(correct/history.length*100));s.discoveredQuestionIds=Array.from(new Set([...(s.discoveredQuestionIds||[]),...history.map(h=>'abc:'+h.topic+':'+h.question)])).slice(-10000);s.updatedAt=new Date().toISOString();localStorage.setItem(key,JSON.stringify(s));if(uid)localStorage.setItem(DIRTY+':'+uid,String(Date.now()))}catch(e){console.warn('ABC profil sync:',e)}}
MODES.forEach((m,i)=>{const b=document.createElement('button');b.className='mode'+(i?'':' active');b.textContent=m.label;b.onclick=()=>selectMode(m,b);$('modes').appendChild(b)});function shuffle(a){return a.sort(()=>Math.random()-.5)}function valid(q){return q?.question&&q?.answers&&['A','B','C'].every(k=>typeof q.answers[k]==='string')&&['A','B','C'].includes(String(q.correct_answer||'').toUpperCase())}
async function selectMode(m,b){if(history.length){saveGame();await syncMainProfile()}await finishTracking(false);mode=m;document.querySelectorAll('.mode').forEach(x=>x.classList.remove('active'));b.classList.add('active');clearInterval(timer);$('game').classList.add('hidden');$('loading').classList.remove('hidden');try{const sets=await Promise.all(m.files.map(async f=>(await fetch(BASE+encodeURIComponent(f),{cache:'no-store'})).json()));pool=shuffle(sets.flat().filter(valid));index=correct=wrong=gameStreak=bestGameStreak=0;history=[];gameSaved=false;renderHistory();updateStats();$('game').classList.remove('hidden');$('loading').classList.add('hidden');$('skip').disabled=false;if(m.id==='blitz'){timeLeft=60;startTimer()}nextQuestion();await startTracking()}catch(e){console.error(e);$('loading').textContent='Pitanja se ne mogu učitati.'}}
function startTimer(){clearInterval(timer);timer=setInterval(()=>{timeLeft--;updateTopic();if(timeLeft<=0){clearInterval(timer);finish()}},1000)}function updateTopic(){$('topic').textContent=mode.label+(mode.id==='blitz'?' · '+timeLeft+'s':'')}function nextQuestion(){if(!pool.length||mode.id==='blitz'&&timeLeft<=0)return;answered=false;current=pool[index%pool.length];updateTopic();$('counter').textContent='Pitanje '+(++index);$('question').textContent=current.question;$('feedback').textContent='';$('next').disabled=true;$('answers').innerHTML='';['A','B','C'].forEach(k=>{const b=document.createElement('button');b.className='answer';b.innerHTML='<span class="letter">'+k+'</span><span>'+current.answers[k]+'</span>';b.onclick=()=>answer(k,b);$('answers').appendChild(b)})}
function addHistory(q,k,status){const g=String(q.correct_answer).toUpperCase();history.unshift({question:q.question,topic:trackingTopic(),chosen:k?k+': '+q.answers[k]:'Preskočeno',correct:g+': '+q.answers[g],status});renderHistory()}function answer(k,b){if(answered)return;answered=true;const q=current,g=String(q.correct_answer).toUpperCase();document.querySelectorAll('.answer').forEach((x,i)=>{x.disabled=true;if(['A','B','C'][i]===g)x.classList.add('correct')});if(k===g){correct++;gameStreak++;bestGameStreak=Math.max(bestGameStreak,gameStreak);$('feedback').textContent='✓ Točno!';addHistory(q,k,'correct');void saveTrackedAnswer(q,k,'correct')}else{wrong++;gameStreak=0;b.classList.add('wrong');$('feedback').textContent='✗ Točan odgovor je '+g+': '+q.answers[g];addHistory(q,k,'wrong');void saveTrackedAnswer(q,k,'wrong')}$('next').disabled=false;updateStats()}
function renderHistory(){const box=$('historyList');$('historyCount').textContent=history.length+' pitanja';box.innerHTML=history.length?'':'Odgovorena i preskočena pitanja pojavit će se ovdje.';history.forEach((h,i)=>{const d=document.createElement('div');d.className='history-item '+(h.status==='correct'?'':h.status);d.innerHTML='<div class="history-q">ABC · '+h.topic+' · '+h.question+'</div><div class="history-a">'+(h.status==='skip'?'Preskočeno · Točan odgovor: '+h.correct:'Tvoj odgovor: '+h.chosen+(h.status==='wrong'?' · Točan odgovor: '+h.correct:' · Točno'))+'</div>';box.appendChild(d)})}function updateStats(){$('correct').textContent=correct;$('wrong').textContent=wrong;$('played').textContent=history.length}
function saveGame(){if(gameSaved||!history.length)return;gameSaved=true;const x=loadExtra(),s=x.abc,total=history.length,pct=Math.round(correct/total*100);s.gamesPlayed++;s.totalCorrect+=correct;s.totalWrong+=wrong;s.answered+=history.filter(h=>h.status!=='skip').length;s.skipped+=history.filter(h=>h.status==='skip').length;s.longestStreak=Math.max(s.longestStreak,bestGameStreak);if(pct>s.bestPercent||(pct===s.bestPercent&&correct>s.bestScore)){s.bestPercent=pct;s.bestScore=correct;s.bestTotal=total}x.abc=s;saveExtra(x)}async function finish(){document.querySelectorAll('.answer').forEach(x=>x.disabled=true);$('feedback').textContent='Vrijeme! Rezultat: '+correct+'/'+history.length;$('next').disabled=true;$('skip').disabled=true;saveGame();await syncMainProfile();await finishTracking(true)}
$('next').onclick=nextQuestion;$('skip').onclick=()=>{if(answered)return;answered=true;const q=current;wrong++;gameStreak=0;addHistory(q,null,'skip');updateStats();void saveTrackedAnswer(q,null,'skip');nextQuestion()};window.addEventListener('pagehide',()=>{saveGame();void syncMainProfile();void finishTracking(false)});$('shareResult').onclick=async()=>{const text='KvizToGo ABC · '+correct+'/'+history.length+' točnih';try{if(navigator.share)await navigator.share({title:'KvizToGo ABC',text,url:location.href});else await navigator.clipboard.writeText(text+' '+location.href)}catch(e){}};$('downloadHistory').onclick=()=>{if(!history.length)return;const text=history.map(h=>'ABC · '+h.topic+' · '+h.question+'\n'+h.chosen+'\nTočan: '+h.correct).join('\n\n'),blob=new Blob([text],{type:'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='KvizToGo-ABC-povijest.txt';a.click()};selectMode(MODES[0],document.querySelector('.mode'));
</script></body></html>
