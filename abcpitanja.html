<!DOCTYPE html>
<html lang="hr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ABC pitanja | KvizToGo</title>
<style>:root{--bg:#081322;--card:#101d30;--text:#f7fbff;--muted:#9fb1c7;--green:#22c55e;--red:#ef4444;--border:rgba(170,190,214,.22)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,rgba(47,128,255,.18),transparent 34%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh}.header{height:66px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--border)}.logo{font-weight:950;font-size:1.55rem;text-decoration:none;color:#fff}.to{color:#55a3ff}.go{color:#34d27a}.back,.wrap{max-width:980px;margin:auto;padding:16px}.back a{color:#dceaff;text-decoration:none;font-weight:800}.selector,.card,.history{background:rgba(16,29,48,.9);border:1px solid var(--border);border-radius:22px;padding:14px;margin-bottom:16px}.mode-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:12px}.mode,.btn{border:1px solid var(--border);border-radius:15px;background:rgba(255,255,255,.06);color:#fff;padding:12px;font-weight:850;cursor:pointer}.mode.active{border-color:#55a3ff;background:rgba(47,128,255,.15)}.top,.stats,.history-head,.history-actions{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}.question{font-size:clamp(1.25rem,4vw,1.8rem);font-weight:900;margin:16px 0}.answers{display:grid;gap:10px}.answer{display:flex;gap:12px;align-items:center;padding:14px;border-radius:16px;border:1px solid var(--border);background:rgba(255,255,255,.055);color:#fff;font-weight:760}.letter{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:rgba(47,128,255,.16)}.correct{border-color:var(--green)!important;background:rgba(34,197,94,.16)!important}.wrong{border-color:var(--red)!important}.feedback{min-height:28px;margin-top:13px;font-weight:850}.controls{display:flex;justify-content:space-between;gap:10px;margin-top:16px}.primary{background:#2f80ff}.stats{justify-content:flex-start;color:var(--muted);margin-top:14px}.history-list{display:grid;gap:9px;margin-top:12px}.history-item{border:1px solid var(--border);border-left:4px solid var(--green);border-radius:14px;padding:11px}.history-item.wrong{border-left-color:var(--red)}.history-item.skip{border-left-color:#f59e0b}.history-q{font-weight:850}.history-a{font-size:.88rem;color:#c9d8e9}.hidden{display:none!important}.fab{position:fixed;right:18px;bottom:18px;width:62px;height:62px;border-radius:50%;border:2px solid #55a3ff;background:#101d30;color:#fff;font-weight:950;z-index:20;box-shadow:0 8px 30px #0008}.fab small{display:block;font-size:9px;color:#9fb1c7}.fab-panel{position:fixed;right:16px;bottom:90px;width:min(330px,calc(100% - 32px));background:#101d30;border:1px solid var(--border);border-radius:18px;padding:14px;z-index:20;box-shadow:0 15px 45px #000b}.fab-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.fab-stat{padding:9px;border-radius:12px;background:#081322}.fab-stat strong{display:block;font-size:1.2rem}.crown{margin-top:10px;padding:10px;border-radius:12px;background:rgba(250,204,21,.08);border:1px solid rgba(250,204,21,.3)}@media(max-width:620px){.mode-grid{grid-template-columns:1fr}.controls{flex-direction:column}.btn{width:100%}}</style></head><body>
<header class="header"><a class="logo" href="index.html">Kviz<span class="to">To</span><span class="go">Go</span></a></header><div class="back"><a href="online-kviz.html">← Natrag</a></div><main class="wrap"><h1>ABC pitanja</h1><details class="selector" open><summary>Odaberi ABC kviz</summary><div class="mode-grid" id="modes"></div></details><section class="card"><div id="loading">Učitavam pitanja…</div><div id="game" class="hidden"><div class="top"><div id="topic"></div><div id="counter"></div></div><div class="question" id="question"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><div class="controls"><button class="btn" id="skip">Preskoči pitanje</button><button class="btn primary" id="next" disabled>Sljedeće pitanje</button></div><div class="stats"><span>Točno: <strong id="correct">0</strong></span><span>Netočno: <strong id="wrong">0</strong></span><span>Odigrano: <strong id="played">0</strong></span></div></div></section><section class="history"><div class="history-head"><h2>Povijest odgovora</h2><span id="historyCount">0 pitanja</span></div><div id="historyList" class="history-list">Odgovorena i preskočena pitanja pojavit će se ovdje.</div><div class="history-actions"><button class="btn" id="downloadHistory">Spremi povijest kao sliku</button><button class="btn" id="shareResult">Podijeli rezultat</button></div></section></main>
<button class="fab" id="profileFab">👤<small id="fabScore">0</small></button><div class="fab-panel hidden" id="fabPanel"><strong>ABC profil</strong><div class="fab-grid"><div class="fab-stat">Odigrano<strong id="pGames">0</strong></div><div class="fab-stat">Točno<strong id="pCorrect">0</strong></div><div class="fab-stat">Najduži niz<strong id="pStreak">0</strong></div><div class="fab-stat">Najbolja partija<strong id="pBest">0</strong></div></div><div class="crown" id="pCrowns">👑 ABC krune: 0/5</div><p><a href="profil.html" style="color:#8bc1ff">Otvori puni profil</a></p></div>
<script>
const BASE='ABC%20pitanja/',STATS_KEY='kviztogo_extra_modes_v1';const MODES=[{id:'blitz',label:'Blitz 60s',files:['questions-blitz.json','Svastara.json']},{id:'relax',label:'Bez vremena',files:['questions-blitz.json','Svastara.json']},{id:'AntickiRim',label:'Antički Rim',files:['AntickiRim.json']},{id:'AmerickiPredsjednici',label:'Američki predsjednici',files:['AmerickiPredsjednici.json']},{id:'Zemljopis',label:'Zemljopis',files:['Zemljopis.json']},{id:'Nogomet',label:'Nogomet',files:['Nogomet.json']},{id:'FloraFauna',label:'Flora i fauna',files:['FloraFauna.json']},{id:'Film',label:'Film',files:['Film.json']},{id:'Znanost',label:'Znanost',files:['Znanost.json']},{id:'Glazba',label:'Glazba',files:['Glazba.json']},{id:'Knjizevnost',label:'Književnost',files:['Knjizevnost.json']},{id:'Povijest',label:'Povijest',files:['povijest.json']},{id:'Gaming',label:'Svijet Gaminga',files:['Gaming.json']},{id:'Moreplovci',label:'Moreplovci',files:['Moreplovci.json']},{id:'Sport',label:'Sport',files:['Sport.json']}];let pool=[],current,index=0,correct=0,wrong=0,answered=false,mode=MODES[0],timer,timeLeft=60,history=[],gameStreak=0,bestGameStreak=0,gameSaved=false;const $=id=>document.getElementById(id);
function emptyMode(){return{gamesPlayed:0,totalCorrect:0,totalWrong:0,bestScore:0,bestTotal:0,bestPercent:0,longestStreak:0,answered:0,skipped:0}}function loadExtra(){try{const x=JSON.parse(localStorage.getItem(STATS_KEY)||'{}');return{abc:{...emptyMode(),...(x.abc||{})},scroll:{...emptyMode(),...(x.scroll||{})}}}catch(e){return{abc:emptyMode(),scroll:emptyMode()}}}function saveExtra(x){localStorage.setItem(STATS_KEY,JSON.stringify(x));renderFab()}function renderFab(){const s=loadExtra().abc;$('pGames').textContent=s.gamesPlayed;$('pCorrect').textContent=s.totalCorrect;$('pStreak').textContent=s.longestStreak;$('pBest').textContent=s.bestScore;$('fabScore').textContent=s.totalCorrect;const unlocked=[1,5,10,25,50].filter(n=>s.gamesPlayed>=n).length;$('pCrowns').textContent='👑 ABC krune: '+unlocked+'/5'}$('profileFab').onclick=()=>$('fabPanel').classList.toggle('hidden');renderFab();
MODES.forEach((m,i)=>{const b=document.createElement('button');b.className='mode'+(i?'':' active');b.textContent=m.label;b.onclick=()=>selectMode(m,b);$('modes').appendChild(b)});function shuffle(a){return a.sort(()=>Math.random()-.5)}function valid(q){return q?.question&&q?.answers&&['A','B','C'].every(k=>typeof q.answers[k]==='string')&&['A','B','C'].includes(String(q.correct_answer||'').toUpperCase())}
async function selectMode(m,b){saveGame();mode=m;document.querySelectorAll('.mode').forEach(x=>x.classList.remove('active'));b.classList.add('active');clearInterval(timer);$('game').classList.add('hidden');$('loading').classList.remove('hidden');try{const sets=await Promise.all(m.files.map(async f=>(await fetch(BASE+encodeURIComponent(f),{cache:'no-store'})).json()));pool=shuffle(sets.flat().filter(valid));index=correct=wrong=gameStreak=bestGameStreak=0;history=[];gameSaved=false;renderHistory();updateStats();$('game').classList.remove('hidden');$('loading').classList.add('hidden');$('skip').disabled=false;if(m.id==='blitz'){timeLeft=60;startTimer()}nextQuestion()}catch(e){$('loading').textContent='Pitanja se ne mogu učitati.'}}
function startTimer(){clearInterval(timer);timer=setInterval(()=>{timeLeft--;updateTopic();if(timeLeft<=0){clearInterval(timer);finish()}},1000)}function updateTopic(){$('topic').textContent=mode.label+(mode.id==='blitz'?' · '+timeLeft+'s':'')}function nextQuestion(){if(!pool.length||mode.id==='blitz'&&timeLeft<=0)return;answered=false;current=pool[index%pool.length];updateTopic();$('counter').textContent='Pitanje '+(++index);$('question').textContent=current.question;$('feedback').textContent='';$('next').disabled=true;$('answers').innerHTML='';['A','B','C'].forEach(k=>{const b=document.createElement('button');b.className='answer';b.innerHTML='<span class="letter">'+k+'</span><span>'+current.answers[k]+'</span>';b.onclick=()=>answer(k,b);$('answers').appendChild(b)})}
function addHistory(k,status){const g=String(current.correct_answer).toUpperCase();history.push({question:current.question,chosen:k?k+': '+current.answers[k]:'Preskočeno',correct:g+': '+current.answers[g],status});renderHistory()}function answer(k,b){if(answered)return;answered=true;const g=String(current.correct_answer).toUpperCase();document.querySelectorAll('.answer').forEach((x,i)=>{x.disabled=true;if(['A','B','C'][i]===g)x.classList.add('correct')});if(k===g){correct++;gameStreak++;bestGameStreak=Math.max(bestGameStreak,gameStreak);$('feedback').textContent='✓ Točno!';addHistory(k,'correct')}else{wrong++;gameStreak=0;b.classList.add('wrong');$('feedback').textContent='✗ Točan odgovor je '+g+': '+current.answers[g];addHistory(k,'wrong')}$('next').disabled=false;updateStats()}
function renderHistory(){const box=$('historyList');$('historyCount').textContent=history.length+' pitanja';box.innerHTML='';history.forEach((h,i)=>{const d=document.createElement('div');d.className='history-item '+(h.status==='correct'?'':h.status);d.innerHTML='<div class="history-q">'+(i+1)+'. '+h.question+'</div><div class="history-a">'+(h.status==='skip'?'Preskočeno · Točan odgovor: '+h.correct:'Tvoj odgovor: '+h.chosen+(h.status==='wrong'?' · Točan odgovor: '+h.correct:' · Točno'))+'</div>';box.appendChild(d)})}function updateStats(){$('correct').textContent=correct;$('wrong').textContent=wrong;$('played').textContent=history.length}
function saveGame(){if(gameSaved||!history.length)return;gameSaved=true;const x=loadExtra(),s=x.abc,total=history.length,pct=Math.round(correct/total*100);s.gamesPlayed++;s.totalCorrect+=correct;s.totalWrong+=wrong;s.answered+=history.filter(h=>h.status!=='skip').length;s.skipped+=history.filter(h=>h.status==='skip').length;s.longestStreak=Math.max(s.longestStreak,bestGameStreak);if(pct>s.bestPercent||(pct===s.bestPercent&&correct>s.bestScore)){s.bestPercent=pct;s.bestScore=correct;s.bestTotal=total}x.abc=s;saveExtra(x)}function finish(){document.querySelectorAll('.answer').forEach(x=>x.disabled=true);$('feedback').textContent='Vrijeme! Rezultat: '+correct+'/'+history.length;$('next').disabled=true;$('skip').disabled=true;saveGame()}
$('next').onclick=nextQuestion;$('skip').onclick=()=>{if(answered)return;answered=true;wrong++;gameStreak=0;addHistory(null,'skip');updateStats();nextQuestion()};window.addEventListener('pagehide',saveGame);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveGame()});$('shareResult').onclick=async()=>{const text='KvizToGo ABC · '+correct+'/'+history.length+' točnih';try{if(navigator.share)await navigator.share({title:'KvizToGo ABC',text,url:location.href});else await navigator.clipboard.writeText(text+' '+location.href)}catch(e){}};$('downloadHistory').onclick=()=>{if(!history.length)return;const text=history.map((h,i)=>(i+1)+'. '+h.question+'\n'+h.chosen+'\nTočan: '+h.correct).join('\n\n'),blob=new Blob([text],{type:'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='KvizToGo-ABC-povijest.txt';a.click()};selectMode(MODES[0],document.querySelector('.mode'));
</script></body></html>
