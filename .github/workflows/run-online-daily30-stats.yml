name: Run online Daily30 stats patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-online-daily30-stats.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 patch_online_daily30_stats.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add online-kviz.html
          git diff --cached --quiet || git commit -m "Add Daily 30 stats to online profile"
          git push
