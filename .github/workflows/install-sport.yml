name: Install Sport quiz

on:
  push:
    paths:
      - '.github/sport-install-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Sport.json and wire online quiz
        run: |
          node <<'NODE'
          const fs = require('fs');

          const chunkDir = '.github/tmp_sport_chunks';
          const chunks = Array.from({length: 8}, (_, i) => `${chunkDir}/part${String(i+1).padStart(2,'0')}.txt`);
          const sportText = chunks.map(p => fs.readFileSync(p, 'utf8')).join('');
          const sport = JSON.parse(sportText);
          if (!Array.isArray(sport) || sport.length !== 277) throw new Error(`Sport.json: očekivano 277 pitanja, dobiveno ${sport.length}`);
          for (const q of sport) {
            if (q.type !== 'blitz' || q.topic !== 'Sport' || q.difficulty !== 3 || !q.question || !Array.isArray(q.answers) || !q.answers.length) {
              throw new Error('Sport.json sadrži neispravan zapis.');
            }
          }
          fs.writeFileSync('Sport.json', JSON.stringify(sport, null, 2) + '\n');

          let html = fs.readFileSync('online-kviz.html', 'utf8');

          const sportButton = '          <button class="themed-topic" data-topic="Sport" data-achievements="true" type="button" data-i18n="themeSport">Sport kviz</button>';
          html = html.replace(/^\s*<button class="themed-topic" data-topic="Sport"[^\n]*\n/gm, '');
          const moreplovciButton = '          <button class="themed-topic" data-topic="Moreplovci" data-achievements="true" type="button" data-i18n="themeMoreplovci">Moreplovci</button>';
          if (!html.includes(moreplovciButton)) throw new Error('Nije pronađen Moreplovci tematski gumb.');
          html = html.replace(moreplovciButton, `${moreplovciButton}\n${sportButton}`);

          html = html.replace(/, themeSport: "Sport kviz"/g, '');
          html = html.replace(/, themeSport: "Sport quiz"/g, '');
          html = html.replace('themeGaming: "Svijet Gaminga", themeMoreplovci: "Moreplovci",', 'themeGaming: "Svijet Gaminga", themeMoreplovci: "Moreplovci", themeSport: "Sport kviz",');
          html = html.replace('themeGaming: "World of Gaming", themeMoreplovci: "Seafarers",', 'themeGaming: "World of Gaming", themeMoreplovci: "Seafarers", themeSport: "Sport quiz",');

          const ensureReplace = (oldText, newText, alreadyPresent, label) => {
            if (alreadyPresent && html.includes(alreadyPresent)) return;
            if (!html.includes(oldText)) throw new Error(`Nije pronađeno mjesto za: ${label}`);
            html = html.replace(oldText, newText);
          };

          ensureReplace(
            'const QUESTIONS_URL_MOREPLOVCI = "Moreplovci.json";\n  const QUESTIONS_URL_SVASTARA = "Svastara.json";',
            'const QUESTIONS_URL_MOREPLOVCI = "Moreplovci.json";\n  const QUESTIONS_URL_SPORT = "Sport.json";\n  const QUESTIONS_URL_SVASTARA = "Svastara.json";',
            'const QUESTIONS_URL_SPORT = "Sport.json";',
            'Sport URL'
          );
          ensureReplace(
            'let loadedMoreplovciCount = 0;\n  let loadedSvastaraCount = 0;',
            'let loadedMoreplovciCount = 0;\n  let loadedSportCount = 0;\n  let loadedSvastaraCount = 0;',
            'let loadedSportCount = 0;',
            'Sport brojač'
          );
          ensureReplace(
            'respGaming, respMoreplovci, respSvastara] = await Promise.all([',
            'respGaming, respMoreplovci, respSport, respSvastara] = await Promise.all([',
            'respGaming, respMoreplovci, respSport, respSvastara] = await Promise.all([',
            'Promise destructuring'
          );
          ensureReplace(
            'fetch(QUESTIONS_URL_MOREPLOVCI),\n        fetch(QUESTIONS_URL_SVASTARA),',
            'fetch(QUESTIONS_URL_MOREPLOVCI),\n        fetch(QUESTIONS_URL_SPORT),\n        fetch(QUESTIONS_URL_SVASTARA),',
            'fetch(QUESTIONS_URL_SPORT),',
            'Sport fetch'
          );
          ensureReplace(
            '!respGaming.ok || !respMoreplovci.ok || !respSvastara.ok)',
            '!respGaming.ok || !respMoreplovci.ok || !respSport.ok || !respSvastara.ok)',
            '!respSport.ok',
            'Sport response check'
          );
          ensureReplace(
            'const moreplovciData = await respMoreplovci.json();\n      const svastaraData = await respSvastara.json();',
            'const moreplovciData = await respMoreplovci.json();\n      const sportData = await respSport.json();\n      const svastaraData = await respSvastara.json();',
            'const sportData = await respSport.json();',
            'Sport JSON parse'
          );
          ensureReplace(
            '!Array.isArray(gamingData) || !Array.isArray(moreplovciData) || !Array.isArray(svastaraData))',
            '!Array.isArray(gamingData) || !Array.isArray(moreplovciData) || !Array.isArray(sportData) || !Array.isArray(svastaraData))',
            '!Array.isArray(sportData)',
            'Sport array check'
          );

          if (!html.includes('const normalizedSport = sportData.map')) {
            const marker = '      const normalizedSvastara = svastaraData.map((q, idx) => ({';
            const block = `      const normalizedSport = sportData.map((q, idx) => ({\n        id: q.id ?? "sport-" + idx,\n        type: q.type || "blitz",\n        difficulty: typeof q.difficulty === "number" ? q.difficulty : 3,\n        topic: "Sport",\n        question: q.question || "",\n        answers: Array.isArray(q.answers) ? q.answers : [],\n        image: q.image || null,\n        rarity: normalizeQuestionRarity(q.rarity)\n      }));\n\n`;
            if (!html.includes(marker)) throw new Error('Nije pronađeno mjesto za normalizedSport');
            html = html.replace(marker, block + marker);
          }

          ensureReplace(
            '...normalizedGaming, ...normalizedMoreplovci, ...normalizedSvastara];',
            '...normalizedGaming, ...normalizedMoreplovci, ...normalizedSport, ...normalizedSvastara];',
            '...normalizedGaming, ...normalizedMoreplovci, ...normalizedSport, ...normalizedSvastara];',
            'Sport ALL_QUESTIONS'
          );
          ensureReplace(
            'loadedMoreplovciCount = normalizedMoreplovci.length;\n      loadedSvastaraCount = normalizedSvastara.length;',
            'loadedMoreplovciCount = normalizedMoreplovci.length;\n      loadedSportCount = normalizedSport.length;\n      loadedSvastaraCount = normalizedSvastara.length;',
            'loadedSportCount = normalizedSport.length;',
            'Sport loaded count'
          );

          html = html.replace(/"Gaming": "Svijet Gaminga", "Moreplovci": "Moreplovci"(?:, "Sport": "Sport")*/g, '"Gaming": "Svijet Gaminga", "Moreplovci": "Moreplovci", "Sport": "Sport"');
          html = html.replace(/"Gaming": "World of Gaming", "Moreplovci": "Seafarers"(?:, "Sport": "Sport")*/g, '"Gaming": "World of Gaming", "Moreplovci": "Seafarers", "Sport": "Sport"');

          const sportButtonCount = (html.match(/data-topic="Sport"/g) || []).length;
          const hrThemeCount = (html.match(/themeSport: "Sport kviz"/g) || []).length;
          const enThemeCount = (html.match(/themeSport: "Sport quiz"/g) || []).length;
          if (sportButtonCount !== 1 || hrThemeCount !== 1 || enThemeCount !== 1) {
            throw new Error(`Sport UI validacija nije prošla: button=${sportButtonCount}, hr=${hrThemeCount}, en=${enThemeCount}`);
          }
          for (const required of [
            'const QUESTIONS_URL_SPORT = "Sport.json";',
            'fetch(QUESTIONS_URL_SPORT),',
            'const sportData = await respSport.json();',
            'const normalizedSport = sportData.map',
            '...normalizedSport, ...normalizedSvastara',
            'loadedSportCount = normalizedSport.length;'
          ]) {
            if (!html.includes(required)) throw new Error(`Nedostaje Sport integracija: ${required}`);
          }

          fs.writeFileSync('online-kviz.html', html);
          console.log(`Sport instaliran i provjeren: ${sport.length} pitanja.`);
          NODE

          node scripts/generate-daily-30.mjs

          git config user.name "KvizToGo Bot"
          git config user.email "actions@users.noreply.github.com"
          git add Sport.json online-kviz.html daily30
          git diff --cached --check
          git commit -m "Add Sport quiz to online quiz" || exit 0
          git push
