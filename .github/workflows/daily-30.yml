name: Dnevnih 30

on:
  schedule:
    - cron: "5 22,23 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "*.json"
      - "scripts/generate-daily-30.mjs"
      - "daily30/config.json"

permissions:
  contents: write

concurrency:
  group: daily-30-generator
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Preuzmi najnovija pitanja
        uses: actions/checkout@v4

      - name: Pripremi Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Pripremi cijele mjesece Dnevnih 30
        run: node scripts/generate-daily-30.mjs

      - name: Spremi novi dnevni set
        run: |
          if git diff --quiet -- daily30; then
            echo "Nema novih dnevnih podataka."
            exit 0
          fi
          git config user.name "KvizToGo Daily 30"
          git config user.email "actions@users.noreply.github.com"
          git add daily30
          git commit -m "Generate Daily 30 quiz"
          git push
