name: KvizToGo AI - novo pitanje

on:
  schedule:
    # Jedno novo pitanje svaki sat, sve dok postoji OpenAI API key.
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ai-pitanja.yml"

permissions:
  contents: write

concurrency:
  group: kviztogo-ai-pitanja
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENAI_API_KEY: \${{ secrets.OPENAI_API_KEY }}
      KVIZTOGO_AI_MODEL: \${{ vars.KVIZTOGO_AI_MODEL || 'gpt-4.1-mini' }}
      AI_DAILY_LIMIT: "24"
    steps:
      - name: Preuzmi JSON baze pitanja
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Provjeri kod i 100 formulacija
        run: |
          node --check scripts/ai-question-agent.mjs
          node scripts/ai-question-agent.mjs --dry-run

      - name: Provjeri OpenAI secret
        if: \${{ env.OPENAI_API_KEY == '' }}
        run: echo "::warning::Nema secret OPENAI_API_KEY. AI pitanja nece nastajati dok ga ne dodas u GitHub Actions secrets."

      - name: Generiraj jedno novo neobjavljeno pitanje
        if: \${{ env.OPENAI_API_KEY != '' }}
        run: node scripts/ai-question-agent.mjs

      - name: Spremi pitanje samo u zasebnu AI zbirku
        if: \${{ env.OPENAI_API_KEY != '' }}
        run: |
          git add ai-pitanja/index.json ai-pitanja/zbirka/
          if git diff --cached --quiet; then
            echo "Nema novog pitanja."
            exit 0
          fi
          git config user.name "KvizToGo AI Urednik"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "AI redakcija: novi neobjavljeni nacrt pitanja"
          git pull --rebase origin main
          git push origin HEAD:main
