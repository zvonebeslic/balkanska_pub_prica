name: Remove Blitz percentile sentence
on:
  push:
    paths:
      - '.github/workflows/remove-blitz-percentile.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove Blitz percentile UI
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('online-kviz.html')
          s=p.read_text(encoding='utf-8')
          # Remove the visible Blitz comparison/percentile sentence only.
          patterns=[
            r'\n\s*<[^>]+id=["\'](?:blitz-percentile|profile-blitz-percentile|blitz-ranking)["\'][^>]*>.*?</[^>]+>\s*',
            r'\n\s*<[^>]+class=["\'][^"\']*(?:percentile|ranking)[^"\']*["\'][^>]*>\s*Među najboljih.*?</[^>]+>\s*'
          ]
          total=0
          for pat in patterns:
              s,n=re.subn(pat,'\n',s,count=1,flags=re.S|re.I)
              total+=n
          # Also suppress JS updates to a dedicated percentile element if markup was generated dynamically.
          s=re.sub(r'^.*(?:blitz-percentile|profile-blitz-percentile|blitz-ranking).*$', '', s, flags=re.M)
          if total==0 and 'Među najboljih' not in s and 'Among the top' not in s:
              # dedicated id may have been removed by JS-line cleanup; acceptable
              pass
          # Remove literal generated sentence templates so it cannot reappear.
          s=re.sub(r'^.*Među najboljih.*usporedba s.*rezultata.*$', '', s, flags=re.M)
          s=re.sub(r'^.*Among the top.*comparison with.*results.*$', '', s, flags=re.M|re.I)
          p.write_text(s,encoding='utf-8')
      - name: Validate
        run: |
          ! grep -q 'Među najboljih' online-kviz.html
      - name: Commit
        run: |
          git config user.name 'KvizToGo automation'
          git config user.email 'actions@users.noreply.github.com'
          git add online-kviz.html
          git rm .github/workflows/remove-blitz-percentile.yml
          git commit -m 'Remove Blitz percentile comparison from profile'
          git push