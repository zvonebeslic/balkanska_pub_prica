name: Fix i18n audit
on:
  push:
    branches: [main]
    paths:
      - "scripts/fix-i18n-audit.mjs"
      - ".github/workflows/fix-i18n-audit.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/fix-i18n-audit.mjs
      - run: |
          git config user.name "KvizToGo"
          git config user.email "actions@users.noreply.github.com"
          git add online-kviz.html profil.html sitemap.xml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Dovrši HR EN prijevode na webu"
          git push
