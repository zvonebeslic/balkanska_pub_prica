name: Audit HR EN translations
on:
  push:
    paths:
      - '.github/workflows/audit-fix-hr-en.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit and fix online quiz translations
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('online-kviz.html')
          s=p.read_text(encoding='utf-8')

          # Removed Blitz comparison must be removed from both languages.
          s=re.sub(r'^\s*blitzRankTemplate:\s*"[^"]*",\s*$', '', s, flags=re.M)
          s=re.sub(r'^\s*blitzRankLoading:\s*"[^"]*",\s*$', '', s, flags=re.M)
          s=re.sub(r'^\s*blitzRankNeedGame:\s*"[^"]*",\s*$', '', s, flags=re.M)
          s=re.sub(r'^\s*blitzRankUnavailable:\s*"[^"]*",\s*$', '', s, flags=re.M)

          # Find the playerText HR/EN dictionaries and fail if their key sets differ.
          m=re.search(r'function playerText\(key\) \{\s*const copy = \{\s*hr: \{(.*?)\n\s*\},\s*en: \{(.*?)\n\s*\}\s*\};', s, re.S)
          if not m:
              raise SystemExit('playerText HR/EN dictionaries not found')
          key_re=re.compile(r'^\s*([A-Za-z0-9_]+):', re.M)
          hr=set(key_re.findall(m.group(1)))
          en=set(key_re.findall(m.group(2)))
          if hr != en:
              raise SystemExit(f'playerText key mismatch HR-only={sorted(hr-en)} EN-only={sorted(en-hr)}')

          # Check the main i18n dictionaries when present. We do not guess translations: mismatches fail visibly.
          candidates=[
            r'hr:\s*\{(.*?)\n\s*\},\s*en:\s*\{(.*?)\n\s*\}',
          ]
          mismatches=[]
          for i,mm in enumerate(re.finditer(candidates[0], s, re.S),1):
              h=set(key_re.findall(mm.group(1))); e=set(key_re.findall(mm.group(2)))
              if len(h)>=5 and len(e)>=5 and h!=e:
                  mismatches.append((i,sorted(h-e),sorted(e-h)))
          # playerText is authoritative for profile/ABC additions. Report other large dictionary mismatches without changing unknown copy.
          if mismatches:
              print('Additional dictionary key mismatches detected:', mismatches[:10])

          # Ensure removed helper strings do not remain in either language.
          forbidden=[
            'Miješani načini uključuju', 'Mješani načini uključuju',
            'Mixed modes include additional questions',
            'Among the top {top}% of played Blitz games'
          ]
          for text in forbidden:
              if text in s:
                  raise SystemExit('Removed UI text still present: '+text)

          p.write_text(s,encoding='utf-8')
      - name: Commit fixes
        run: |
          git config user.name 'KvizToGo automation'
          git config user.email 'actions@users.noreply.github.com'
          git add online-kviz.html
          git rm .github/workflows/audit-fix-hr-en.yml
          git commit -m 'Align Croatian and English online quiz UI copy'
          git push