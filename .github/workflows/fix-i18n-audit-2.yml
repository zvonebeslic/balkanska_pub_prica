name: Fix i18n audit 2
on:
  push:
    branches: [main]
    paths:
      - "scripts/fix-i18n-audit-2.mjs"
      - ".github/workflows/fix-i18n-audit-2.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/fix-i18n-audit-2.mjs
      - run: |
          git config user.name "KvizToGo"
          git config user.email "actions@users.noreply.github.com"
          git add profil.html moderation-messages.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Dovrši HR EN poruke i profil"
          git push
