name: Apply leaderboard self hide
on:
  push:
    paths:
      - 'patch_leaderboard_self_hide.py'
      - '.github/workflows/run-leaderboard-self-hide.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python patch_leaderboard_self_hide.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add leaderboards.js
          git commit -m "Hide own leaderboard row immediately" || exit 0
          git push
