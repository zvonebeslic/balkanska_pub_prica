name: Apply Daily30 guest attach
on:
  push:
    paths:
      - 'patch_daily30_guest_attach.py'
      - '.github/workflows/run-daily30-guest-attach.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python patch_daily30_guest_attach.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily30.js
          git commit -m "Attach Daily30 guest results to profile" || exit 0
          git push
