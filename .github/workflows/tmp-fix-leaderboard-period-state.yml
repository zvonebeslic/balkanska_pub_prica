name: Temporary leaderboard period state patch
on:
  push:
    paths:
      - '.github/workflows/tmp-fix-leaderboard-period-state.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .tmp_fix_leaderboard_period_state.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add leaderboards.js
          git diff --cached --quiet && exit 0
          git commit -m "Fix leaderboard period state and navigation"
          git push
