name: Apply Daily30 tracking and visibility fix

on:
  push:
    paths:
      - 'patch_daily30_tracking_visibility.py'
      - '.github/workflows/run-daily30-tracking-visibility-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted patch
        run: python patch_daily30_tracking_visibility.py
      - name: Commit only intended files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add online-kviz.html leaderboards.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix Daily30 tracking and leaderboard visibility"
            git push
          fi
