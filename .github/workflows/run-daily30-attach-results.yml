name: Apply Daily30 attach results
on:
  push:
    paths:
      - 'patch_daily30_attach_results.py'
      - '.github/workflows/run-daily30-attach-results.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python patch_daily30_attach_results.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily30.js
          git commit -m "Restore Daily30 guest played status after login" || exit 0
          git push
