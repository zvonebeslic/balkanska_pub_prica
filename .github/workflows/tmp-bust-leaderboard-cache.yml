name: tmp-bust-leaderboard-cache
on:
  push:
    paths:
      - '.github/workflows/tmp-bust-leaderboard-cache.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .tmp_bust_leaderboard_cache.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add online-kviz.html
          git diff --cached --quiet && exit 0
          git commit -m "Bust leaderboard script cache"
          git push
