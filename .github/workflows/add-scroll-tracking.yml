name: Add Scroll Tracking
on:
  push:
    branches: [main]
    paths:
      - "scripts/add-scroll-tracking.mjs"
      - ".github/workflows/add-scroll-tracking.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/add-scroll-tracking.mjs
      - run: |
          if git diff --quiet -- scroll-znanje.html; then exit 0; fi
          git config user.name "KvizToGo"
          git config user.email "actions@users.noreply.github.com"
          git add scroll-znanje.html
          git commit -m "Poveži Scrollanjem do Znanja sa Supabase statistikom"
          git push
