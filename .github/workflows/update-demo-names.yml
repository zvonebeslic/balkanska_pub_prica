name: Update demo names

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-demo-names.yml'

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch leaderboard demo names
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('leaderboards.js')
          s=p.read_text(encoding='utf-8')
          replacements={
            "'Ivan7'":"'7Ivan'",
            "'Ana4'":"'4Ana'",
            "'Marko9'":"'9Marko'",
            "'Petra6'":"'Јово'",
            "'Luka3'":"'Стефан'",
            "'Marta8'":"'Светлана'",
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing {old}')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add leaderboards.js
          git diff --cached --quiet || git commit -m "Diversify demo leaderboard names"
          git push
