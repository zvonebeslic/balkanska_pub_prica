name: Run Daily30 alignment patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-daily30-align-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 patch_daily30_align.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily30.js
          git diff --cached --quiet || git commit -m "Align Daily 30 button with quiz modes"
          git push
