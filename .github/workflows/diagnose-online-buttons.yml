name: Diagnose online quiz buttons
on:
  push:
    paths:
      - '.github/workflows/diagnose-online-buttons.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Browser runtime diagnosis
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          python3 -m http.server 8000 >/tmp/server.log 2>&1 &
          cat > test-runtime.js <<'EOF'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            page.on('console',m=>console.log('CONSOLE',m.type(),m.text()));
            page.on('pageerror',e=>console.log('PAGEERROR',e.stack||e.message));
            page.on('response',r=>{if(r.status()>=400) console.log('HTTP',r.status(),r.url())});
            await page.goto('http://127.0.0.1:8000/online-kviz.html',{waitUntil:'networkidle',timeout:120000});
            await page.waitForTimeout(2500);
            console.log('QUESTION_BEFORE',await page.locator('#question-text').textContent().catch(()=>null));
            console.log('STARTS',await page.locator('button').allTextContents());
            const start=page.locator('#btn-start-quiz');
            console.log('START_COUNT',await start.count());
            if(await start.count()){console.log('START_DISABLED',await start.isDisabled());await start.click();await page.waitForTimeout(1000);}
            console.log('QUESTION_AFTER',await page.locator('#question-text').textContent().catch(()=>null));
            await browser.close();
          })();
          EOF
          node test-runtime.js
