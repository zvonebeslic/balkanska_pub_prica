name: Diagnose online quiz buttons
on:
  push:
    paths:
      - '.github/workflows/diagnose-online-buttons.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check inline JavaScript and JSON files
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess, json
          s=Path('online-kviz.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script([^>]*)>(.*?)</script>',s,re.S|re.I)
          bad=[]
          for i,(attrs,code) in enumerate(blocks):
            if 'application/ld+json' in attrs.lower() or not code.strip(): continue
            p=Path(f'/tmp/script-{i}.js'); p.write_text(code,encoding='utf-8')
            r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
            if r.returncode:
              print('BAD SCRIPT',i); print(r.stderr); bad.append(i)
          if bad: raise SystemExit('Syntax errors in scripts '+str(bad))
          print('All executable inline scripts parse OK')
          files=['questions-blitz.json','FloraFauna.json','Film.json','Glazba.json','AntickiRim.json','AmerickiPredsjednici.json','Zemljopis.json','Nogomet.json','Znanost.json','Knjizevnost.json','povijest.json','Gaming.json','Moreplovci.json','Sport.json','Svastara.json']
          files += list(map(str,Path('ABC pitanja').glob('*.json')))
          for f in files:
            try:
              data=json.loads(Path(f).read_text(encoding='utf-8'))
              if not isinstance(data,list): raise ValueError('root is not list')
              print('OK JSON',f,len(data))
            except Exception as e:
              print('BAD JSON',f,repr(e)); raise
