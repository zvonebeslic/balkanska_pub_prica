name: Repair online quiz initialization
on:
  push:
    paths:
      - '.github/workflows/diagnose-online-buttons.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore missing percentile note lookup
        shell: python
        run: |
          from pathlib import Path
          p=Path('online-kviz.html')
          s=p.read_text(encoding='utf-8')
          old='  function updateBlitzPercentileNote() {\n\n    if (!note) return;'
          new='  function updateBlitzPercentileNote() {\n    const note = document.getElementById("blitz-percentile-note");\n    if (!note) return;'
          if old not in s:
            raise SystemExit('Expected broken code not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - name: Commit repair
        run: |
          git config user.name "KvizToGo Repair"
          git config user.email "actions@users.noreply.github.com"
          git add online-kviz.html
          git commit -m "Fix online quiz initialization and question loading"
          git push
