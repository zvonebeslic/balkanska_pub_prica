name: Add Scroll Circle
on:
  push:
    branches: [main]
    paths:
      - "scripts/add-scroll-circle.mjs"
      - ".github/workflows/add-scroll-circle.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/add-scroll-circle.mjs
      - run: |
          if git diff --quiet -- online-kviz.html; then exit 0; fi
          git config user.name "KvizToGo"
          git config user.email "actions@users.noreply.github.com"
          git add online-kviz.html
          git commit -m "Dodaj krug na Scrollanjem do Znanja"
          git push
