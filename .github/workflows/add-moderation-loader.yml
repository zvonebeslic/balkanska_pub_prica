name: Add moderation loader

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/add-moderation-loader.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add moderation messages script
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('online-kviz.html')
          text = p.read_text(encoding='utf-8')
          tag = '<script src="moderation-messages.js?v=20260906-1"></script>'
          if tag not in text:
              marker = '<script src="leaderboards.js?v=20260831-2"></script>'
              if marker not in text:
                  raise SystemExit('leaderboards script marker not found')
              text = text.replace(marker, marker + '\n' + tag, 1)
              p.write_text(text, encoding='utf-8')
          PY

      - name: Commit
        run: |
          if git diff --quiet -- online-kviz.html; then
            echo "Loader already present."
            exit 0
          fi
          git config user.name "KvizToGo Maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add online-kviz.html
          git commit -m "Load moderation messages on online quiz"
          git push
