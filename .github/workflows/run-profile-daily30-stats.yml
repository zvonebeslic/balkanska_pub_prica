name: Run profile Daily30 stats patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-profile-daily30-stats.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 patch_profile_daily30_stats.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profil.html
          git diff --cached --quiet || git commit -m "Add Daily 30 played stats to profile"
          git push
