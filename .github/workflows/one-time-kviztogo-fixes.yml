name: One-time KvizToGo fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-kviztogo-fixes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply requested fixes
        run: python3 .github/one_time_fix.py

      - name: Commit requested fixes
        run: |
          git config user.name "KvizToGo maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add index.html profil.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix map markers, quiz history and publish preview"
          git push origin main
