name: Restore quiz known good
on:
  push:
    paths:
      - '.github/workflows/restore-quiz-known-good.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore online quiz from verified working integration
        run: |
          git checkout 27d0ce986a3ba52fd2ddf44b024d630b3936e757 -- online-kviz.html
          git config user.name 'KvizToGo automation'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/restore-quiz-known-good.yml
          git add online-kviz.html
          git commit -m 'Restore verified working online quiz'
          git push
