name: Secure guest moderation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/secure-guest-moderation.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Patch guest security
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 exact match, got {count}")
              return text.replace(old, new, 1)

          # daily30.js
          p = Path('daily30.js')
          s = p.read_text(encoding='utf-8')
          s = replace_once(s,
              '  const GUEST_IDENTITY_KEY = "kviztogo_guest_identity_v1";\n  const PLAYER_CONTEXT_KEY = "kviztogo_daily30_player_context_v1";',
              '  const GUEST_IDENTITY_KEY = "kviztogo_guest_identity_v1";\n  const GUEST_SECRET_KEY = "kviztogo_guest_secret_v1";\n  const PLAYER_CONTEXT_KEY = "kviztogo_daily30_player_context_v1";',
              'daily30 secret constant')
          s = replace_once(s,
              '  function saveResults(results){try{localStorage.setItem(resultStorageKey(),JSON.stringify(results));}catch(error){console.warn("Dnevnih 30 rezultat nije spremljen:",error);}}\n  function getCustomGuestName()',
              '''  function saveResults(results){try{localStorage.setItem(resultStorageKey(),JSON.stringify(results));}catch(error){console.warn("Dnevnih 30 rezultat nije spremljen:",error);}}\n  function currentGuestId(){try{const identity=JSON.parse(localStorage.getItem(GUEST_IDENTITY_KEY)||"null");return identity?.id?String(identity.id):null;}catch{return null;}}\n  function createGuestSecret(){const bytes=new Uint8Array(32);crypto.getRandomValues(bytes);return Array.from(bytes,b=>b.toString(16).padStart(2,"0")).join("");}\n  function getOrCreateGuestSecret(){const guestId=currentGuestId();if(!guestId)return null;try{const saved=JSON.parse(localStorage.getItem(GUEST_SECRET_KEY)||"null");if(saved?.guestId===guestId&&typeof saved.secret==="string"&&saved.secret.length>=32)return saved.secret;const secret=createGuestSecret();localStorage.setItem(GUEST_SECRET_KEY,JSON.stringify({guestId,secret}));return secret;}catch(error){console.warn("Sigurnosni ključ gosta nije dostupan:",error);return null;}}\n  function getCustomGuestName()''',
              'daily30 secret helpers')

          pattern = r'  async function syncAuthenticatedDaily30\(guestId=null\)\{.*?\n  async function syncDaily30AuthSession'
          replacement = '''  async function syncAuthenticatedDaily30(guestId=null){let client=null;try{client=typeof supabaseClient!=="undefined"?supabaseClient:null;}catch(_){}if(!client)return false;try{if(guestId){const guestSecret=getOrCreateGuestSecret();if(guestSecret){const attached=await client.rpc("daily30_attach_guest_to_current_user_secure",{p_guest_player_key:`guest:${guestId}`,p_guest_secret:guestSecret});if(attached.error||attached.data?.ok===false)console.warn("Daily30 sigurni guest attach nije uspio:",attached.error||attached.data);}}const mine=await client.rpc("daily30_get_my_results");if(mine.error)throw mine.error;if(mine.data&&typeof mine.data==="object")saveResults(mine.data);renderCalendar();updateSelectionNote();window.KvizLeaderboards?.reloadRemote?.();window.KvizLeaderboards?.refreshAll?.();return true;}catch(error){console.warn("Daily30 profilni rezultati nisu sinkronizirani:",error);return false;}}\n  async function syncDaily30AuthSession'''
          s, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1: raise SystemExit(f'daily30 syncAuthenticatedDaily30: {n}')

          pattern = r'  async function publishOfficialResult\(result=getResult\(zonedDateKey\(\)\)\)\{.*?\n  async function setLeaderboardVisibility\(value\)\{.*?\n  function complete\('
          replacement = '''  async function publishOfficialResult(result=getResult(zonedDateKey())){if(!result?.official)return false;let client=null;try{client=typeof supabaseClient!=="undefined"?supabaseClient:null;}catch(_){client=null;}if(!client)return false;const context=getPlayerContext(),playerKey=leaderboardPlayerKey();if(!playerKey)return false;let playerName=getPublicPlayerName();if(context?.isGuest){const custom=getCustomGuestName();if(!custom)return false;playerName=custom;}const userId=context&&!context.isGuest?context.userId:null;try{if(playerKey.startsWith("guest:")){const guestSecret=getOrCreateGuestSecret();if(!guestSecret)return false;const claim=await client.rpc("daily30_claim_name_secure",{p_player_key:playerKey,p_player_name:playerName,p_guest_secret:guestSecret});if(claim.error||claim.data!==true)return false;await client.rpc("daily30_set_visibility_secure",{p_player_key:playerKey,p_visible:getLeaderboardVisibility(),p_guest_secret:guestSecret});const saved=await client.rpc("daily30_save_result_secure",{p_player_key:playerKey,p_player_name:playerName,p_quiz_date:result.date,p_score:Math.max(0,Number(result.score)||0),p_duration_seconds:Math.max(0,Number(result.durationSeconds)||0),p_guest_secret:guestSecret});if(saved.error||saved.data!==true)return false;}else{const claim=await client.rpc("daily30_claim_name",{p_player_key:playerKey,p_user_id:userId,p_player_name:playerName});if(claim.error||claim.data!==true)return false;await client.rpc("daily30_set_visibility",{p_player_key:playerKey,p_visible:getLeaderboardVisibility()});const saved=await client.rpc("daily30_save_result",{p_player_key:playerKey,p_user_id:userId,p_player_name:playerName,p_quiz_date:result.date,p_score:Math.max(0,Number(result.score)||0),p_duration_seconds:Math.max(0,Number(result.durationSeconds)||0)});if(saved.error||saved.data!==true)return false;}window.KvizLeaderboards?.reloadRemote?.();return true;}catch(error){console.warn("Dnevnih 30 rezultat nije objavljen na ljestvici:",error);return false;}}\n  async function setLeaderboardVisibility(value){const visible=setLeaderboardVisibilityLocal(value),playerKey=leaderboardPlayerKey();let client=null;try{client=typeof supabaseClient!=="undefined"?supabaseClient:null;}catch(_){client=null;}if(client&&playerKey){try{if(playerKey.startsWith("guest:")){const guestSecret=getOrCreateGuestSecret();if(guestSecret)await client.rpc("daily30_set_visibility_secure",{p_player_key:playerKey,p_visible:visible,p_guest_secret:guestSecret});}else await client.rpc("daily30_set_visibility",{p_player_key:playerKey,p_visible:visible});}catch(error){console.warn("Vidljivost ljestvice nije spremljena:",error);}}window.KvizLeaderboards?.reloadRemote?.();window.KvizLeaderboards?.refreshAll?.();return visible;}\n  function complete('''
          s, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1: raise SystemExit(f'daily30 publish/visibility: {n}')

          s = replace_once(s,
              'const claim=await client.rpc("daily30_claim_name",{p_player_key:playerKey,p_user_id:null,p_player_name:value});',
              'const guestSecret=getOrCreateGuestSecret();if(!guestSecret)return;const claim=await client.rpc("daily30_claim_name_secure",{p_player_key:playerKey,p_player_name:value,p_guest_secret:guestSecret});',
              'daily30 guest name claim')
          s = replace_once(s,
              'syncNow,leaderboardPlayerKey,getLeaderboardVisibility,setLeaderboardVisibility,publishOfficialResult,formatDuration',
              'syncNow,leaderboardPlayerKey,getGuestSecret:getOrCreateGuestSecret,getLeaderboardVisibility,setLeaderboardVisibility,publishOfficialResult,formatDuration',
              'daily30 export secret')
          p.write_text(s, encoding='utf-8')

          # guest-profile-sync.js
          p = Path('guest-profile-sync.js')
          s = p.read_text(encoding='utf-8')
          s = replace_once(s,
              '  const GUEST_IDENTITY_KEY = "kviztogo_guest_identity_v1";\n  const DAILY30_RESULTS_BASE_KEY',
              '  const GUEST_IDENTITY_KEY = "kviztogo_guest_identity_v1";\n  const GUEST_SECRET_KEY = "kviztogo_guest_secret_v1";\n  const DAILY30_RESULTS_BASE_KEY',
              'guest sync secret constant')
          insert_after = '''  function readGuestId() {\n    try {\n      const saved = JSON.parse(localStorage.getItem(GUEST_IDENTITY_KEY) || "null");\n      return saved?.id ? String(saved.id) : null;\n    } catch (_) {\n      return null;\n    }\n  }'''
          helper = insert_after + '''\n\n  function createGuestSecret() {\n    const bytes = new Uint8Array(32);\n    crypto.getRandomValues(bytes);\n    return Array.from(bytes, b => b.toString(16).padStart(2, "0")).join("");\n  }\n\n  function getOrCreateGuestSecret(guestId) {\n    if (!guestId) return null;\n    try {\n      const saved = JSON.parse(localStorage.getItem(GUEST_SECRET_KEY) || "null");\n      if (saved?.guestId === guestId && typeof saved.secret === "string" && saved.secret.length >= 32) return saved.secret;\n      const secret = createGuestSecret();\n      localStorage.setItem(GUEST_SECRET_KEY, JSON.stringify({ guestId, secret }));\n      return secret;\n    } catch (_) {\n      return null;\n    }\n  }'''
          s = replace_once(s, insert_after, helper, 'guest sync secret helper')
          s = replace_once(s,
              '''      const attached = await client.rpc("daily30_attach_guest_to_current_user", {\n        p_guest_player_key: `guest:${guestId}`\n      });''',
              '''      const guestSecret = getOrCreateGuestSecret(guestId);\n      if (!guestSecret) return false;\n      const attached = await client.rpc("daily30_attach_guest_to_current_user_secure", {\n        p_guest_player_key: `guest:${guestId}`,\n        p_guest_secret: guestSecret\n      });''',
              'guest sync secure attach')
          p.write_text(s, encoding='utf-8')

          # moderation-messages.js
          p = Path('moderation-messages.js')
          s = p.read_text(encoding='utf-8')
          s = replace_once(s,
              '  const GUEST_IDENTITY_KEY = "kviztogo_guest_identity_v1";\n  const STYLE_ID',
              '  const GUEST_IDENTITY_KEY = "kviztogo_guest_identity_v1";\n  const GUEST_SECRET_KEY = "kviztogo_guest_secret_v1";\n  const STYLE_ID',
              'moderation secret constant')
          anchor = '''  function saveGuestIdentity(identity) {\n    try { localStorage.setItem(GUEST_IDENTITY_KEY, JSON.stringify(identity)); return true; }\n    catch (_) { return false; }\n  }'''
          helper = anchor + '''\n\n  function createGuestSecret() {\n    const bytes = new Uint8Array(32);\n    crypto.getRandomValues(bytes);\n    return Array.from(bytes, b => b.toString(16).padStart(2, "0")).join("");\n  }\n\n  function getOrCreateGuestSecret() {\n    const guest = getGuestIdentity();\n    if (!guest?.id) return null;\n    const guestId = String(guest.id);\n    try {\n      const saved = JSON.parse(localStorage.getItem(GUEST_SECRET_KEY) || "null");\n      if (saved?.guestId === guestId && typeof saved.secret === "string" && saved.secret.length >= 32) return saved.secret;\n      const secret = createGuestSecret();\n      localStorage.setItem(GUEST_SECRET_KEY, JSON.stringify({ guestId, secret }));\n      return secret;\n    } catch (_) {\n      return null;\n    }\n  }\n\n  async function ensureGuestSecretRegistered(identity) {\n    if (!identity?.isGuest) return null;\n    const client = getClient();\n    const secret = getOrCreateGuestSecret();\n    if (!client || !secret) return null;\n    try { await client.rpc("daily30_register_guest_secret", { p_player_key: identity.playerKey, p_guest_secret: secret }); } catch (_) {}\n    return secret;\n  }'''
          s = replace_once(s, anchor, helper, 'moderation secret helper')
          s = replace_once(s,
              '      const { data, error } = await client.rpc("moderation_get_guest_state", { p_player_key: identity.playerKey });',
              '      const guestSecret = await ensureGuestSecretRegistered(identity);\n      if (!guestSecret) return null;\n      const { data, error } = await client.rpc("moderation_get_guest_state_secure", { p_player_key: identity.playerKey, p_guest_secret: guestSecret });',
              'moderation secure state')
          s = replace_once(s,
              '? await client.rpc("moderation_get_guest_messages", { p_player_key: identity.playerKey })',
              '? await client.rpc("moderation_get_guest_messages_secure", { p_player_key: identity.playerKey, p_guest_secret: await ensureGuestSecretRegistered(identity) })',
              'moderation secure messages')
          s = replace_once(s,
              '? await client.rpc("moderation_mark_guest_message_read", { p_id: id, p_player_key: identity.playerKey })',
              '? await client.rpc("moderation_mark_guest_message_read_secure", { p_id: id, p_player_key: identity.playerKey, p_guest_secret: await ensureGuestSecretRegistered(identity) })',
              'moderation secure mark read')
          s = replace_once(s,
              '? await client.rpc("moderation_resolve_guest_name", { p_player_key: identity.playerKey, p_new_name: newName })',
              '? await client.rpc("moderation_resolve_guest_name_secure", { p_player_key: identity.playerKey, p_new_name: newName, p_guest_secret: await ensureGuestSecretRegistered(identity) })',
              'moderation secure resolve')
          s = replace_once(s,
              '        if (state?.name_requires_change) {',
              '        if (state?.name_requires_change && (message.message_type || "name_restriction") === "name_restriction") {',
              'moderation rename only restriction')
          p.write_text(s, encoding='utf-8')

          # Cache bumps in online-kviz.html
          p = Path('online-kviz.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('daily30.js?v=20260825-2','daily30.js?v=20260906-3')
          s = s.replace('moderation-messages.js?v=20260906-2','moderation-messages.js?v=20260906-3')
          s = s.replace('moderation-messages.js?v=20260906-1','moderation-messages.js?v=20260906-3')
          if 'guest-profile-sync.js?v=' in s:
              s = re.sub(r'guest-profile-sync\.js\?v=[^"\']+', 'guest-profile-sync.js?v=20260906-2', s)
          p.write_text(s, encoding='utf-8')
          PY
      - name: JavaScript syntax check
        run: |
          node --check daily30.js
          node --check guest-profile-sync.js
          node --check moderation-messages.js
      - name: Verify secure RPC references
        run: |
          grep -q "daily30_claim_name_secure" daily30.js
          grep -q "daily30_attach_guest_to_current_user_secure" guest-profile-sync.js
          grep -q "moderation_get_guest_messages_secure" moderation-messages.js
          grep -q "daily30.js?v=20260906-3" online-kviz.html
          grep -q "moderation-messages.js?v=20260906-3" online-kviz.html
      - name: Commit
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "KvizToGo Security"
          git config user.email "actions@users.noreply.github.com"
          git add daily30.js guest-profile-sync.js moderation-messages.js online-kviz.html
          git commit -m "Secure guest identity and moderation RPCs"
          git push
