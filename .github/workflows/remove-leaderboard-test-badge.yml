name: Remove leaderboard test badge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-leaderboard-test-badge.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove GitHub test badge
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('online-kviz.html')
          s=p.read_text(encoding='utf-8')
          old='      <span class="leaderboard-test-badge">GitHub test</span>\n'
          if old not in s:
              raise SystemExit('GitHub test badge not found')
          p.write_text(s.replace(old,'',1),encoding='utf-8')
          PY
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add online-kviz.html
          git diff --cached --quiet || git commit -m "Remove leaderboard GitHub test badge"
          git push
