name: Remove temporary multiplayer avatars
on:
  push:
    paths:
      - '.github/workflows/hide-multiplayer-avatars.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hide temporary avatars
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('multiplayer.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('.face{width:66px;', '.face{display:none;width:66px;', 1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add multiplayer.html
          git diff --cached --quiet && exit 0
          git commit -m "Hide temporary multiplayer avatars"
          git push