name: Apply ABC integration
on:
  push:
    paths:
      - '.github/workflows/apply-abc-integration.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch online quiz
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('online-kviz.html')
          s=p.read_text(encoding='utf-8')
          original=s

          def rep(old,new,count=1):
              global s
              if old not in s:
                  raise SystemExit('Missing target: '+old[:100])
              s=s.replace(old,new,count)

          # Local profile: ABC is its own mode, while overall totals still include it.
          rep('''        blitz60: createEmptyModeStats(),\n        relax: createEmptyModeStats(),\n        themed: createEmptyModeStats()''','''        blitz60: createEmptyModeStats(),\n        relax: createEmptyModeStats(),\n        themed: createEmptyModeStats(),\n        abc: createEmptyModeStats()''',2)
          rep('''        blitz60: normalizeModeStats(s.modeStats?.blitz60),\n        relax: normalizeModeStats(s.modeStats?.relax),\n        themed: normalizeModeStats(s.modeStats?.themed)''','''        blitz60: normalizeModeStats(s.modeStats?.blitz60),\n        relax: normalizeModeStats(s.modeStats?.relax),\n        themed: normalizeModeStats(s.modeStats?.themed),\n        abc: normalizeModeStats(s.modeStats?.abc)''')
          rep('''        blitz60: mergeModeStatsAdditive(a.modeStats.blitz60, b.modeStats.blitz60),\n        relax: mergeModeStatsAdditive(a.modeStats.relax, b.modeStats.relax),\n        themed: mergeModeStatsAdditive(a.modeStats.themed, b.modeStats.themed)''','''        blitz60: mergeModeStatsAdditive(a.modeStats.blitz60, b.modeStats.blitz60),\n        relax: mergeModeStatsAdditive(a.modeStats.relax, b.modeStats.relax),\n        themed: mergeModeStatsAdditive(a.modeStats.themed, b.modeStats.themed),\n        abc: mergeModeStatsAdditive(a.modeStats.abc, b.modeStats.abc)''')

          # Finalized ABC games go to a separate local ABC bucket.
          s,n=re.subn(r'''const modeKey = currentLocalGameMode === "themed" \|\| currentLocalGameMode === "abc_themed"\s*\? "themed"\s*:\s*currentLocalGameMode === "relax" \|\| currentLocalGameMode === "abc_relax"\s*\? "relax"\s*:\s*"blitz60";''','''const modeKey = String(currentLocalGameMode || "").startsWith("abc_")\n      ? "abc"\n      : currentLocalGameMode === "themed"\n        ? "themed"\n        : currentLocalGameMode === "relax"\n          ? "relax"\n          : "blitz60";''',s)
          if n != 1: raise SystemExit(f'finalize modeKey replacements={n}')

          # Supabase: every ABC variant is one quiz_mode=abc, topic stays metadata.
          rep('''  async function startQuizTracking() {''','''  function getTrackingQuizMode() {\n    return isAbcMode() ? "abc" : currentMode;\n  }\n\n  function getTrackedQuestionText(question) {\n    if (isAbcMode() || question?.type === "abc") {\n      const topic = String(question?.topic || getTrackingTopic() || "Svaštara").trim();\n      return `ABC · ${topic} · ${question?.question || ""}`;\n    }\n    return question?.question || "";\n  }\n\n  async function startQuizTracking() {''')
          rep('''          quiz_mode: currentMode,\n          topic: getTrackingTopic(),''','''          quiz_mode: getTrackingQuizMode(),\n          topic: getTrackingTopic(),''')
          rep('''          question_text: question.question || "",\n          question_topic: question.topic || null,\n          question_type: question.type || null,\n          quiz_mode: currentMode,''','''          question_text: getTrackedQuestionText(question),\n          question_topic: question.topic || getTrackingTopic() || null,\n          question_type: isAbcMode() ? "abc" : (question.type || null),\n          quiz_mode: getTrackingQuizMode(),''')
          # votes also use unified mode without changing their text contract
          s=s.replace('''          quiz_mode: currentMode,\n          selected_theme: getTrackingTopic(),\n          vote,''','''          quiz_mode: getTrackingQuizMode(),\n          selected_theme: getTrackingTopic(),\n          vote,''',1)

          # ABC ordering: never AAA/BBB/CCC. Answer positions inside each question are untouched.
          rep('''  function resetQuestionQueue() {\n    questionQueue = [];''','''  let recentAbcCorrectKeys = [];\n\n  function resetQuestionQueue() {\n    questionQueue = [];\n    recentAbcCorrectKeys = [];''')
          rep('''  function pickFromQueueRespectTopicCooldown() {\n    if (questionQueue.length === 0) return null;''','''  function pickFromQueueRespectTopicCooldown() {\n    if (questionQueue.length === 0) return null;\n\n    if (isAbcMode()) {\n      const blockedKey = recentAbcCorrectKeys.length >= 2 &&\n        recentAbcCorrectKeys[recentAbcCorrectKeys.length - 1] === recentAbcCorrectKeys[recentAbcCorrectKeys.length - 2]\n          ? recentAbcCorrectKeys[recentAbcCorrectKeys.length - 1]\n          : null;\n      let idx = questionQueue.length - 1;\n      if (blockedKey) {\n        const found = questionQueue.findLastIndex(q => String(q?.correctAnswerKey || "").toUpperCase() !== blockedKey);\n        if (found >= 0) idx = found;\n      }\n      const chosen = questionQueue.splice(idx, 1)[0] || null;\n      if (chosen) {\n        recentAbcCorrectKeys.push(String(chosen.correctAnswerKey || "").toUpperCase());\n        if (recentAbcCorrectKeys.length > 2) recentAbcCorrectKeys.shift();\n      }\n      return chosen;\n    }''')

          # History becomes visible immediately after an answer, including ABC.
          marker='''    list.insertBefore(li, list.firstChild);\n    list.scrollTop = 0;'''
          if marker in s:
              s=s.replace(marker,'''    list.insertBefore(li, list.firstChild);\n    list.scrollTop = 0;\n    document.body.classList.add("quiz-results-visible");''',1)
          else:
              raise SystemExit('history insertion marker missing')

          # ABC profile card is generated from the existing themed card, preserving current styling.
          rep('''  function updatePlayerStatsUI() {''','''  function ensureAbcProfileCard() {\n    if (document.getElementById("profile-abc-title")) return;\n    const title = document.getElementById("profile-themed-title");\n    if (!title) return;\n    let card = title.parentElement;\n    while (card && !(card.querySelector?.("#themed-total-result") && card.querySelector?.("#themed-best-result"))) card = card.parentElement;\n    if (!card || !card.parentElement) return;\n    const clone = card.cloneNode(true);\n    const idMap = {\n      "profile-themed-title":"profile-abc-title", "profile-themed-copy":"profile-abc-copy",\n      "themed-total-result":"abc-total-result", "themed-total-percent":"abc-total-percent",\n      "themed-best-result":"abc-best-result", "themed-best-percent":"abc-best-percent",\n      "themed-games-played":"abc-games-played", "themed-longest-streak":"abc-longest-streak",\n      "themed-result-label":"abc-result-label", "themed-best-label":"abc-best-label",\n      "themed-games-label":"abc-games-label", "themed-streak-label":"abc-streak-label",\n      "themed-topics-chip":"abc-topics-chip"\n    };\n    clone.querySelectorAll("[id]").forEach(el => { if (idMap[el.id]) el.id = idMap[el.id]; });\n    card.insertAdjacentElement("afterend", clone);\n  }\n\n  function updatePlayerStatsUI() {\n    ensureAbcProfileCard();''')
          rep('''    const themed = localStats.modeStats.themed;''','''    const themed = localStats.modeStats.themed;\n    const abc = localStats.modeStats.abc;''')
          rep('''    setModeStats("themed", themed);\n    setModeStats("daily30", getOnlineDaily30ProfileStats());''','''    setModeStats("themed", themed);\n    setModeStats("abc", abc);\n    setModeStats("daily30", getOnlineDaily30ProfileStats());\n    setText("profile-abc-title", "ABC");\n    setText("profile-abc-copy", currentLang === "en" ? "All ABC quiz variants together." : "Sve ABC vrste kviza zajedno.");\n    setText("abc-result-label", currentLang === "en" ? "Total result" : "Ukupni rezultat");\n    setText("abc-best-label", currentLang === "en" ? "Best game" : "Najbolja partija");\n    setText("abc-games-label", currentLang === "en" ? "Games" : "Partije");\n    setText("abc-streak-label", currentLang === "en" ? "Longest correct streak" : "Najduži niz točnih");\n    setText("abc-topics-chip", currentLang === "en" ? `${abc.themesPlayed.length} topics` : `${abc.themesPlayed.length} tema`);''')

          # ABC crowns as a separate achievement group.
          rep('''    const relaxGames = Math.max(0, Number(localStats.modeStats?.relax?.gamesPlayed) || 0);''','''    const relaxGames = Math.max(0, Number(localStats.modeStats?.relax?.gamesPlayed) || 0);\n    const abcGames = Math.max(0, Number(localStats.modeStats?.abc?.gamesPlayed) || 0);''')
          rep('''    groups.push(makeGamesGroup("relax-games", "Odigrane partije Bez vremena", "No-timer games played", relaxGames, "Bez vremena", "No-timer"));''','''    groups.push(makeGamesGroup("relax-games", "Odigrane partije Bez vremena", "No-timer games played", relaxGames, "Bez vremena", "No-timer"));\n    groups.push(makeGamesGroup("abc-games", "Odigrane ABC partije", "ABC games played", abcGames, "ABC", "ABC", [1, 5, 10, 25, 50, 100, 250, 500]));''')

          if s==original: raise SystemExit('No changes made')
          p.write_text(s,encoding='utf-8')
          print('patched online-kviz.html', len(original), '->', len(s))
      - name: Validate key integration markers
        run: |
          grep -q 'function getTrackingQuizMode' online-kviz.html
          grep -q 'recentAbcCorrectKeys' online-kviz.html
          grep -q 'abc: createEmptyModeStats' online-kviz.html
          grep -q 'Odigrane ABC partije' online-kviz.html
          grep -q 'ABC · ${topic} ·' online-kviz.html
      - name: Commit patched page and remove one-shot workflow
        run: |
          git config user.name 'KvizToGo automation'
          git config user.email 'actions@users.noreply.github.com'
          git add online-kviz.html
          git rm .github/workflows/apply-abc-integration.yml
          git commit -m 'Finish ABC integration in online quiz'
          git push
