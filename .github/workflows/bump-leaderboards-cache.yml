name: Bump leaderboard cache
on:
  push:
    paths:
      - '.github/leaderboards-cache-trigger.txt'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump leaderboard script version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('online-kviz.html')
          s=p.read_text()
          old='leaderboards.js?v=20260831-2'
          new='leaderboards.js?v=20260912-1'
          if old not in s:
              raise SystemExit('Old leaderboard script version not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Remove temporary files
        run: rm -f .github/workflows/bump-leaderboards-cache.yml .github/leaderboards-cache-trigger.txt
      - name: Commit cache bump
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add online-kviz.html .github
          git commit -m 'Bump leaderboard script cache version'
          git push