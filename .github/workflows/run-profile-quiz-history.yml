name: Run profile quiz history patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-profile-quiz-history.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 patch_profile_quiz_history.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profil.html
          git diff --cached --quiet || git commit -m "Separate active quizzes from quiz history"
          git push
