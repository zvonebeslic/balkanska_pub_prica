name: Fix scroll matched answer
on:
  push:
    branches: [main]
    paths:
      - "scripts/fix-scroll-matched-answer.mjs"
      - ".github/workflows/fix-scroll-matched-answer.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/fix-scroll-matched-answer.mjs
      - run: |
          git config user.name "KvizToGo"
          git config user.email "actions@users.noreply.github.com"
          git add scroll-znanje.html scroll-tracking.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Spremi matched answer za Scroll pitanja"
          git push
