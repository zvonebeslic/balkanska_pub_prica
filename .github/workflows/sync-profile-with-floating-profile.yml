name: Sync standalone profile with floating profile
on:
  push:
    paths:
      - '.github/workflows/sync-profile-with-floating-profile.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync profile functionality and translations
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('profil.html')
          s=p.read_text(encoding='utf-8')
          # Remove obsolete Blitz percentile comparison UI/copy.
          s=re.sub(r'\n\s*\.player-blitz-rank\s*\{.*?\.player-blitz-rank\[hidden\]\s*\{\s*display:\s*none;\s*\}\s*', '\n', s, flags=re.S)
          s=re.sub(r'\n\s*<[^>]+(?:id|class)="[^"]*blitz-rank[^"]*"[^>]*>.*?</[^>]+>\s*', '\n', s, flags=re.S|re.I)
          s=re.sub(r'^\s*blitzRank(?:Template|Loading|NeedGame|Unavailable):.*?\n', '', s, flags=re.M)
          # Remove any remaining old percentile template lines in either language.
          s=re.sub(r'^.*Među najboljih.*Blitz.*\n?', '', s, flags=re.M)
          s=re.sub(r'^.*Among the top.*Blitz.*\n?', '', s, flags=re.M)
          # Add ABC local mode stats to the old standalone profile shape.
          if 'abc: createEmptyModeStats()' not in s:
              s=s.replace('themed: createEmptyModeStats()', 'themed: createEmptyModeStats(),\n      abc: createEmptyModeStats()', 1)
          # Normalize integrated ABC variants as one profile category.
          if 'function normalizeProfileMode(mode)' not in s:
              idx=s.rfind('</script>')
              if idx!=-1:
                  s=s[:idx]+'\nfunction normalizeProfileMode(mode) {\n  return mode === "abc_blitz" || mode === "abc_relax" || mode === "abc_themed" ? "abc" : mode;\n}\n'+s[idx:]
          # Bilingual ABC achievement copy when these definitions exist.
          replacements={
            '"Odigrane ABC partije"':'(currentLang === "en" ? "ABC games played" : "Odigrane ABC partije")',
            '"Prvi ABC"':'(currentLang === "en" ? "First ABC" : "Prvi ABC")',
            '"Odigraj prvi ABC kviz"':'(currentLang === "en" ? "Play your first ABC quiz" : "Odigraj prvi ABC kviz")',
            '"Skupi 100 točnih ABC odgovora"':'(currentLang === "en" ? "Get 100 ABC answers correct" : "Skupi 100 točnih ABC odgovora")',
            '"Skupi 500 točnih ABC odgovora"':'(currentLang === "en" ? "Get 500 ABC answers correct" : "Skupi 500 točnih ABC odgovora")',
            '"ABC niz 20"':'(currentLang === "en" ? "ABC streak 20" : "ABC niz 20")',
            '"Pogodi 20 ABC pitanja zaredom"':'(currentLang === "en" ? "Answer 20 ABC questions correctly in a row" : "Pogodi 20 ABC pitanja zaredom")'
          }
          for a,b in replacements.items(): s=s.replace(a,b)
          # Do not introduce the duplicate large ABC statistics card.
          s=re.sub(r'\n\s*<section class="player-mode-section[^>]*player-mode-section--abc[^>]*>.*?</section>\s*', '\n', s, flags=re.S|re.I)
          p.write_text(s,encoding='utf-8')
      - name: Validate
        shell: python
        run: |
          from pathlib import Path
          s=Path('profil.html').read_text(encoding='utf-8')
          assert 'Among the top {top}% of played Blitz games' not in s
          assert not any('Među najboljih' in line and 'Blitz' in line for line in s.splitlines())
          assert '<html' in s and '</html>' in s
          print('profil.html sync validation OK')
      - name: Commit
        run: |
          git config user.name 'KvizToGo automation'
          git config user.email 'actions@users.noreply.github.com'
          git add profil.html
          git rm .github/workflows/sync-profile-with-floating-profile.yml
          git commit -m 'Sync standalone profile with floating quiz profile'
          git push