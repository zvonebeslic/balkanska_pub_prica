name: Kraljevstvo Znanja - 80 kadrova

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kz-80-frame-atlases.yml"
      - "kraljevstvo-znanja/scripts/build-80-frame-atlases.py"

permissions:
  contents: write

concurrency:
  group: kraljevstvo-80-frame-atlas
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install raster tools
        run: |
          python -m pip install --disable-pip-version-check 'numpy==2.2.6' 'opencv-python-headless==4.12.0.88' 'Pillow==11.2.1'
      - name: Generate castle and iron 80-frame sprite atlases
        run: python kraljevstvo-znanja/scripts/build-80-frame-atlases.py
      - name: Validate atlas dimensions and number of frames
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          root=Path('kraljevstvo-znanja/media')
          for filename,size in [('hodajuci-dvorac-80.webp',192),
                                ('sir-zeljezni-80.webp',224)]:
              im=Image.open(root/filename)
              assert im.size==(10*size,8*size),(filename,im.size)
              print('Validated:',filename,im.size)
          PY
      - name: Commit only generated 80-frame atlases
        run: |
          git config user.name "KvizToGo sprite builder"
          git config user.email "actions@users.noreply.github.com"
          git add kraljevstvo-znanja/media/hodajuci-dvorac-80.webp \
                  kraljevstvo-znanja/media/sir-zeljezni-80.webp
          if git diff --cached --quiet; then
            echo "Assets already up-to-date"
            exit 0
          fi
          git commit -m "KZ: castle and iron 80-frame atlases [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
