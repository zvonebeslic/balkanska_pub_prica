name: Kraljevstvo Znanja - 80 kadrova

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kz-80-frame-atlases.yml"
      - "scripts/build-kz-80-frames.py"

permissions:
  contents: write

concurrency:
  group: kraljevstvo-80-frame-atlas
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install raster tools
        run: |
          python -m pip install --disable-pip-version-check 'numpy==2.2.6' 'opencv-python-headless==4.12.0.88' 'Pillow==11.2.1'
      - name: Generate castle and iron 80-frame sprite atlases
        run: python scripts/build-kz-80-frames.py
      - name: Validate atlas dimensions and number of frames
        run: |
          python - <<'PY'
          import base64, io, json, re
          from pathlib import Path
          from PIL import Image
          root=Path('kraljevstvo-znanja')
          for filename,size in [('kz-roaming-castle-atlas-80.js',192),
                                ('kz-sir-zeljeznik-80.js',224)]:
              data=(root/filename).read_text()
              value=re.search(r'data:image/webp;base64,([A-Za-z0-9+/=]+)',data).group(1)
              im=Image.open(io.BytesIO(base64.b64decode(value)))
              assert im.size==(10*size,8*size),(filename,im.size)
              print('Validated:',filename,im.size)
          PY
      - name: Commit only generated 80-frame atlases
        run: |
          git config user.name "KvizToGo sprite builder"
          git config user.email "actions@users.noreply.github.com"
          git add kraljevstvo-znanja/kz-roaming-castle-atlas-80.js \
                  kraljevstvo-znanja/kz-sir-zeljeznik-80.js
          if git diff --cached --quiet; then
            echo "Assets already up-to-date"
            exit 0
          fi
          git commit -m "KZ: castle and iron 80-frame atlases [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
