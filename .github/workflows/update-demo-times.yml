name: Update demo times

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-demo-times.yml'

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Adjust demo leaderboard times
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('leaderboards.js')
          s=p.read_text(encoding='utf-8')
          old="const GROUPS=[['excellent',8,12,20,[190,390]],['veryGood',17,10,19,[210,460]],['average',30,7,17,[240,620]],['sufficient',20,5,14,[300,760]],['bad',15,3,10,[340,900]],['veryBad',10,2,7,[380,1050]]]"
          new="const GROUPS=[['excellent',8,12,20,[180,300]],['veryGood',17,10,19,[210,360]],['average',30,7,17,[270,480]],['sufficient',20,5,14,[330,570]],['bad',15,3,10,[420,660]],['veryBad',10,2,7,[480,720]]]"
          if old not in s:
              raise SystemExit('GROUPS block not found')
          s=s.replace(old,new,1)
          old_dur="return Math.max(180,Math.round(a+r()*(b-a)+Math.max(-70,Math.min(95,(14-s)*5.5))+ri(r,-65,95)+Math.round((r()-.5)*90*(1.2-p.cons))))"
          new_dur="return Math.min(720,Math.max(180,Math.round(a+r()*(b-a)+Math.max(-70,Math.min(95,(14-s)*5.5))+ri(r,-65,95)+Math.round((r()-.5)*90*(1.2-p.cons)))))"
          if old_dur not in s:
              raise SystemExit('duration formula not found')
          s=s.replace(old_dur,new_dur,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add leaderboards.js
          git diff --cached --quiet || git commit -m "Set demo quiz times to 3-12 minutes"
          git push
