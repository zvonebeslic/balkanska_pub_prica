name: Run online quiz initial flash patch

on:
  push:
    paths:
      - 'patch_online_quiz_initial_flash.py'
      - '.github/workflows/run-online-quiz-initial-flash-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch online quiz initial flash
        run: python patch_online_quiz_initial_flash.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add online-kviz.html
          git diff --cached --quiet && exit 0
          git commit -m "Prevent initial online quiz layout flash"
          git push
