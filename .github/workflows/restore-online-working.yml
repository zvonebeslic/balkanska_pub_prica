name: Restore online quiz working state
on:
  push:
    paths:
      - '.github/workflows/restore-online-working.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore last working online quiz file
        run: |
          git checkout 6ab959080466edbb2d29fbb0bf169161f12d6aef -- online-kviz.html
          git diff --check
      - name: Validate executable JavaScript
        shell: python
        run: |
          from pathlib import Path
          import re,subprocess
          s=Path('online-kviz.html').read_text(encoding='utf-8')
          bad=[]
          for i,(attrs,code) in enumerate(re.findall(r'<script([^>]*)>(.*?)</script>',s,re.S|re.I)):
            if 'application/ld+json' in attrs.lower() or not code.strip(): continue
            p=Path(f'/tmp/s{i}.js'); p.write_text(code,encoding='utf-8')
            r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
            if r.returncode:
              print(r.stderr); bad.append(i)
          if bad: raise SystemExit(f'JS syntax errors: {bad}')
          print('Executable JavaScript syntax OK')
      - name: Commit restore
        run: |
          git config user.name 'KvizToGo automation'
          git config user.email 'actions@users.noreply.github.com'
          git add online-kviz.html
          git rm .github/workflows/restore-online-working.yml
          git commit -m 'Restore online quiz button functionality'
          git push
