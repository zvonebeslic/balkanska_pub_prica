name: Remove duplicate ABC profile card
on:
  push:
    paths:
      - '.github/workflows/remove-abc-profile-card.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove ABC profile card
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('online-kviz.html')
          s=p.read_text(encoding='utf-8')
          # Stop creating the duplicate ABC statistics card shown under the existing profile summary.
          s,n=re.subn(r'\n  function ensureAbcProfileCard\(\) \{.*?\n  \}\n\n  function updatePlayerStatsUI\(\) \{\n    ensureAbcProfileCard\(\);', '\n  function updatePlayerStatsUI() {', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'ABC profile card block replacements={n}')
          # Remove ABC-card-only UI writes. Keep abc modeStats and crowns intact.
          lines=[]
          for line in s.splitlines(True):
              if any(x in line for x in [
                'setModeStats("abc", abc);',
                'setText("profile-abc-title"',
                'setText("profile-abc-copy"',
                'setText("abc-result-label"',
                'setText("abc-best-label"',
                'setText("abc-games-label"',
                'setText("abc-streak-label"',
                'setText("abc-topics-chip"'
              ]):
                  continue
              lines.append(line)
          s=''.join(lines)
          p.write_text(s, encoding='utf-8')
      - name: Validate
        run: |
          ! grep -q 'function ensureAbcProfileCard' online-kviz.html
          grep -q 'abc: createEmptyModeStats' online-kviz.html
          grep -q 'Odigrane ABC partije' online-kviz.html
      - name: Commit
        run: |
          git config user.name 'KvizToGo automation'
          git config user.email 'actions@users.noreply.github.com'
          git add online-kviz.html
          git rm .github/workflows/remove-abc-profile-card.yml
          git commit -m 'Remove duplicate ABC profile statistics card'
          git push