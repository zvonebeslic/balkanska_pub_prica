name: Fix ABC profile synchronization
on:
  push:
    paths:
      - '.github/workflows/fix-profile-abc-final.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix ABC stats and crowns in standalone profile
        shell: python
        run: |
          from pathlib import Path
          p=Path('profil.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('modeStats:{blitz60:createEmptyModeStats(),relax:createEmptyModeStats(),themed:createEmptyModeStats()}', 'modeStats:{blitz60:createEmptyModeStats(),relax:createEmptyModeStats(),themed:createEmptyModeStats(),abc:createEmptyModeStats()}')
          s=s.replace('modeStats:{blitz60:normalizeModeStats(s.modeStats?.blitz60),relax:normalizeModeStats(s.modeStats?.relax),themed:normalizeModeStats(s.modeStats?.themed)}', 'modeStats:{blitz60:normalizeModeStats(s.modeStats?.blitz60),relax:normalizeModeStats(s.modeStats?.relax),themed:normalizeModeStats(s.modeStats?.themed),abc:normalizeModeStats(s.modeStats?.abc)}')
          s=s.replace('modeStats:{blitz60:mergeModeStatsAdditive(a.modeStats.blitz60,b.modeStats.blitz60),relax:mergeModeStatsAdditive(a.modeStats.relax,b.modeStats.relax),themed:mergeModeStatsAdditive(a.modeStats.themed,b.modeStats.themed)}', 'modeStats:{blitz60:mergeModeStatsAdditive(a.modeStats.blitz60,b.modeStats.blitz60),relax:mergeModeStatsAdditive(a.modeStats.relax,b.modeStats.relax),themed:mergeModeStatsAdditive(a.modeStats.themed,b.modeStats.themed),abc:mergeModeStatsAdditive(a.modeStats.abc,b.modeStats.abc)}')
          needle='groups.push(gameGroup("Odigrane Blitz partije","Blitz games played","blitz-games",blitzGames,"Blitz","Blitz",[1,5,10,25,50,100,250,500]));groups.push(gameGroup("Odigrane partije Bez vremena","No-timer games played","relax-games",relaxGames,"Bez vremena","No-timer",[1,5,10,25,50]));'
          replacement='groups.push(gameGroup("Odigrane Blitz partije","Blitz games played","blitz-games",blitzGames,"Blitz","Blitz",[1,5,10,25,50,100,250,500]));groups.push(gameGroup("Odigrane ABC partije","ABC games played","abc-games",s.modeStats.abc.gamesPlayed||0,"ABC","ABC",[1,5,10,25,50,100,250,500]));groups.push(gameGroup("Odigrane partije Bez vremena","No-timer games played","relax-games",relaxGames,"Bez vremena","No-timer",[1,5,10,25,50]));'
          if '"abc-games"' not in s:
              assert needle in s
              s=s.replace(needle,replacement)
          p.write_text(s,encoding='utf-8')
      - name: Validate
        shell: python
        run: |
          from pathlib import Path
          s=Path('profil.html').read_text(encoding='utf-8')
          for x in ['abc:createEmptyModeStats()','abc:normalizeModeStats(s.modeStats?.abc)','abc:mergeModeStatsAdditive(a.modeStats.abc,b.modeStats.abc)','"abc-games"','"Odigrane ABC partije"','"ABC games played"']:
              assert x in s, x
          assert 'player-mode-section--abc' not in s
      - name: Commit
        run: |
          git config user.name 'KvizToGo automation'
          git config user.email 'actions@users.noreply.github.com'
          git add profil.html
          git rm .github/workflows/fix-profile-abc-final.yml
          git commit -m 'Complete ABC stats and crowns on standalone profile'
          git push
