name: Inline ABC integration
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move ABC integration into online-kviz
        run: |
          python3 - <<'PY'
          from pathlib import Path
          htmlp=Path("online-kviz.html")
          abcp=Path("abc-integration.js")
          dailyp=Path("daily30.js")
          html=htmlp.read_text()
          abc=abcp.read_text().rstrip()
          marker='<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>'
          if 'ABC INTEGRATION INLINE' not in html:
              assert marker in html
              html=html.replace(marker, marker+'\n\n<!-- ABC INTEGRATION INLINE: mora biti prije stvaranja Supabase klijenta -->\n<script>\n'+abc+'\n</script>',1)
          daily=dailyp.read_text()
          daily=daily.replace('/* KvizToGo loader: zadrzava Dnevnih 30 i ABC integraciju prije glavnog online-kviz koda. */\ndocument.write(\'<script src="daily30-core.js?v=20260917-1"><\\/script><script src="abc-integration.js?v=20260917-1"><\\/script>\');',
                              '/* KvizToGo loader: Dnevnih 30. ABC integracija je ugrađena u online-kviz.html. */\ndocument.write(\'<script src="daily30-core.js?v=20260917-1"><\\/script>\');')
          # ABC spremnik pripada online kvizu, ne Daily30 loaderu.
          block='''\n/* ABC UI: glavni kod ocekuje ovaj spremnik za A/B/C odgovore. */\n(function ensureAbcAnswerOptions(){\n  if (document.getElementById('abc-answer-options')) return;\n  var answerRow = document.querySelector('.answer-wrap .answer-input-row');\n  if (!answerRow) return;\n  var container = document.createElement('div');\n  container.className = 'abc-answer-options';\n  container.id = 'abc-answer-options';\n  answerRow.insertAdjacentElement('afterend', container);\n})();\n'''
          daily=daily.replace(block,'\n')
          # Ugradi isti ensure uz ABC integraciju, prije DOMContentLoaded init-a.
          ensure='''\n(function ensureAbcAnswerOptionsInline(){\n  const run=()=>{\n    if (document.getElementById("abc-answer-options")) return;\n    const answerRow=document.querySelector(".answer-wrap .answer-input-row");\n    if (!answerRow) return;\n    const container=document.createElement("div");\n    container.className="abc-answer-options";\n    container.id="abc-answer-options";\n    answerRow.insertAdjacentElement("afterend",container);\n  };\n  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",run,{once:true}); else run();\n})();\n'''
          html=html.replace('\n</script>\n<script src="daily30.js?v=20260906-3"></script>', ensure+'\n</script>\n<script src="daily30.js?v=20260906-3"></script>',1)
          htmlp.write_text(html)
          dailyp.write_text(daily)
          abcp.unlink()
          PY
      - name: Validate
        run: |
          ! grep -q 'abc-integration.js' daily30.js
          ! test -e abc-integration.js
          grep -q 'ABC INTEGRATION INLINE' online-kviz.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path("online-kviz.html").read_text()
          assert s.index("ABC INTEGRATION INLINE") < s.index("const supabaseClient")
          assert s.count("const BASE=\"kviztogo_player_stats_v1\"")==1
          print("ABC inline OK")
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add online-kviz.html daily30.js abc-integration.js
          git commit -m "Inline ABC integration into online quiz"
          git push
