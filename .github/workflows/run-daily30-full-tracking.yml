name: Run Daily30 full tracking patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-daily30-full-tracking.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 patch_daily30_full_tracking.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add online-kviz.html
          git diff --cached --quiet || git commit -m "Route Daily 30 through standard quiz tracking"
          git push
