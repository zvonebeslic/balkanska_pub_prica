name: tmp-fix-leaderboard-period-data
on:
  push:
    paths:
      - '.github/workflows/tmp-fix-leaderboard-period-data.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .tmp_fix_leaderboard_period_data.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add leaderboards.js online-kviz.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix leaderboard period aggregation and tab reset"
          git push
