name: Scrollanjem do Znanja

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/add-scroll-knowledge.yml"
      - "scripts/add-scroll-knowledge.mjs"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Preuzmi repo
        uses: actions/checkout@v4

      - name: Pripremi Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Dodaj Scrollanjem do Znanja
        run: node scripts/add-scroll-knowledge.mjs

      - name: Spremi promjenu
        run: |
          if git diff --quiet -- online-kviz.html; then
            echo "Nema promjene."
            exit 0
          fi
          git config user.name "KvizToGo"
          git config user.email "actions@users.noreply.github.com"
          git add online-kviz.html
          git commit -m "Dodaj Scrollanjem do Znanja u online kviz"
          git push
