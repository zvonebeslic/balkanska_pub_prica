name: Inspect GitHub Pages deployment state
on:
  push:
    paths:
      - '.github/workflows/recover-stuck-pages-2026-11.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read Pages settings and deployment state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo '--- Current GitHub Pages settings ---'
          curl --fail-with-body --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          echo
          echo '--- Deployment state f8a805 ---'
          curl --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/deployments/f8a80511478db7183482ebfc7cf77ff9107ed8ae"
          echo
