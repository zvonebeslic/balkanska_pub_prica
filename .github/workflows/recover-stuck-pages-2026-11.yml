name: Recover stalled GitHub Pages deployment
on:
  push:
    paths:
      - '.github/workflows/recover-stuck-pages-2026-11.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  recover:
    if: github.repository == 'zvonebeslic/balkanska_pub_prica'
    runs-on: ubuntu-latest
    steps:
      - name: Cancel the orphaned GitHub Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --show-error --silent -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/deployments/f8a80511478db7183482ebfc7cf77ff9107ed8ae/cancel"
