name: Temporary online quiz missing English patch
on:
  push:
    paths:
      - '.github/workflows/tmp-online-quiz-missing-en.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .tmp_patch_online_quiz_missing_en.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add online-kviz.html
          git diff --cached --quiet && exit 0
          git commit -m "Complete missing English Daily30 copy"
          git push
