name: Fix leaderboard initial load
on:
  push:
    paths:
      - '.github/trigger-leaderboard-initial-load.txt'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix initial leaderboard render
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('leaderboards.js')
          s=p.read_text()
          old="if(!client)return;remoteBusy=true;"
          new="if(!client){renderPreview();if(document.getElementById('leaderboard-page')?.classList.contains('open'))renderPage();return}remoteBusy=true;"
          if old not in s:
              raise SystemExit('reloadRemote pattern not found')
          s=s.replace(old,new,1)
          old2="injectVisibility();renderPreview();void reloadRemote()"
          new2="injectVisibility();void reloadRemote()"
          if old2 not in s:
              raise SystemExit('DOMContentLoaded pattern not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Remove temporary fix files
        run: |
          rm -f .github/workflows/fix-leaderboard-initial-load.yml .github/trigger-leaderboard-initial-load.txt
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix leaderboard initial remote data load"
          git push
