name: Fix leaderboard period navigation

on:
  push:
    paths:
      - '.github/leaderboard-period-nav-trigger.txt'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix week and month forward navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('leaderboards.js')
          s = p.read_text(encoding='utf-8')
          old = "v==='week'?(dir<0?addDays(weekStart(a),-1):addDays(weekStart(a),7)):v==='month'?(dir<0?addDays(monthStart(a),-1):addMonths(monthStart(a),1)):addDays(a,dir)"
          new = "v==='week'?(dir<0?addDays(weekStart(a),-1):addDays(weekStart(a),13)):v==='month'?(dir<0?addDays(monthStart(a),-1):periodEnd('month',addMonths(monthStart(a),1))):addDays(a,dir)"
          count = s.count(old)
          if count != 2:
              raise SystemExit(f'Expected 2 navigation expressions, found {count}')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Remove temporary fix files
        run: |
          rm -f .github/leaderboard-period-nav-trigger.txt
          rm -f .github/workflows/fix-leaderboard-period-nav.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add leaderboards.js .github
          git commit -m "Fix leaderboard week and month navigation"
          git push
