name: Run relative home links patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-relative-home-links.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 patch_relative_home_links.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add online-kviz.html profil.html
          git diff --cached --quiet || git commit -m "Use relative home links"
          git push
