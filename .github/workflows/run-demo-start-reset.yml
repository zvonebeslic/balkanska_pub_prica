name: Run demo leaderboard reset
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-demo-start-reset.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 patch_demo_start_today.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add leaderboards.js
          git diff --cached --quiet || git commit -m "Start demo leaderboard history on Aug 27 2026"
          git push
