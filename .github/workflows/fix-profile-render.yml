name: Fix standalone profile rendering
on:
  push:
    paths:
      - '.github/workflows/fix-profile-render.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix profile render
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('profil.html')
          s=p.read_text(encoding='utf-8')
          # Remove the stale Blitz percentile element and the now-missing JS call.
          s=re.sub(r'<div class="player-blitz-rank" id="blitz-percentile-note" hidden></div>', '', s)
          s=s.replace('renderProfileAchievements();updateProfileBlitzPercentile();', 'renderProfileAchievements();')
          s=s.replace('    let profileBlitzPercentile = null;\n', '')
          # Keep ABC as an internal mode and crown group, without a duplicate large stats card.
          assert 'abc:createEmptyModeStats()' in s
          assert '"abc-games"' in s
          assert '"ABC games played"' in s
          assert 'modeStats:{blitz60:normalizeModeStats' in s and 'abc:normalizeModeStats(s.modeStats?.abc)' in s
          assert 'updateProfileBlitzPercentile()' not in s
          assert 'blitz-percentile-note' not in s
          p.write_text(s, encoding='utf-8')
      - name: Validate profile JavaScript hooks
        shell: python
        run: |
          from pathlib import Path
          s=Path('profil.html').read_text(encoding='utf-8')
          required=['renderProfileDashboard()','renderProfileAchievements()','loadAndMigratePlayerProgress','Odigrane ABC partije','ABC games played','abc:createEmptyModeStats()']
          for x in required: assert x in s, x
          print('profile render validation OK')
      - name: Commit
        run: |
          git config user.name 'KvizToGo automation'
          git config user.email 'actions@users.noreply.github.com'
          git add profil.html
          git rm .github/workflows/fix-profile-render.yml
          git commit -m 'Fix standalone profile progress rendering'
          git push