name: Run leaderboard visual patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-leaderboard-visual-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 patch_leaderboard_visual.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add online-kviz.html leaderboards.js
          git diff --cached --quiet || git commit -m "Refine leaderboard selector styling"
          git push
