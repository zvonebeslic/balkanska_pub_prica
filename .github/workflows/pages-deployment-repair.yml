name: Repair stuck GitHub Pages deployment
on:
  push:
    paths:
      - '.github/workflows/pages-deployment-repair.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  deployments: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect and clear the specifically blocked Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BLOCKED_SHA: 5f6d40de7212a62e4fdcf0cd4e2c50a6ea797a9e
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error,sys
          api="https://api.github.com/repos/"+os.environ["REPO"]
          token=os.environ["GH_TOKEN"]
          blocked=os.environ["BLOCKED_SHA"]
          def call(method,path,body=None):
              data=None if body is None else json.dumps(body).encode()
              req=urllib.request.Request(api+path,data=data,method=method,headers={
                "Accept":"application/vnd.github+json",
                "Authorization":"Bearer "+token,
                "X-GitHub-Api-Version":"2022-11-28",
                "User-Agent":"ktg-pages-repair"
              })
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      payload=r.read()
                      return r.status,json.loads(payload) if payload else None
              except urllib.error.HTTPError as e:
                  body=e.read().decode(errors="replace")
                  print(method,path,"HTTP",e.code,body[:800])
                  return e.code,None
          code,state=call("GET",f"/pages/deployments/{blocked}")
          print("Reported Pages deployment state:",code,state)
          code,response=call("POST",f"/pages/deployments/{blocked}/cancel")
          print("Pages deployment cancellation outcome:",code,response)
          if code in (200,201,202,204):
              print("SUCCESS: Pages accepted cancellation for",blocked)
          else:
              print("Pages did not permit cancellation; the stale backend lock must be reset by GitHub Support.")
              sys.exit(1)
          PY
