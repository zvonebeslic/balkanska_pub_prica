name: Repair stuck GitHub Pages deployment
on:
  push:
    paths:
      - '.github/workflows/pages-deployment-repair.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  deployments: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect and clear the specifically blocked Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BLOCKED_SHA: 5f6d40de7212a62e4fdcf0cd4e2c50a6ea797a9e
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error,sys
          api="https://api.github.com/repos/"+os.environ["REPO"]
          token=os.environ["GH_TOKEN"]
          blocked=os.environ["BLOCKED_SHA"]
          def call(method,path,body=None):
              data=None if body is None else json.dumps(body).encode()
              req=urllib.request.Request(api+path,data=data,method=method,headers={
                "Accept":"application/vnd.github+json",
                "Authorization":"Bearer "+token,
                "X-GitHub-Api-Version":"2022-11-28",
                "User-Agent":"ktg-pages-repair"
              })
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      payload=r.read()
                      return r.status,json.loads(payload) if payload else None
              except urllib.error.HTTPError as e:
                  body=e.read().decode(errors="replace")
                  print(method,path,"HTTP",e.code,body[:800])
                  return e.code,None
          status,deployments=call("GET","/deployments?environment=github-pages&per_page=100")
          if status!=200 or not isinstance(deployments,list):
              print("Cannot inspect deployments with this token. No changes made.")
              sys.exit(1)
          print("Recent deployments:",[(x["id"],x["sha"][:12],x.get("environment")) for x in deployments[:12]])
          matches=[x for x in deployments if x.get("sha")==blocked and x.get("environment")=="github-pages"]
          print("Matches for blocked SHA:",[(x["id"],x.get("created_at")) for x in matches])
          if len(matches)<2:
              print("No newer matching successful deployment exists. Preserving production.")
              sys.exit(1)
          # Remove only the OLD matching record. Keep the newer successful deployment.
          oldest=min(matches,key=lambda x:x["created_at"])
          newer=[x for x in matches if x["id"]!=oldest["id"]]
          safe=False
          for item in newer:
              code,sts=call("GET",f"/deployments/{item['id']}/statuses?per_page=1")
              if code==200 and sts and sts[0].get("state")=="success":safe=True
          if not safe:
              print("No newer successful deployment; preserving old deployment.")
              sys.exit(1)
          deployment_id=oldest["id"]
          code,states=call("GET",f"/deployments/{deployment_id}/statuses?per_page=5")
          print("Blocked deployment ID:",deployment_id,"Latest status:",(states or [{}])[0].get("state") if isinstance(states,list) else None)
          if code!=200 or not isinstance(states,list):sys.exit(1)
          if not states or states[0].get("state")!="inactive":
              code,_=call("POST",f"/deployments/{deployment_id}/statuses",{
                "state":"inactive",
                "description":"Retire stale Pages deployment lock; newer quiz version awaits publication.",
                "auto_inactive":False
              })
              if code not in (200,201):
                  print("Unable to deactivate stale deployment. No deletion attempted.")
                  sys.exit(1)
          code,_=call("DELETE",f"/deployments/{deployment_id}")
          if code==204:
              print("SUCCESS: removed only the stale GitHub deployment record for",blocked)
          else:
              print("Deletion failed; do not repeat without inspecting the error.")
              sys.exit(1)
          PY
