name: Run leaderboard section patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-leaderboard-section-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 patch_leaderboard_sections.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add online-kviz.html leaderboards.js
          git diff --cached --quiet || git commit -m "Add Daily 30 and Multiplayer leaderboard sections"
          git push
