name: Run index question count patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-index-questions-6000.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 patch_index_questions_6000.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Update question count to 6000+"
          git push
