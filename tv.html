<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#04131e">
<meta name="robots" content="noindex,nofollow">
<title>Prikaz za publiku | KvizToGo</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;background:#04131e;color:#eef7ff;display:flex;justify-content:center;align-items:center;padding:clamp(16px,4vw,50px)}
main{width:min(94vw,810px);padding:clamp(28px,5vw,64px);border:4px solid transparent;border-radius:28px;background:linear-gradient(#061824,#061824) padding-box,linear-gradient(112deg,#1674ff,#00d4f4 56%,#0be252) border-box;text-align:center;box-shadow:0 22px 85px #0009}
img{width:clamp(110px,15vw,165px);height:auto;display:block;margin:0 auto 24px}
h1{font-size:clamp(32px,5.1vw,60px);line-height:1.12;margin:0 0 13px}
p{font-size:clamp(16px,2vw,22px);line-height:1.45;color:#bed4e5;margin:0 auto 26px;max-width:660px}
form{display:flex;flex-wrap:wrap;align-items:stretch;justify-content:center;gap:12px;margin:16px auto;max-width:680px}
input{flex:1 1 280px;min-width:0;width:100%;height:70px;text-transform:uppercase;text-align:center;font-size:clamp(23px,3vw,32px);font-weight:900;letter-spacing:.16em;border:2px solid #46739a;background:#102a41;color:#fff;border-radius:14px;padding:12px}
input:focus{outline:3px solid #00c7e9;outline-offset:2px}
button{flex:1 1 190px;cursor:pointer;font:inherit;font-weight:850;font-size:clamp(18px,2vw,24px);border:0;border-radius:14px;background:#165fcd;color:#fff;padding:15px 22px}
button:focus-visible{outline:3px solid #00d4f4;outline-offset:3px}
#error{min-height:1.5em;margin:10px 0 0;color:#ffb2a8;font-weight:700}
small{display:block;margin-top:20px;color:#94b7ce;font-size:clamp(13px,1.4vw,17px)}
</style>
</head>
<body>
<main>
  <img src="kviz-uzivo-logo.webp" alt="KvizToGo">
  <h1>Prikaz za publiku</h1>
  <p>Na uređaju voditelja odaberi <strong>„Poveži TV / mobitel”</strong>, a ovdje upiši njegov osmeroznamenkasti kod. Ovaj ekran <strong>ne stvara vlastiti kod</strong>.</p>
  <form id="joinForm">
    <input id="room" type="text" minlength="8" maxlength="8" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="KOD VODITELJA" aria-label="Kod koji prikazuje uređaj voditelja" required autofocus>
    <button type="submit">Spoji prikaz</button>
  </form>
  <p id="error" role="alert" aria-live="polite"></p>
  <small>Mobitel, laptop, računalo ili tablet mogu biti voditeljski uređaj. Ovdje se samo gledaju slajdovi.</small>
</main>
<script>
"use strict";
document.getElementById("joinForm").addEventListener("submit",function(event){
 event.preventDefault();
 const code=document.getElementById("room").value.trim().toUpperCase().replace(/\s+/g,"");
 if(!/^[A-HJ-NP-Z2-9]{8}$/.test(code)){
  document.getElementById("error").textContent="Upiši točno 8 znakova koda prikazanog na uređaju voditelja.";
  return;
 }
 const url=new URL("kviz-uzivo.html",window.location.href);
 url.searchParams.set("stage","1");
 url.searchParams.set("room",code);
 window.location.assign(url.href);
});
</script>
</body>
</html>
