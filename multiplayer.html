<!doctype html><html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><title>Multiplayer | KvizToGo</title><style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}:root{--page-bg:#0b1220;--card-bg:#162235;--card-soft:#101b2d;--blue:#2f80ff;--blue-dark:#1d5fd6;--blue-soft:rgba(47,128,255,.18);--green:#22c55e;--green-soft:rgba(34,197,94,.16);--red:#ef4444;--yellow:#facc15;--grey:#94a3b8;--text-main:#f5f7fb;--text-muted:#a8b3c7;--border:rgba(148,163,184,.22);--shadow:0 18px 45px rgba(0,0,0,.35);--shadow-soft:0 10px 26px rgba(0,0,0,.28);--radius-lg:24px;--radius-md:18px;--radius-pill:999px}html,body{min-height:100%}body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at top left,rgba(47,128,255,.10),transparent 42%),radial-gradient(circle at top right,rgba(34,197,94,.16),transparent 34%),radial-gradient(circle at bottom right,rgba(34,197,94,.12),transparent 38%),var(--page-bg);color:var(--text-main);min-height:100svh}button{font:inherit;-webkit-tap-highlight-color:transparent}.site-header{position:sticky;top:0;z-index:1000;display:grid;grid-template-columns:52px 1fr 52px;align-items:center;gap:.6rem;width:100%;padding:.7rem 1rem;background:#000;border-bottom:1px solid rgba(255,255,255,.08);box-shadow:0 10px 30px rgba(15,23,42,.28)}.brand-logo{justify-self:center;display:inline-flex;align-items:baseline;justify-content:center;text-decoration:none;font-weight:900;letter-spacing:-.06em;line-height:1;font-size:clamp(2rem,7vw,4rem)}.logo-kviz{color:#fff}.logo-to{color:var(--blue)}.logo-go{color:var(--green)}.nav-btn{min-height:42px;padding:.5rem .9rem;border-radius:var(--radius-pill);border:1px solid var(--border);background:rgba(255,255,255,.08);color:#fff;font-size:.84rem;font-weight:850;cursor:pointer}.wrap{width:min(1180px,calc(100% - 1.2rem));margin:.65rem auto 2rem}.screen{display:none}.screen.on{display:block}.hero{text-align:center;padding:.7rem 0 1rem}.hero h1{font-size:1.35rem;margin-bottom:.3rem}.hero h1::after{content:"";display:block;width:48px;height:3px;border-radius:999px;background:var(--green);margin:.45rem auto 0}.hero p{font-size:.84rem;color:var(--text-muted)}.versus{display:grid;grid-template-columns:1fr 54px 1fr;gap:.6rem;align-items:center;max-width:680px;margin:auto}.player,.quiz-card,.sidebar-card,.match-end{background:var(--card-bg);border-radius:var(--radius-md);padding:.9rem;border:1px solid var(--border);box-shadow:var(--shadow-soft)}.player{text-align:center;min-height:150px}.player.me{border-color:rgba(34,197,94,.62);box-shadow:0 10px 28px rgba(34,197,94,.10)}.face{display:none;width:66px;height:66px;margin:.2rem auto;border-radius:50%;display:grid;place-items:center;background:var(--card-soft);border:1px solid var(--border);font-size:1.35rem;font-weight:900}.player.me .face{border-color:rgba(34,197,94,.65);background:var(--green-soft)}.name{font-size:.95rem;font-weight:850;margin-top:.45rem}.player.me .name{color:#dfffea}.meta{font-size:.75rem;color:var(--text-muted);margin-top:.2rem}.player.me .meta{color:#8ee9ad}.vs{text-align:center;font-weight:900;color:var(--green)}.search{max-width:680px;margin:1rem auto;padding:.75rem;border-radius:var(--radius-md);border:1px solid rgba(34,197,94,.42);background:var(--green-soft);text-align:center;font-size:.8rem}.primary-btn,.secondary-btn{border-radius:var(--radius-pill);cursor:pointer;font-weight:850;border:1px solid var(--border);color:var(--text-main)}.primary-btn{display:block;width:100%;max-width:680px;margin:.75rem auto 0;padding:.7rem 1rem;background:var(--green);border-color:var(--green);color:#07150c;box-shadow:0 0 18px rgba(34,197,94,.18)}.primary-btn:disabled{opacity:.45}.secondary-btn{padding:.6rem .85rem;background:rgba(255,255,255,.06)}.quiz-main-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,.7fr);gap:.75rem;align-items:start}.quiz-card{min-height:320px;width:100%;display:flex;flex-direction:column;gap:.6rem}.scorebar{display:grid;grid-template-columns:1fr auto 1fr;gap:.5rem;align-items:center}.scorebox{padding:.5rem;border-radius:12px;background:var(--card-soft);border:1px solid var(--border);text-align:center;font-size:.78rem}.scorebox.me{border-color:rgba(34,197,94,.5)}.score{font-size:1rem;font-weight:850}.round{text-align:center;font-size:.72rem;color:var(--text-muted)}.timer-pill{margin-top:.2rem;padding:.25rem .6rem;border-radius:var(--radius-pill);border:1px solid rgba(250,204,21,.45);color:var(--yellow);font-size:.85rem;font-weight:850}.topic{width:max-content;padding:.2rem .5rem;border-radius:var(--radius-pill);background:var(--green-soft);border:1px solid rgba(34,197,94,.35);color:#dfffea;font-size:.7rem;font-weight:850}.question-text{font-size:.98rem;line-height:1.45}.answers{display:grid;gap:.5rem}.answer-option{min-height:48px;border-radius:12px;border:1px solid var(--border);background:var(--card-soft);color:var(--text-main);text-align:left;padding:.6rem .7rem;font-size:.93rem;line-height:1.35;cursor:pointer}.answer-option b{display:inline-flex;align-items:center;justify-content:center;width:1.65rem;height:1.65rem;margin-right:.4rem;border-radius:50%;border:1px solid currentColor}.answer-option:disabled{opacity:.8}.answer-option.good{border-color:rgba(34,197,94,.5);background:var(--green-soft)}.answer-option.bad{border-color:rgba(239,68,68,.5);background:rgba(239,68,68,.16)}.answer-feedback{min-height:1.4rem;font-size:.8rem;font-weight:800}.sidebar-card{display:flex;flex-direction:column;gap:.6rem;max-height:480px}.sidebar-head{display:flex;justify-content:space-between;align-items:center;gap:.5rem}.sidebar-card h2{font-size:.9rem;text-transform:uppercase;letter-spacing:.03em}.history-actions{display:flex;gap:.35rem}.history-share-btn,.history-download-btn{min-height:38px;border-radius:var(--radius-pill);border:1px solid rgba(34,197,94,.62);background:rgba(34,197,94,.16);color:var(--text-main);padding:.45rem .8rem;font-size:.78rem;font-weight:850;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.35rem;transition:background .15s ease,transform .15s ease}.history-share-btn:hover,.history-download-btn:hover{transform:translateY(-1px)}.history-share-btn:hover{background:rgba(34,197,94,.26)}.history-download-btn{border-color:rgba(47,128,255,.65);background:rgba(47,128,255,.16)}.history-download-btn:hover{background:rgba(47,128,255,.26)}.history-list{list-style:none;display:flex;flex-direction:column;gap:.35rem;overflow-y:auto;padding-right:.2rem;font-size:.78rem}.history-item{width:100%;border-radius:12px;padding:.4rem .5rem;border:1px solid var(--border);background:var(--card-soft)}.history-q{font-weight:800;margin-bottom:.2rem}.hist-row{display:block;width:100%;margin-top:.15rem;font-size:.74rem}.hist-me{color:#d8e8ff}.hist-bot{color:var(--yellow)}.hist-correct{color:var(--green)}.match-end{display:none;margin-top:.75rem;text-align:center}.match-end.on{display:block}.match-end h2{font-size:1.1rem}.match-score{font-size:1.5rem;font-weight:900;margin:.35rem}.match-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:.4rem;margin-top:.7rem}.game-actions{margin-top:.75rem;display:flex;justify-content:flex-end}@media(max-width:768px){.wrap{width:calc(100% - .8rem)}.quiz-main-grid{display:flex;flex-direction:column;gap:.5rem}.quiz-card,.sidebar-card{width:100%;padding:.9rem}.sidebar-card{max-height:none}.history-list{max-height:34vh}.question-text{font-size:.95rem;line-height:1.38}.versus{grid-template-columns:1fr 42px 1fr}.player{min-height:135px;padding:.7rem}.brand-logo{font-size:2rem}.history-share-btn,.history-download-btn{min-height:38px;padding:.4rem .7rem}}
</style></head><body><header class="site-header"><div><button class="nav-btn" onclick="location.href='online-kviz.html'">←</button></div><a class="brand-logo" href="index.html"><span class="logo-kviz">Kviz</span><span class="logo-to">To</span><span class="logo-go">Go</span></a><div></div></header><main class="wrap"><section id="lobby" class="screen on"><div class="hero"><h1>Multiplayer</h1><p>Brzi dvoboj znanja • 10 istih ABC pitanja • 8 sekundi po pitanju</p></div><div class="versus"><div class="player me"><div class="face" id="meFace">GO</div><div class="name" id="meName">Gost</div><div class="meta">Spreman za dvoboj</div></div><div class="vs">VS</div><div class="player"><div class="face" id="botFace">?</div><div class="name" id="botName">Tražimo...</div><div class="meta" id="botMeta">protivnika</div></div></div><div class="search" id="search">Učitavamo originalna ABC pitanja...</div><button class="primary-btn" id="start" disabled>Započni dvoboj</button></section><section id="game" class="screen"><div class="quiz-main-grid"><div><div class="quiz-card"><div class="scorebar"><div class="scorebox me"><div id="meGame">Gost</div><div class="score" id="meScore">0</div></div><div class="round"><div id="round">1 / 10</div><div class="timer-pill" id="timer">8.0</div></div><div class="scorebox"><div id="botGame">Bot</div><div class="score" id="botScore">0</div></div></div><span class="topic" id="topic">KvizToGo</span><div class="question-text" id="question"></div><div class="answers" id="answers"></div><div class="answer-feedback" id="status"></div></div><div id="matchEnd" class="match-end"><h2 id="resultTitle">Kraj dvoboja</h2><div id="resultScore" class="match-score"></div><div id="resultText"></div><div class="match-actions"><button class="primary-btn" id="rematch" style="width:auto;margin:0">Revanš</button><button class="secondary-btn" id="newOpponent">Novi protivnik</button><button class="secondary-btn" onclick="location.href='online-kviz.html'">Natrag na kvizove</button></div></div><div class="game-actions"><button class="secondary-btn" id="leaveBtn" onclick="finish(true)">Napusti dvoboj</button></div></div><aside class="sidebar-card"><div class="sidebar-head"><h2>Povijest kviza</h2><div class="history-actions"><button class="history-share-btn" id="shareHistory">Podijeli</button><button class="history-download-btn" id="saveHistory">Spremi</button></div></div><div class="history-list" id="historyList"></div></aside></div></section></main><script>(()=>{'use strict';const FILES=['AmerickiPredsjednici','AntickiRim','Film','FloraFauna','Gaming','Glazba','Knjizevnost','Moreplovci','Nogomet','Sport','Svastara','Zemljopis','Znanost','povijest','questions-blitz'];const NAMES=['7Ivan','4Ana','9Marko','Nikola5','Ivana2','Matej1','Lucija7','Filip23','Ema64','Josip18','Sara27','Karlo91','Lea42','David76','Iva35','Lovro58','Nina84','ČudniKljun','SjenaSaŠanka','TrećiPokušaj','BezGooglea','KasniOdgovor','MozakNaPauzi','MaliOrakul','KriviKontinent','NoćnaSova','KvizMaster','LovacNaBodove','Mozgalo','Kvizoman','Znalac','BrziPrst','PubKvizVeteran'];const ROUND_MS=8000,REVEAL_MS=2000;let bot=null,pool=[],qs=[],history=[],pos=0,me=0,bs=0,roundOver=false,meAnswered=false,botAnswered=false,meChoice=null,botChoice=null,botTimer,roundTimer,tickTimer;const $=id=>document.getElementById(id),shuffle=a=>{a=a.slice();for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a},esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function getMe(){try{return localStorage.getItem('kviztogo_username')||localStorage.getItem('username')||localStorage.getItem('guestName')||localStorage.getItem('guest_name')||'Gost'}catch(e){return'Gost'}}function initials(n){return String(n).replace(/\d/g,'').slice(0,2).toUpperCase()||'GO'}function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('on',x.id===id));scrollTo(0,0)}function norm(q,s){if(!q||typeof q.question!=='string'||!q.answers||Array.isArray(q.answers))return null;let k=['A','B','C'],c=String(q.correct_answer||'').toUpperCase();if(!k.every(x=>typeof q.answers[x]==='string')||!k.includes(c))return null;return{question:q.question,topic:q.topic||s,answers:k.map(x=>({key:x,text:q.answers[x]})),correctKey:c}}async function loadQuestions(){let sets=await Promise.all(FILES.map(async f=>{try{let r=await fetch('ABC%20pitanja/'+encodeURIComponent(f)+'.json',{cache:'no-store'}),j=await r.json(),a=Array.isArray(j)?j:(j.questions||[]);return a.map(q=>norm(q,f)).filter(Boolean)}catch(e){return[]}}));pool=sets.flat();if(pool.length<10){$('search').textContent='Nije moguće učitati ABC pitanja.';return}$('search').textContent='ABC baza učitana • '+pool.length+' pitanja ✓';findOpponent()}function findOpponent(){bot={name:NAMES[Math.floor(Math.random()*NAMES.length)],accuracy:.35+Math.random()*.5};$('botFace').textContent=initials(bot.name);$('botName').textContent=bot.name;$('botMeta').textContent='Virtualni protivnik • '+Math.round(bot.accuracy*100)+'% forma';$('start').disabled=false}function botDelay(){let r=Math.random(),m=r<.4?6000+Math.random()*500:r<.75?6500+Math.random()*700:7200+Math.random()*750;return Math.min(7950,m)}function clearTimers(){clearTimeout(botTimer);clearTimeout(roundTimer);clearInterval(tickTimer)}function answerText(q,k){let a=q.answers.find(x=>x.key===k);return a?a.text:'—'}function addHistory(q){history.push({question:q.question,answers:q.answers.map(a=>({...a})),correctKey:q.correctKey,correct:answerText(q,q.correctKey),me:meChoice,bot:botChoice});renderHistory()}function renderHistory(){let l=$('historyList');l.innerHTML='';if(!history.length){l.innerHTML='<div class="history-item">Odigrana pitanja pojavit će se ovdje.</div>';return}history.slice().reverse().forEach((h,ri)=>{let d=document.createElement('div'),n=history.length-ri;d.className='history-item';d.innerHTML='<div class="history-q">'+n+'. '+esc(h.question)+'</div><div class="hist-row hist-me"><b>'+esc(getMe())+':</b> '+esc(h.me?h.me+'. '+answerText(h,h.me):'nije odgovorio')+'</div><div class="hist-row hist-bot"><b>'+esc(bot.name)+':</b> '+esc(h.bot?h.bot+'. '+answerText(h,h.bot):'nije odgovorio')+'</div><div class="hist-row hist-correct"><b>Točno:</b> '+esc(h.correctKey+'. '+h.correct)+'</div>';l.appendChild(d)})}function startMatch(){if(!bot||pool.length<10)return;qs=shuffle(pool).slice(0,10);history=[];pos=me=bs=0;$('matchEnd').classList.remove('on');$('leaveBtn').style.display='block';$('meGame').textContent=getMe();$('botGame').textContent=bot.name;show('game');renderHistory();render()}function render(){clearTimers();roundOver=meAnswered=botAnswered=false;meChoice=botChoice=null;let q=qs[pos];$('round').textContent=(pos+1)+' / 10';$('meScore').textContent=me;$('botScore').textContent=bs;$('topic').textContent=q.topic;$('question').textContent=q.question;$('status').textContent=bot.name+' razmišlja…';$('answers').innerHTML='';q.answers.forEach(o=>{let b=document.createElement('button');b.className='answer-option';b.dataset.key=o.key;b.innerHTML='<b>'+o.key+'</b> '+esc(o.text);b.onclick=()=>answer(o.key,b);$('answers').appendChild(b)});let st=performance.now();$('timer').textContent='8.0';tickTimer=setInterval(()=>$('timer').textContent=(Math.max(0,ROUND_MS-(performance.now()-st))/1000).toFixed(1),100);botTimer=setTimeout(()=>botAnswer(q),botDelay());roundTimer=setTimeout(()=>endByTime(q),ROUND_MS)}function disable(){document.querySelectorAll('.answer-option').forEach(x=>x.disabled=true)}function mark(q){document.querySelector('.answer-option[data-key="'+q.correctKey+'"]')?.classList.add('good')}function close(q,msg,delay=REVEAL_MS){if(roundOver)return;roundOver=true;clearTimers();disable();mark(q);$('status').textContent=msg;addHistory(q);setTimeout(()=>{pos++;pos>=qs.length?finish(false):render()},delay)}function answer(k,b){if(roundOver||meAnswered)return;meAnswered=true;meChoice=k;let q=qs[pos];if(k===q.correctKey){me++;$('meScore').textContent=me;b.classList.add('good');close(q,'✓ Točno! Bod je tvoj.',650)}else{b.classList.add('bad');disable();if(botAnswered)close(q,'Točan odgovor: '+q.correctKey+'. '+answerText(q,q.correctKey));else $('status').textContent='✗ Netočno. Protivnik još može odgovoriti…'}}function botAnswer(q){if(roundOver||botAnswered)return;botAnswered=true;let ok=Math.random()<bot.accuracy;botChoice=ok?q.correctKey:shuffle(q.answers.filter(a=>a.key!==q.correctKey))[0].key;if(ok){bs++;$('botScore').textContent=bs;close(q,bot.name+' je odgovorio točno.',650)}else if(meAnswered)close(q,'Točan odgovor: '+q.correctKey+'. '+answerText(q,q.correctKey));else $('status').textContent=bot.name+' je pogriješio. Još možeš odgovoriti.'}function endByTime(q){if(!roundOver){$('timer').textContent='0.0';close(q,'Točan odgovor: '+q.correctKey+'. '+answerText(q,q.correctKey))}}function historyText(){let o='KvizToGo Multiplayer\n'+getMe()+' '+me+' : '+bs+' '+bot.name+'\n\n';history.forEach((h,i)=>o+=(i+1)+'. '+h.question+'\n'+getMe()+': '+(h.me?h.me+'. '+answerText(h,h.me):'nije odgovorio')+'\n'+bot.name+': '+(h.bot?h.bot+'. '+answerText(h,h.bot):'nije odgovorio')+'\nTočno: '+h.correctKey+'. '+h.correct+'\n\n');return o.trim()}async function shareHistory(){let t=historyText();try{if(navigator.share)await navigator.share({title:'KvizToGo Multiplayer',text:t});else{await navigator.clipboard.writeText(t);alert('Povijest je kopirana.')}}catch(e){}}function saveHistory(){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([historyText()],{type:'text/plain;charset=utf-8'}));a.href=u;a.download='KvizToGo-multiplayer-povijest.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function finish(abandoned){clearTimers();roundOver=true;disable();$('leaveBtn').style.display='none';$('matchEnd').classList.add('on');$('resultScore').textContent=me+' : '+bs;if(abandoned){$('resultTitle').textContent='Dvoboj prekinut';$('resultText').textContent='Rezultat u trenutku izlaska.'}else if(me>bs){$('resultTitle').textContent='🏆 Pobjeda!';$('resultText').textContent='Pobijedio si '+bot.name+'.'}else if(me<bs){$('resultTitle').textContent='Protivnik pobjeđuje';$('resultText').textContent=bot.name+' je ovaj put bio bolji.'}else{$('resultTitle').textContent='🤝 Neriješeno';$('resultText').textContent='Potpuno izjednačen dvoboj.'}$('matchEnd').scrollIntoView({behavior:'smooth',block:'center'})}window.finish=finish;let mn=getMe();$('meName').textContent=mn;$('meGame').textContent=mn;$('meFace').textContent=initials(mn);$('start').onclick=startMatch;$('shareHistory').onclick=shareHistory;$('saveHistory').onclick=saveHistory;$('rematch').onclick=startMatch;$('newOpponent').onclick=()=>{findOpponent();startMatch()};loadQuestions()})();</script></body></html>
