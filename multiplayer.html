<!doctype html><html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07172b"><title>Multiplayer | KvizToGo</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#020914;color:#fff;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit}.app{width:min(100%,560px);min-height:100svh;margin:auto;background:radial-gradient(circle at 50% 0,#168dff33,transparent 28%),#07172b}.top{height:68px;display:flex;align-items:center;gap:10px;padding:8px 12px;background:#000;position:sticky;top:0;z-index:20}.back{width:40px;height:40px;border-radius:13px;border:1px solid #2d78bb;background:#0a203b;color:#fff;font-size:25px}.brand{font-size:25px;font-weight:1000;letter-spacing:-1.4px;flex:1;text-align:center}.brand i{font-style:normal;color:#2f80ff}.brand b{color:#22c55e}.screen{display:none;padding:18px 14px 40px}.screen.on{display:block}.hero{text-align:center;padding:10px 8px 18px}.hero h1{font-size:34px;margin:5px 0}.hero p{color:#a8b3c7;margin:0}.versus{display:grid;grid-template-columns:1fr 54px 1fr;gap:8px;align-items:center}.player{min-height:170px;border:2px solid #24547f;border-radius:22px;padding:14px 8px;text-align:center;background:linear-gradient(145deg,#15385b,#081a30)}.player.me{border-color:#22c55e}.face{width:74px;height:74px;margin:auto;border-radius:50%;display:grid;place-items:center;background:#0a203b;border:2px solid #4385bd;font-size:32px;font-weight:1000}.name{font-weight:1000;margin-top:9px}.meta{font-size:12px;color:#b8cce0;margin-top:4px}.vs{text-align:center;font-size:23px;font-weight:1000;color:#facc15}.search{margin:18px 0;padding:16px;border-radius:18px;border:1px solid #2f80ff66;background:#2f80ff16;text-align:center;font-weight:900}.go,.retry{width:100%;border:0;border-radius:18px;padding:15px;margin-top:15px;background:linear-gradient(#18ed72,#00a84d);color:#fff;font-weight:1000;font-size:18px}.go:disabled{opacity:.45}.retry{background:#0a203b;border:1px solid #2d6a9e}.scorebar{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-bottom:12px}.scorebox{padding:10px;border-radius:15px;background:#0a203b;border:1px solid #24547f;text-align:center;font-weight:900}.scorebox.me{border-color:#22c55e}.score{font-size:25px}.round{font-size:12px;color:#a8b3c7;text-align:center}.timer{font-size:26px;font-weight:1000;color:#facc15;margin-top:4px}.card{padding:18px;border-radius:24px;background:linear-gradient(145deg,#0c2a4d,#06162c);border:2px solid #227ac0}.topic{display:inline-block;padding:6px 10px;border-radius:20px;background:#0d4d83;color:#d9efff;font-size:12px;font-weight:900}.q{font-size:20px;font-weight:900;line-height:1.32;margin:15px 0}.answers{display:grid;gap:10px}.ans{min-height:56px;border-radius:16px;border:2px solid #24547e;background:#10365c;color:#fff;text-align:left;padding:9px 12px;font-weight:800}.ans:disabled{opacity:.78}.ans.good{border-color:#00ef70;background:#075d37}.ans.bad{border-color:#ff4f64;background:#5d1724}.status{min-height:44px;margin-top:12px;text-align:center;font-weight:900}.botthink{color:#facc15}.result{text-align:center;padding-top:20px}.result h1{font-size:32px}.big{font-size:48px;margin:12px}.summary{padding:15px;border-radius:18px;background:#0a203b;border:1px solid #2d6a9e;margin:15px 0}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#ffffff12;color:#cbd5e1;font-size:11px;font-weight:900}</style></head><body><main class="app"><header class="top"><button class="back" onclick="location.href='online-kviz.html'">‹</button><div class="brand">Kviz<i>To</i><b>Go</b></div><div style="width:40px"></div></header><section id="lobby" class="screen on"><div class="hero"><h1>⚔️ Multiplayer</h1><p>Brzi dvoboj znanja • 10 istih ABC pitanja • 8 sekundi</p></div><div class="versus"><div class="player me"><div class="face" id="meFace">TI</div><div class="name" id="meName">Ti</div><div class="meta">Spreman za dvoboj</div></div><div class="vs">VS</div><div class="player"><div class="face" id="botFace">?</div><div class="name" id="botName">Tražimo...</div><div class="meta" id="botMeta">protivnika</div></div></div><div class="search" id="search">Učitavamo originalna ABC pitanja...</div><button class="go" id="start" disabled>Započni dvoboj</button></section><section id="game" class="screen"><div class="scorebar"><div class="scorebox me"><div id="meGame">Ti</div><div class="score" id="meScore">0</div></div><div class="round"><div id="round">1 / 10</div><div class="timer" id="timer">8.0</div></div><div class="scorebox"><div id="botGame">Bot</div><div class="score" id="botScore">0</div></div></div><div class="card"><span class="topic" id="topic">KvizToGo</span><div class="q" id="question"></div><div class="answers" id="answers"></div><div class="status" id="status"></div></div><button class="retry" onclick="finish(true)">Napusti dvoboj</button></section><section id="result" class="screen"><div class="result"><div class="tag">MULTIPLAYER</div><h1 id="resultTitle">Kraj dvoboja</h1><div class="big" id="resultScore">0 : 0</div><div class="summary" id="resultText"></div><button class="go" onclick="location.reload()">Novi protivnik</button><button class="retry" onclick="location.href='online-kviz.html'">Natrag na kvizove</button></div></section></main><script>(()=>{'use strict';const FILES=['AmerickiPredsjednici','AntickiRim','Film','FloraFauna','Gaming','Glazba','Knjizevnost','Moreplovci','Nogomet','Sport','Svastara','Zemljopis','Znanost','povijest','questions-blitz'];const NAMES=['7Ivan','4Ana','9Marko','Nikola5','Ivana2','Matej1','Lucija7','Filip23','Ema64','Josip18','Sara27','Karlo91','Lea42','David76','Iva35','Lovro58','Nina84','ČudniKljun','SjenaSaŠanka','TrećiPokušaj','BezGooglea','KasniOdgovor','MozakNaPauzi','MaliOrakul','KriviKontinent','NoćnaSova','KvizMaster','LovacNaBodove','Mozgalo','Kvizoman','Znalac','BrziPrst','PubKvizVeteran'];const ROUND_MS=8000;let bot=null,pool=[],qs=[],pos=0,me=0,bs=0,roundOver=false,meAnswered=false,botAnswered=false,botTimer=null,roundTimer=null,tickTimer=null,roundStart=0;const $=id=>document.getElementById(id);function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('on',x.id===id));scrollTo(0,0)}function shuffle(a){a=a.slice();for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function initials(n){return n.replace(/\d/g,'').slice(0,2).toUpperCase()}function getMe(){let n='Ti';try{n=localStorage.getItem('kviztogo_username')||localStorage.getItem('username')||'Ti'}catch(e){}return n}function norm(q,src){if(!q||typeof q.question!=='string'||!q.answers||typeof q.answers!=='object'||Array.isArray(q.answers))return null;const keys=['A','B','C'];if(!keys.every(k=>typeof q.answers[k]==='string'&&q.answers[k].trim()))return null;const correctKey=String(q.correct_answer||'').trim().toUpperCase();if(!keys.includes(correctKey))return null;return{question:q.question,topic:q.topic||src,answers:keys.map(k=>({key:k,text:String(q.answers[k])})),correctKey}}async function loadQuestions(){const sets=await Promise.all(FILES.map(async f=>{try{const r=await fetch('ABC%20pitanja/'+encodeURIComponent(f)+'.json',{cache:'no-store'});if(!r.ok)return[];const j=await r.json();const a=Array.isArray(j)?j:(j.questions||[]);return a.map(q=>norm(q,f)).filter(Boolean)}catch(e){return[]}}));pool=sets.flat();if(pool.length<10){$('search').textContent='Nije moguće učitati ABC pitanja.';return}$('search').textContent='ABC baza učitana • '+pool.length+' pitanja ✓';findOpponent()}function findOpponent(){bot={name:NAMES[Math.floor(Math.random()*NAMES.length)],accuracy:.35+Math.random()*.5,speedBias:Math.random()};$('botFace').textContent=initials(bot.name);$('botName').textContent=bot.name;$('botMeta').textContent='Virtualni protivnik • '+Math.round(bot.accuracy*100)+'% forma';$('start').disabled=false}function botDelay(){const r=Math.random(),bias=bot.speedBias;let ms;if(r<.30+bias*.10)ms=6000+Math.random()*500;else if(r<.75)ms=6500+Math.random()*700;else ms=7200+Math.random()*750;return Math.min(7950,Math.max(6000,ms))}function clearRoundTimers(){clearTimeout(botTimer);clearTimeout(roundTimer);clearInterval(tickTimer)}function begin(){if(!bot||pool.length<10)return;$('meGame').textContent=getMe();$('botGame').textContent=bot.name;qs=shuffle(pool).slice(0,10);pos=0;me=0;bs=0;show('game');render()}function render(){clearRoundTimers();roundOver=false;meAnswered=false;botAnswered=false;const q=qs[pos];$('round').textContent=(pos+1)+' / '+qs.length;$('meScore').textContent=me;$('botScore').textContent=bs;$('topic').textContent=q.topic;$('question').textContent=q.question;$('status').innerHTML='<span class="botthink">'+bot.name+' razmišlja…</span>';$('answers').innerHTML='';q.answers.forEach(o=>{const b=document.createElement('button');b.className='ans';b.dataset.key=o.key;b.innerHTML='<b>'+o.key+'.</b> '+o.text;b.onclick=()=>answer(o.key,b);$('answers').appendChild(b)});roundStart=performance.now();$('timer').textContent='8.0';tickTimer=setInterval(()=>{const left=Math.max(0,ROUND_MS-(performance.now()-roundStart));$('timer').textContent=(left/1000).toFixed(1)},100);botTimer=setTimeout(()=>botAnswer(q),botDelay());roundTimer=setTimeout(()=>endByTime(q),ROUND_MS)}function disableAnswers(){document.querySelectorAll('.ans').forEach(x=>x.disabled=true)}function markCorrect(q){document.querySelector('.ans[data-key="'+q.correctKey+'"]')?.classList.add('good')}function nextQuestion(delay=650){if(roundOver)return;roundOver=true;clearRoundTimers();disableAnswers();setTimeout(()=>{pos++;if(pos>=qs.length)finish(false);else render()},delay)}function answer(key,b){if(roundOver||meAnswered)return;meAnswered=true;b.disabled=true;const q=qs[pos],ok=key===q.correctKey;if(ok){me++;$('meScore').textContent=me;b.classList.add('good');$('status').textContent='✓ Točno! Bod je tvoj.';nextQuestion()}else{b.classList.add('bad');document.querySelectorAll('.ans').forEach(x=>x.disabled=true);$('status').textContent=botAnswered?'Oboje netočno. Bez boda.':'✗ Netočno. Protivnik još može odgovoriti…';if(botAnswered)nextQuestion()}}function botAnswer(q){if(roundOver||botAnswered)return;botAnswered=true;const ok=Math.random()<bot.accuracy;if(ok){bs++;$('botScore').textContent=bs;$('status').textContent=bot.name+' je odgovorio točno.';markCorrect(q);nextQuestion()}else{$('status').textContent=meAnswered?'Oboje netočno. Bez boda.':bot.name+' je pogriješio. Ti još možeš odgovoriti.';if(meAnswered)nextQuestion()}}function endByTime(q){if(roundOver)return;clearRoundTimers();roundOver=true;disableAnswers();$('timer').textContent='0.0';if(!meAnswered&&!botAnswered)$('status').textContent='Vrijeme je isteklo. Nitko nije odgovorio.';else if(!meAnswered)$('status').textContent='Vrijeme je isteklo.';else if(!botAnswered)$('status').textContent='Vrijeme je isteklo. Protivnik nije odgovorio.';setTimeout(()=>{pos++;if(pos>=qs.length)finish(false);else render()},650)}function finish(abandoned){clearRoundTimers();show('result');$('resultScore').textContent=me+' : '+bs;if(abandoned){$('resultTitle').textContent='Dvoboj prekinut';$('resultText').textContent='Rezultat u trenutku izlaska: '+me+' : '+bs;return}if(me>bs){$('resultTitle').textContent='🏆 Pobjeda!';$('resultText').textContent='Pobijedio si '+bot.name+'.'}else if(me<bs){$('resultTitle').textContent='Protivnik pobjeđuje';$('resultText').textContent=bot.name+' je ovaj put bio bolji.'}else{$('resultTitle').textContent='🤝 Neriješeno';$('resultText').textContent='Potpuno izjednačen dvoboj.'}}window.finish=finish;$('meName').textContent=getMe();$('meFace').textContent=initials(getMe())||'TI';$('start').onclick=begin;loadQuestions()})();</script></body></html>
