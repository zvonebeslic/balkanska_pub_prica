<html lang="hr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07172b"><title>Multiplayer | KvizToGo</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#020914;color:#fff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit}.app{width:min(100%,560px);min-height:100svh;margin:auto;background:radial-gradient(circle at 50% 0,#168dff33,transparent 28%),#07172b}.top{height:68px;display:flex;align-items:center;gap:10px;padding:8px 12px;background:#000;position:sticky;top:0;z-index:20}.back{width:40px;height:40px;border-radius:13px;border:1px solid #2d78bb;background:#0a203b;color:#fff;font-size:25px}.brand{font-size:25px;font-weight:1000;letter-spacing:-1.4px;flex:1;text-align:center}.brand i{font-style:normal;color:#2f80ff}.brand b{color:#22c55e}.screen{display:none;padding:18px 14px 40px}.screen.on{display:block}.hero{text-align:center;padding:10px 8px 18px}.hero h1{font-size:34px;margin:5px 0}.hero p{color:#a8b3c7;margin:0}.versus{display:grid;grid-template-columns:1fr 54px 1fr;gap:8px;align-items:center}.player{min-height:170px;border:2px solid #24547f;border-radius:22px;padding:14px 8px;text-align:center;background:linear-gradient(145deg,#15385b,#081a30)}.player.me{border-color:#22c55e}.face{width:74px;height:74px;margin:auto;border-radius:50%;display:grid;place-items:center;background:#0a203b;border:2px solid #4385bd;font-size:32px;font-weight:1000}.name{font-weight:1000;margin-top:9px}.meta{font-size:12px;color:#b8cce0;margin-top:4px}.vs{text-align:center;font-size:23px;font-weight:1000;color:#facc15}.search{margin:18px 0;padding:16px;border-radius:18px;border:1px solid #2f80ff66;background:#2f80ff16;text-align:center;font-weight:900}.go,.retry{width:100%;border:0;border-radius:18px;padding:15px;margin-top:15px;background:linear-gradient(#18ed72,#00a84d);color:#fff;font-weight:1000;font-size:18px}.retry{background:#0a203b;border:1px solid #2d6a9e}.scorebar{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-bottom:12px}.scorebox{padding:10px;border-radius:15px;background:#0a203b;border:1px solid #24547f;text-align:center;font-weight:900}.scorebox.me{border-color:#22c55e}.score{font-size:25px}.round{font-size:12px;color:#a8b3c7;text-align:center}.timer{font-size:26px;font-weight:1000;color:#facc15;margin-top:4px}.card{padding:18px;border-radius:24px;background:linear-gradient(145deg,#0c2a4d,#06162c);border:2px solid #227ac0}.topic{display:inline-block;padding:6px 10px;border-radius:20px;background:#0d4d83;color:#d9efff;font-size:12px;font-weight:900}.q{font-size:.98rem;font-weight:400;line-height:1.45;margin:15px 0}.answers{display:grid;gap:.5rem}.ans{min-height:56px;border-radius:16px;border:1px solid rgba(148,163,184,.22);background:#101b2d;color:#f5f7fb;text-align:left;padding:.68rem .8rem;font-size:.93rem;line-height:1.35;font-weight:400}.ans b{display:inline-flex;align-items:center;justify-content:center;width:1.8rem;height:1.8rem;margin-right:.45rem;border-radius:50%;border:1px solid currentColor;font-weight:950}.ans:disabled{opacity:.78}.ans.good{border-color:#22c55e;background:rgba(34,197,94,.2)}.ans.bad{border-color:#ef4444;background:rgba(239,68,68,.2)}.status{min-height:44px;margin-top:12px;text-align:center;font-weight:900}.botthink{color:#facc15}.history{margin-top:14px;padding:14px;border-radius:18px;background:#101b2d;border:1px solid rgba(148,163,184,.22)}.history-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.history-title{font-size:.9rem;font-weight:900;text-transform:uppercase}.history-actions{display:flex;gap:6px}.hist-btn{border:1px solid rgba(148,163,184,.22);background:#ffffff0d;color:#f5f7fb;border-radius:999px;padding:6px 10px;font-size:.76rem;font-weight:850}.history-list{display:flex;flex-direction:column;gap:8px}.hist-item{padding:10px;border-radius:13px;background:#07172b;border:1px solid rgba(148,163,184,.16);font-size:.78rem;line-height:1.42}.hist-q{color:#f5f7fb;margin-bottom:7px}.hist-row{display:block;width:100%;margin-top:4px}.hist-me{color:#d8e8ff}.hist-bot{color:#facc15}.hist-correct{color:#22c55e}.match-end{display:none;margin:14px 0;padding:16px;border-radius:20px;background:#0a203b;border:1px solid #2d6a9e;text-align:center}.match-end.on{display:block}.match-end h2{margin:2px 0 6px}.match-score{font-size:36px;font-weight:1000;margin:6px}.match-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.match-actions button{margin-top:8px}.full{grid-column:1/-1}@media(max-width:768px){.q{font-size:.95rem;line-height:1.38}}
</style></head><body><main class="app"><header class="top"><button class="back" onclick="location.href='online-kviz.html'">‹</button><div class="brand">Kviz<i>To</i><b>Go</b></div><div style="width:40px"></div></header>
<section id="lobby" class="screen on"><div class="hero"><h1>⚔️ Multiplayer</h1><p>Brzi dvoboj znanja • 10 istih ABC pitanja • 8 sekundi</p></div><div class="versus"><div class="player me"><div class="face" id="meFace">GO</div><div class="name" id="meName">Gost</div></div><div class="vs">VS</div><div class="player"><div class="face" id="botFace">?</div><div class="name" id="botName">Tražimo...</div><div class="meta" id="botMeta">protivnika</div></div></div><div class="search" id="search">Učitavamo originalna ABC pitanja...</div><button class="go" id="start" disabled>Započni dvoboj</button></section>
<section id="game" class="screen"><div class="scorebar"><div class="scorebox me"><div id="meGame">Gost</div><div class="score" id="meScore">0</div></div><div class="round"><div id="round">1 / 10</div><div class="timer" id="timer">8.0</div></div><div class="scorebox"><div id="botGame">Bot</div><div class="score" id="botScore">0</div></div></div><div class="card"><span class="topic" id="topic">KvizToGo</span><div class="q" id="question"></div><div class="answers" id="answers"></div><div class="status" id="status"></div></div><div id="matchEnd" class="match-end"><h2 id="resultTitle">Kraj dvoboja</h2><div id="resultScore" class="match-score"></div><div id="resultText"></div><div class="match-actions"><button class="go" id="rematch">Revanš</button><button class="retry" id="newOpponent">Novi protivnik</button><button class="retry full" onclick="location.href='online-kviz.html'">Natrag na kvizove</button></div></div><div class="history"><div class="history-head"><div class="history-title">Povijest kviza</div><div class="history-actions"><button class="hist-btn" id="shareHistory">Podijeli</button><button class="hist-btn" id="saveHistory">Spremi</button></div></div><div class="history-list" id="historyList"></div></div><button class="retry" id="leaveBtn" onclick="finish(true)">Napusti dvoboj</button></section></main>
<script>(()=>{'use strict';const FILES=['AmerickiPredsjednici','AntickiRim','Film','FloraFauna','Gaming','Glazba','Knjizevnost','Moreplovci','Nogomet','Sport','Svastara','Zemljopis','Znanost','povijest','questions-blitz'];const NAMES=['7Ivan','4Ana','9Marko','Nikola5','Ivana2','Matej1','Lucija7','Filip23','Ema64','Josip18','Sara27','Karlo91','Lea42','David76','Iva35','Lovro58','Nina84','ČudniKljun','SjenaSaŠanka','TrećiPokušaj','BezGooglea','KasniOdgovor','MozakNaPauzi','MaliOrakul','KriviKontinent','NoćnaSova','KvizMaster','LovacNaBodove','Mozgalo','Kvizoman','Znalac','BrziPrst','PubKvizVeteran'];const ROUND_MS=8000,REVEAL_MS=2000;let bot=null,pool=[],qs=[],history=[],pos=0,me=0,bs=0,roundOver=false,meAnswered=false,botAnswered=false,meChoice=null,botChoice=null,botTimer,roundTimer,tickTimer;const $=id=>document.getElementById(id),shuffle=a=>{a=a.slice();for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a},esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function getMe(){try{return localStorage.getItem('kviztogo_username')||localStorage.getItem('username')||localStorage.getItem('guestName')||localStorage.getItem('guest_name')||'Gost'}catch(e){return'Gost'}}function initials(n){return String(n).replace(/\d/g,'').slice(0,2).toUpperCase()||'GO'}function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('on',x.id===id));scrollTo(0,0)}function norm(q,s){if(!q||typeof q.question!=='string'||!q.answers||Array.isArray(q.answers))return null;let k=['A','B','C'],c=String(q.correct_answer||'').toUpperCase();if(!k.every(x=>typeof q.answers[x]==='string')||!k.includes(c))return null;return{question:q.question,topic:q.topic||s,answers:k.map(x=>({key:x,text:q.answers[x]})),correctKey:c}}async function loadQuestions(){let sets=await Promise.all(FILES.map(async f=>{try{let r=await fetch('ABC%20pitanja/'+encodeURIComponent(f)+'.json',{cache:'no-store'}),j=await r.json(),a=Array.isArray(j)?j:(j.questions||[]);return a.map(q=>norm(q,f)).filter(Boolean)}catch(e){return[]}}));pool=sets.flat();if(pool.length<10){$('search').textContent='Nije moguće učitati ABC pitanja.';return}$('search').textContent='ABC baza učitana • '+pool.length+' pitanja ✓';findOpponent()}function findOpponent(){bot={name:NAMES[Math.floor(Math.random()*NAMES.length)],accuracy:.35+Math.random()*.5,speedBias:Math.random()};$('botFace').textContent=initials(bot.name);$('botName').textContent=bot.name;$('botMeta').textContent='Virtualni protivnik • '+Math.round(bot.accuracy*100)+'% forma';$('start').disabled=false}function botDelay(){let r=Math.random(),m=r<.4?6000+Math.random()*500:r<.75?6500+Math.random()*700:7200+Math.random()*750;return Math.min(7950,m)}function clearTimers(){clearTimeout(botTimer);clearTimeout(roundTimer);clearInterval(tickTimer)}function answerText(q,k){let a=q.answers.find(x=>x.key===k);return a?a.text:'—'}function addHistory(q){history.push({question:q.question,answers:q.answers.map(a=>({...a})),correctKey:q.correctKey,correct:answerText(q,q.correctKey),me:meChoice,bot:botChoice});renderHistory()}function renderHistory(){let l=$('historyList');l.innerHTML='';history.slice().reverse().forEach((h,ri)=>{let d=document.createElement('div'),n=history.length-ri;d.className='hist-item';d.innerHTML='<div class="hist-q">'+n+'. '+esc(h.question)+'</div><div class="hist-row hist-me"><b>'+esc(getMe())+':</b> '+esc(h.me?h.me+'. '+answerText(h,h.me):'nije odgovorio')+'</div><div class="hist-row hist-bot"><b>'+esc(bot.name)+':</b> '+esc(h.bot?h.bot+'. '+answerText(h,h.bot):'nije odgovorio')+'</div><div class="hist-row hist-correct"><b>Točno:</b> '+esc(h.correctKey+'. '+h.correct)+'</div>';l.appendChild(d)})}function startMatch(){if(!bot||pool.length<10)return;qs=shuffle(pool).slice(0,10);history=[];pos=me=bs=0;$('matchEnd').classList.remove('on');$('leaveBtn').style.display='block';$('meGame').textContent=getMe();$('botGame').textContent=bot.name;show('game');renderHistory();render()}function render(){clearTimers();roundOver=meAnswered=botAnswered=false;meChoice=botChoice=null;let q=qs[pos];$('round').textContent=(pos+1)+' / 10';$('meScore').textContent=me;$('botScore').textContent=bs;$('topic').textContent=q.topic;$('question').textContent=q.question;$('status').innerHTML='<span class="botthink">'+esc(bot.name)+' razmišlja…</span>';$('answers').innerHTML='';q.answers.forEach(o=>{let b=document.createElement('button');b.className='ans';b.dataset.key=o.key;b.innerHTML='<b>'+o.key+'</b> '+esc(o.text);b.onclick=()=>answer(o.key,b);$('answers').appendChild(b)});let st=performance.now();$('timer').textContent='8.0';tickTimer=setInterval(()=>$('timer').textContent=(Math.max(0,ROUND_MS-(performance.now()-st))/1000).toFixed(1),100);botTimer=setTimeout(()=>botAnswer(q),botDelay());roundTimer=setTimeout(()=>endByTime(q),ROUND_MS)}function disable(){document.querySelectorAll('.ans').forEach(x=>x.disabled=true)}function mark(q){document.querySelector('.ans[data-key="'+q.correctKey+'"]')?.classList.add('good')}function close(q,msg,delay=REVEAL_MS){if(roundOver)return;roundOver=true;clearTimers();disable();mark(q);$('status').textContent=msg;addHistory(q);setTimeout(()=>{pos++;pos>=qs.length?finish(false):render()},delay)}function answer(k,b){if(roundOver||meAnswered)return;meAnswered=true;meChoice=k;let q=qs[pos];if(k===q.correctKey){me++;$('meScore').textContent=me;b.classList.add('good');close(q,'✓ Točno! Bod je tvoj.',650)}else{b.classList.add('bad');disable();if(botAnswered)close(q,'Točan odgovor: '+q.correctKey+'. '+answerText(q,q.correctKey));else $('status').textContent='✗ Netočno. Protivnik još može odgovoriti…'}}function botAnswer(q){if(roundOver||botAnswered)return;botAnswered=true;let ok=Math.random()<bot.accuracy;botChoice=ok?q.correctKey:shuffle(q.answers.filter(a=>a.key!==q.correctKey))[0].key;if(ok){bs++;$('botScore').textContent=bs;close(q,bot.name+' je odgovorio točno.',650)}else if(meAnswered)close(q,'Točan odgovor: '+q.correctKey+'. '+answerText(q,q.correctKey));else $('status').textContent=bot.name+' je pogriješio. Još možeš odgovoriti.'}function endByTime(q){if(!roundOver){$('timer').textContent='0.0';close(q,'Točan odgovor: '+q.correctKey+'. '+answerText(q,q.correctKey))}}function historyText(){let o='KvizToGo Multiplayer\n'+getMe()+' '+me+' : '+bs+' '+bot.name+'\n\n';history.forEach((h,i)=>o+=(i+1)+'. '+h.question+'\n'+getMe()+': '+(h.me?h.me+'. '+answerText(h,h.me):'nije odgovorio')+'\n'+bot.name+': '+(h.bot?h.bot+'. '+answerText(h,h.bot):'nije odgovorio')+'\nTočno: '+h.correctKey+'. '+h.correct+'\n\n');return o.trim()}async function shareHistory(){let t=historyText();try{navigator.share?await navigator.share({title:'KvizToGo Multiplayer',text:t}):await navigator.clipboard.writeText(t)}catch(e){}}function saveHistory(){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([historyText()],{type:'text/plain;charset=utf-8'}));a.href=u;a.download='KvizToGo-multiplayer-povijest.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function finish(abandoned){clearTimers();roundOver=true;disable();$('leaveBtn').style.display='none';$('matchEnd').classList.add('on');$('resultScore').textContent=me+' : '+bs;if(abandoned){$('resultTitle').textContent='Dvoboj prekinut';$('resultText').textContent='Rezultat u trenutku izlaska.'}else if(me>bs){$('resultTitle').textContent='🏆 Pobjeda!';$('resultText').textContent='Pobijedio si '+bot.name+'.'}else if(me<bs){$('resultTitle').textContent='Protivnik pobjeđuje';$('resultText').textContent=bot.name+' je ovaj put bio bolji.'}else{$('resultTitle').textContent='🤝 Neriješeno';$('resultText').textContent='Potpuno izjednačen dvoboj.'}$('matchEnd').scrollIntoView({behavior:'smooth',block:'center'})}window.finish=finish;let mn=getMe();$('meName').textContent=mn;$('meFace').textContent=initials(mn);$('start').onclick=startMatch;$('shareHistory').onclick=shareHistory;$('saveHistory').onclick=saveHistory;$('rematch').onclick=startMatch;$('newOpponent').onclick=()=>{findOpponent();startMatch()};loadQuestions()})();</script></body></html>
