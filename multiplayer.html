<!doctype html><html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07172b"><title>Multiplayer | KvizToGo</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#020914;color:#fff;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit}.app{width:min(100%,560px);min-height:100svh;margin:auto;background:radial-gradient(circle at 50% 0,#168dff33,transparent 28%),#07172b}.top{height:68px;display:flex;align-items:center;gap:10px;padding:8px 12px;background:#000;position:sticky;top:0;z-index:20}.back{width:40px;height:40px;border-radius:13px;border:1px solid #2d78bb;background:#0a203b;color:#fff;font-size:25px}.brand{font-size:25px;font-weight:1000;letter-spacing:-1.4px;flex:1;text-align:center}.brand i{font-style:normal;color:#2f80ff}.brand b{color:#22c55e}.screen{display:none;padding:18px 14px 40px}.screen.on{display:block}.hero{text-align:center;padding:10px 8px 18px}.hero h1{font-size:34px;margin:5px 0}.hero p{color:#a8b3c7;margin:0}.versus{display:grid;grid-template-columns:1fr 54px 1fr;gap:8px;align-items:center}.player{min-height:170px;border:2px solid #24547f;border-radius:22px;padding:14px 8px;text-align:center;background:linear-gradient(145deg,#15385b,#081a30);box-shadow:0 12px 28px #0007}.player.me{border-color:#22c55e}.face{width:74px;height:74px;margin:auto;border-radius:50%;display:grid;place-items:center;background:#0a203b;border:2px solid #4385bd;font-size:32px;font-weight:1000}.name{font-weight:1000;margin-top:9px;overflow:hidden;text-overflow:ellipsis}.meta{font-size:12px;color:#b8cce0;margin-top:4px}.vs{text-align:center;font-size:23px;font-weight:1000;color:#facc15}.search{margin:18px 0;padding:16px;border-radius:18px;border:1px solid #2f80ff66;background:#2f80ff16;text-align:center;font-weight:900}.dots:after{content:'...';animation:dots 1.2s steps(4,end) infinite}@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%,100%{content:'...'}}.go,.retry{width:100%;border:0;border-radius:18px;padding:15px;margin-top:15px;background:linear-gradient(#18ed72,#00a84d);color:#fff;font-weight:1000;font-size:18px;box-shadow:0 7px 0 #006d35}.retry{background:#0a203b;border:1px solid #2d6a9e;box-shadow:none}.scorebar{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-bottom:12px}.scorebox{padding:10px;border-radius:15px;background:#0a203b;border:1px solid #24547f;text-align:center;font-weight:900}.scorebox.me{border-color:#22c55e}.score{font-size:25px}.round{font-size:12px;color:#a8b3c7;text-align:center}.card{padding:18px;border-radius:24px;background:linear-gradient(145deg,#0c2a4d,#06162c);border:2px solid #227ac0;box-shadow:0 18px 35px #0008}.topic{display:inline-block;padding:6px 10px;border-radius:20px;background:#0d4d83;color:#d9efff;font-size:12px;font-weight:900}.q{font-size:20px;font-weight:900;line-height:1.32;margin:15px 0}.answers{display:grid;gap:10px}.ans{min-height:56px;border-radius:16px;border:2px solid #24547e;background:#10365c;color:#fff;text-align:left;padding:9px 12px;font-weight:800}.ans:disabled{opacity:.72}.ans.good{border-color:#00ef70;background:#075d37}.ans.bad{border-color:#ff4f64;background:#5d1724}.status{min-height:44px;margin-top:12px;text-align:center;font-weight:900}.botthink{color:#facc15}.result{text-align:center;padding-top:20px}.result h1{font-size:32px}.big{font-size:48px;margin:12px}.summary{padding:15px;border-radius:18px;background:#0a203b;border:1px solid #2d6a9e;margin:15px 0}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#ffffff12;color:#cbd5e1;font-size:11px;font-weight:900}@media(min-width:700px){body{padding:18px}.app{border-radius:30px;overflow:hidden;box-shadow:0 0 70px #000}}</style></head><body><main class="app"><header class="top"><button class="back" onclick="location.href='online-kviz.html'">‹</button><div class="brand">Kviz<i>To</i><b>Go</b></div><div style="width:40px"></div></header><section id="lobby" class="screen on"><div class="hero"><h1>⚔️ Multiplayer</h1><p>Brzi dvoboj znanja • 10 istih pitanja</p></div><div class="versus"><div class="player me"><div class="face" id="meFace">TI</div><div class="name" id="meName">Ti</div><div class="meta">Spreman za dvoboj</div></div><div class="vs">VS</div><div class="player"><div class="face" id="botFace">?</div><div class="name" id="botName">Tražimo...</div><div class="meta" id="botMeta">protivnika</div></div></div><div class="search" id="search">Tražimo protivnika<span class="dots"></span></div><button class="go" id="start" disabled>Započni dvoboj</button></section><section id="game" class="screen"><div class="scorebar"><div class="scorebox me"><div id="meGame">Ti</div><div class="score" id="meScore">0</div></div><div class="round" id="round">1 / 10</div><div class="scorebox"><div id="botGame">Bot</div><div class="score" id="botScore">0</div></div></div><div class="card"><span class="topic" id="topic">KvizToGo</span><div class="q" id="question"></div><div class="answers" id="answers"></div><div class="status" id="status"></div></div><button class="retry" onclick="finish(true)">Napusti dvoboj</button></section><section id="result" class="screen"><div class="result"><div class="tag">MULTIPLAYER</div><h1 id="resultTitle">Kraj dvoboja</h1><div class="big" id="resultScore">0 : 0</div><div class="summary" id="resultText"></div><button class="go" onclick="location.reload()">Novi protivnik</button><button class="retry" onclick="location.href='online-kviz.html'">Natrag na kvizove</button></div></section></main><script>(()=>{'use strict';const FILES=['AmerickiPredsjednici','AntickiRim','Film','FloraFauna','Gaming','Glazba','Knjizevnost','Moreplovci','Nogomet','Sport','Svastara','Zemljopis','Znanost','povijest'];const NAMES=['7Ivan','4Ana','9Marko','Јово','Стефан','Светлана','Nikola5','Ivana2','Matej1','Lucija7','Filip23','Ema64','Josip18','Sara27','Karlo91','Lea42','David76','Iva35','Lovro58','Nina84','ČudniKljun','SjenaSaŠanka','TrećiPokušaj','KaktusNaKvadrat','BezGooglea','KasniOdgovor','PlaviToster','MozakNaPauzi','MaliOrakul','KriviKontinent','TihiAlarm','ZadnjaKlupa','PetaBrzina','PolaBoda','NoćnaSova','KavaBezŠećera','LijeviKlik','ZeleniFenjer','MorskiKrastavac','NultiMeridijan','PogrešanPlanet','ŠestiOsjećaj','DvaPromilaZnanja','RezervniMozak','SlučajniGenij','KraljTipfelera','ČetvrtiOdgovor','PitajSusjeda','BezPojmaAliBrzo','TkoJeOvo','KrumpirProfesor','GospodinMožda','AjdeC','NisamUčio','BurekLogika','KvizniPuž','PametniĆevap','ČekajZnam','MaloSutra','JošJednoPaIdem','NijeA','SigurnoB','MoždaC','ProfesoricaKava','TriSekundeKasnije','KvizniJež','ZaboravniLav','PonedjeljakMozak','SubotnjiGenije','TetaWikipedia','KvizMaster','LovacNaBodove','Mozgalo','Kvizoman','Znalac','Pitanjolovac','BrziPrst','PubKvizVeteran','Enciklopedist','KvizNindža','BodPoBod','TridesetPitanja','FinalniOdgovor','BezDžokera','LovacNaTrideset','KvizKompas','TihiZnalac','MozakUTrećoj','KvizRudar','TočanOdgovor'];const GROUPS=[['excellent',8,.82,.94,[180,300]],['veryGood',17,.70,.84,[210,360]],['average',30,.48,.70,[270,480]],['sufficient',20,.34,.55,[330,570]],['bad',15,.20,.42,[420,660]],['veryBad',10,.10,.28,[480,720]]];let bot=null,pool=[],qs=[],pos=0,me=0,bs=0,locked=false,botTimer=null;const $=id=>document.getElementById(id);function hash(v){let r=2166136261;for(let i=0;i<v.length;i++){r^=v.charCodeAt(i);r=Math.imul(r,16777619)}return r>>>0}function rng(seed){let v=hash(seed)||1;return()=>{v+=0x6d2b79f5;let r=v;r=Math.imul(r^(r>>>15),r|1);r^=r+Math.imul(r^(r>>>7),r|61);return((r^(r>>>14))>>>0)/4294967296}}function profiles(){let gi=0,u=0;return NAMES.map((name,i)=>{while(gi<GROUPS.length-1&&u>=GROUPS[gi][1]){gi++;u=0}const g=GROUPS[gi];u++;const r=rng('demo-profile:'+i+':'+name.replace(/\d+$/,''));return{id:'demo-'+(i+1),name,skill:g[0],accuracy:g[2]+r()*(g[3]-g[2]),base:g[4],cons:.35+r()*.6}})}function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('on',x.id===id));scrollTo(0,0)}function shuffle(a){a=a.slice();for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function initials(n){return n.replace(/\d/g,'').slice(0,2).toUpperCase()}function getMe(){let n='Ti';try{n=localStorage.getItem('kviztogo_username')||localStorage.getItem('username')||'Ti'}catch(e){}return n}function norm(q,src,i){if(!q||!q.question)return null;let answers=q.answers,correct='';if(Array.isArray(answers)){if(answers.length<2)return null;correct=String(q.correct_answer||q.correct||answers[0]);return{question:q.question,topic:q.topic||src,answers:shuffle(answers.slice(0,4).map(String)),correct}}if(answers&&typeof answers==='object'){const keys=['A','B','C'].filter(k=>typeof answers[k]==='string');if(keys.length<2)return null;const ck=String(q.correct_answer||q.correct||'A').toUpperCase();correct=answers[ck]||answers.A;return{question:q.question,topic:q.topic||src,answers:keys.map(k=>String(answers[k])),correct:String(correct)}}return null}async function loadQuestions(){const sets=await Promise.all(FILES.map(async f=>{try{const r=await fetch(encodeURI(f+'.json'),{cache:'no-store'});if(!r.ok)return[];const j=await r.json();const a=Array.isArray(j)?j:(j.questions||[]);return a.map((q,i)=>norm(q,f,i)).filter(Boolean)}catch(e){return[]}}));pool=sets.flat()}function findOpponent(){const P=profiles();bot=P[Math.floor(Math.random()*P.length)];$('botFace').textContent=initials(bot.name);$('botName').textContent=bot.name;$('botMeta').textContent='Virtualni protivnik • '+Math.round(bot.accuracy*100)+'% forma';$('search').textContent='Protivnik pronađen ✓';$('start').disabled=false}function botDelay(){const [a,b]=bot.base;const raw=a+Math.random()*(b-a);return Math.max(1100,Math.min(9000,raw*10*(.75+Math.random()*.7)))}function begin(){if(!bot||pool.length<10)return;$('meGame').textContent=getMe();$('botGame').textContent=bot.name;qs=shuffle(pool).slice(0,10);pos=0;me=0;bs=0;show('game');render()}function render(){locked=false;clearTimeout(botTimer);const q=qs[pos];$('round').textContent=(pos+1)+' / '+qs.length;$('meScore').textContent=me;$('botScore').textContent=bs;$('topic').textContent=q.topic;$('question').textContent=q.question;$('status').innerHTML='<span class="botthink">'+bot.name+' razmišlja…</span>';$('answers').innerHTML='';shuffle(q.answers).forEach((a,i)=>{const b=document.createElement('button');b.className='ans';b.innerHTML='<b>'+String.fromCharCode(65+i)+'.</b> '+a;b.onclick=()=>answer(a,b);$('answers').appendChild(b)});botTimer=setTimeout(()=>botAnswer(q),botDelay())}function answer(a,b){if(locked)return;locked=true;document.querySelectorAll('.ans').forEach(x=>x.disabled=true);const q=qs[pos],ok=a===q.correct;if(ok){me++;b.classList.add('good')}else{b.classList.add('bad');[...document.querySelectorAll('.ans')].find(x=>x.textContent.includes(q.correct))?.classList.add('good')}$('meScore').textContent=me;$('status').textContent=ok?'✓ Točno! Čekamo protivnika…':'✗ Netočno. Čekamo protivnika…'}function botAnswer(q){const ok=Math.random()<bot.accuracy;if(ok)bs++;$('botScore').textContent=bs;const msg=ok?bot.name+' je odgovorio točno.':bot.name+' je pogriješio.';$('status').textContent=msg;document.querySelectorAll('.ans').forEach(x=>x.disabled=true);locked=true;setTimeout(()=>{pos++;if(pos>=qs.length)finish(false);else render()},900)}function finish(abandoned){clearTimeout(botTimer);show('result');$('resultScore').textContent=me+' : '+bs;if(abandoned){$('resultTitle').textContent='Dvoboj prekinut';$('resultText').textContent='Rezultat u trenutku izlaska: '+me+' : '+bs;return}if(me>bs){$('resultTitle').textContent='🏆 Pobjeda!';$('resultText').textContent='Pobijedio si '+bot.name+'. Odličan dvoboj.'}else if(me<bs){$('resultTitle').textContent='Protivnik pobjeđuje';$('resultText').textContent=bot.name+' je ovaj put bio bolji. Traži revanš.'}else{$('resultTitle').textContent='🤝 Neriješeno';$('resultText').textContent='Potpuno izjednačen dvoboj. Vrijeme je za revanš.'}}window.finish=finish;$('meName').textContent=getMe();$('meFace').textContent=initials(getMe())||'TI';$('start').onclick=begin;loadQuestions();setTimeout(findOpponent,1800)})();</script></body></html>
