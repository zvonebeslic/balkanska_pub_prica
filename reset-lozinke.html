const T={hr:{title:'Nova lozinka | KvizToGo',heading:'Postavi novu lozinku',intro:'Upiši novu lozinku za svoj KvizToGo račun.',password:'Nova lozinka',confirm:'Ponovi novu lozinku',rules:'Najmanje 6 znakova, barem jedan broj i jedan poseban znak.',save:'Spremi novu lozinku',back:'Povratak na prijavu',expired:'Link je istekao ili nije valjan. Zatraži novi link za promjenu lozinke.',mismatch:'Lozinke se ne podudaraju.',weak:'Lozinka mora imati najmanje 6 znakova, broj i poseban znak.',success:'Lozinka je uspješno promijenjena. Sada se ponovno prijavi.'},en:{title:'New password | KvizToGo',heading:'Set a new password',intro:'Enter a new password for your KvizToGo account.',password:'New password',confirm:'Repeat new password',rules:'At least 6 characters, including one number and one special character.',save:'Save new password',back:'Back to sign in',expired:'This link has expired or is invalid. Request a new password reset link.',mismatch:'The passwords do not match.',weak:'The password must contain at least 6 characters, a number and a special character.',success:'Your password has been changed successfully. Please sign in again.'}};
let lang=localStorage.getItem('kviztogo_lang')==='en'?'en':'hr';const tr=k=>T[lang][k];
const SUPABASE_URL='https://hssfjguysejbosvholqu.supabase.co',SUPABASE_KEY='sb_publishable_1wlZVov1csReXuZEgcuInA_7F7_gzIy';const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,detectSessionInUrl:true,autoRefreshToken:true,flowType:'implicit'}});const form=document.getElementById('reset-form'),message=document.getElementById('message'),loginLink=document.getElementById('login-link'),saveBtn=document.getElementById('save-btn');document.getElementById('year').textContent=new Date().getFullYear();

async function initialize(){const hash=new URLSearchParams(location.hash.replace(/^#/,'')),err=hash.get('error_description')||hash.get('error');if(err){message.className='message error';message.textContent=decodeURIComponent(err);loginLink.hidden=false;return}await new Promise(r=>setTimeout(r,80));const {data,error}=await client.auth.getSession();if(error||!data?.session){message.className='message error';message.textContent=tr('expired');loginLink.hidden=false;return}history.replaceState({},document.title,location.pathname+location.search);form.hidden=false}
