<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Nova lozinka | KvizToGo</title>
  <link rel="icon" type="image/png" href="images/KvizToGo-online-kviz-pitanja.png">
  <style>
    *{box-sizing:border-box;margin:0;padding:0} :root{--bg:#0b1220;--card:#162235;--soft:#101b2d;--blue:#2f80ff;--green:#22c55e;--red:#ef4444;--text:#f5f7fb;--muted:#a8b3c7;--border:rgba(148,163,184,.22)}
    body{min-height:100vh;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at top left,rgba(47,128,255,.14),transparent 42%),radial-gradient(circle at bottom right,rgba(34,197,94,.10),transparent 38%),var(--bg);color:var(--text);display:flex;flex-direction:column}
    header{display:grid;grid-template-columns:46px 1fr 46px;align-items:center;padding:.7rem 1rem;background:#000;border-bottom:1px solid rgba(255,255,255,.08)}
    .logo{justify-self:center;text-decoration:none;font-size:clamp(2rem,10vw,3.4rem);font-weight:900;letter-spacing:-.06em}.w{color:#fff}.b{color:var(--blue)}.g{color:var(--green)}
    main{flex:1;width:min(430px,calc(100% - 1.2rem));margin:1rem auto;display:flex;align-items:center}.card{width:100%;padding:1.2rem;background:var(--card);border:1px solid var(--border);border-radius:24px;box-shadow:0 18px 45px rgba(0,0,0,.35)}
    h1{text-align:center;font-size:1.4rem;margin-bottom:.35rem}.copy{text-align:center;color:var(--muted);font-size:.9rem;line-height:1.5;margin-bottom:1rem}label{display:block;margin-top:.8rem;font-size:.85rem;font-weight:800}input{width:100%;margin-top:.3rem;padding:.78rem;border-radius:16px;border:1px solid var(--border);background:var(--soft);color:#fff;font-size:16px;outline:none}input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(47,128,255,.18)}
    button,.btn{width:100%;min-height:46px;margin-top:1rem;border:0;border-radius:999px;background:var(--blue);color:#fff;font-weight:900;cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center}.btn.secondary{background:rgba(255,255,255,.08);border:1px solid var(--border)}button:disabled{opacity:.6;cursor:wait}.message{min-height:1.3rem;margin-top:.8rem;text-align:center;font-size:.85rem;color:#facc15}.message.ok{color:var(--green)}.message.error{color:#fca5a5}.rules{margin-top:.35rem;color:var(--muted);font-size:.76rem;line-height:1.4}footer{padding:1rem;text-align:center;background:#000;color:var(--muted);font-size:.78rem}
  </style>
</head>
<body>
<header><span></span><a class="logo" href="index.html"><span class="w">Kviz</span><span class="b">To</span><span class="g">Go</span></a><span></span></header>
<main>
  <section class="card">
    <h1>Postavi novu lozinku</h1>
    <p class="copy" id="intro">Upiši novu lozinku za svoj KvizToGo račun.</p>
    <form id="reset-form" hidden>
      <label>Nova lozinka<input id="password" type="password" minlength="6" autocomplete="new-password" required></label>
      <label>Ponovi novu lozinku<input id="password-confirm" type="password" minlength="6" autocomplete="new-password" required></label>
      <p class="rules">Najmanje 6 znakova, barem jedan broj i jedan poseban znak.</p>
      <button id="save-btn" type="submit">Spremi novu lozinku</button>
    </form>
    <p class="message" id="message" role="status" aria-live="polite"></p>
    <a class="btn secondary" id="login-link" href="login.html" hidden>Povratak na prijavu</a>
  </section>
</main>
<footer>© <span id="year"></span> KvizToGo</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL="https://hssfjguysejbosvholqu.supabase.co";
  const SUPABASE_KEY="sb_publishable_1wlZVov1csReXuZEgcuInA_7F7_gzIy";
  const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,detectSessionInUrl:true,autoRefreshToken:true,flowType:"implicit"}});
  const form=document.getElementById("reset-form"),message=document.getElementById("message"),loginLink=document.getElementById("login-link"),saveBtn=document.getElementById("save-btn");
  document.getElementById("year").textContent=new Date().getFullYear();
  function strong(value){return value.length>=6&&/\d/.test(value)&&/[^A-Za-z0-9]/.test(value)}
  async function initialize(){
    const hash=new URLSearchParams(location.hash.replace(/^#/,""));
    const error=hash.get("error_description")||hash.get("error");
    if(error){message.className="message error";message.textContent=decodeURIComponent(error);loginLink.hidden=false;return}
    await new Promise(resolve=>setTimeout(resolve,80));
    const {data,error:sessionError}=await client.auth.getSession();
    if(sessionError||!data?.session){message.className="message error";message.textContent="Link je istekao ili nije valjan. Zatraži novi link za promjenu lozinke.";loginLink.hidden=false;return}
    history.replaceState({},document.title,location.pathname+location.search);
    form.hidden=false;
  }
  form.addEventListener("submit",async event=>{
    event.preventDefault();
    const password=document.getElementById("password").value;
    const confirmation=document.getElementById("password-confirm").value;
    message.className="message";message.textContent="";
    if(password!==confirmation){message.className="message error";message.textContent="Lozinke se ne podudaraju.";return}
    if(!strong(password)){message.className="message error";message.textContent="Lozinka mora imati najmanje 6 znakova, broj i poseban znak.";return}
    saveBtn.disabled=true;
    const {error}=await client.auth.updateUser({password});
    if(error){message.className="message error";message.textContent=error.message;saveBtn.disabled=false;return}
    await client.auth.signOut({scope:"global"}).catch(()=>{});
    form.hidden=true;message.className="message ok";message.textContent="Lozinka je uspješno promijenjena. Sada se ponovno prijavi.";loginLink.hidden=false;
  });
  initialize();
</script>
</body>
</html>
