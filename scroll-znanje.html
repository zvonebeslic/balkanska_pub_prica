<style>
:root{--bg:#0b1220;--card:#162235;--blue:#2f80ff;--green:#22c55e;--red:#ef4444;--muted:#a8b3c7;--border:rgba(148,163,184,.22);--card-soft:#101b2d}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at top left,rgba(47,128,255,.14),transparent 42%),radial-gradient(circle at bottom right,rgba(34,197,94,.10),transparent 38%),var(--bg);color:#f5f7fb;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.head{position:sticky;top:0;z-index:10;background:#000;border-bottom:1px solid #ffffff18;padding:12px;text-align:center}.logo{font-size:30px;font-weight:900;text-decoration:none;color:#fff;letter-spacing:-.055em}.logo b{color:var(--blue)}.logo i{color:var(--green);font-style:normal}.back,.lang{position:fixed;top:10px;z-index:30;color:#fff;text-decoration:none;font-weight:800;font-size:14px;padding:8px 10px;border:1px solid var(--border);border-radius:999px;background:rgba(16,27,45,.94);backdrop-filter:blur(10px)}.back{left:10px}.lang{right:10px;width:40px;height:36px;padding:0;cursor:pointer;font-size:19px}.wrap{width:min(760px,calc(100% - 20px));margin:18px auto 60px}.hero{margin:14px 0;background:linear-gradient(135deg,#162235f5,#101b2df5);border:1px solid var(--border);border-radius:22px;padding:18px}.hero h1{margin:0 0 8px;font-size:28px}.hero p{margin:0;color:var(--muted)}.picker{display:grid;gap:8px;margin-top:15px}.pick{width:100%;text-align:left;border:1px solid var(--border);background:#101b2d;color:#fff;border-radius:14px;padding:13px 15px;font-weight:850;cursor:pointer;text-decoration:none}.pick:hover,.pick.on{border-color:var(--blue);background:#17335b}.topics{display:none;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:8px}.topics.open{display:grid}.feed{display:grid;gap:16px}.q{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:17px;box-shadow:0 10px 26px #0004;scroll-margin-top:75px}.know{font-size:12px;font-weight:900;color:#86b7ff;text-transform:uppercase;letter-spacing:.08em;margin-bottom:9px}.qt{font-size:18px;font-weight:800;line-height:1.45}.answer{display:flex;gap:.4rem;align-items:center;margin-top:15px}.answer input{min-width:0;flex:1;border:1px solid var(--border);background:var(--card-soft);color:#f5f7fb;border-radius:16px;padding:.65rem 1.1rem;font-size:1rem;outline:none}.answer input::placeholder{color:rgba(245,247,251,.45)}.answer input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(47,128,255,.18)}.ok{width:44px;height:44px;flex:0 0 44px;border:1px solid var(--green);border-radius:12px;background:var(--green);color:#fff;-webkit-text-fill-color:#fff;font-size:22px;font-weight:950;line-height:1;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 0 16px rgba(34,197,94,.26)}.ok:hover:not(:disabled){background:#16a34a;border-color:#16a34a;box-shadow:0 0 20px rgba(34,197,94,.36)}.ok:disabled{opacity:.55}.result{min-height:22px;margin-top:8px;font-weight:850}.result.good{color:#69e99a}.result.bad{color:#ff8181}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.more,.share{border-radius:12px;padding:11px;border:2px solid var(--blue);font-weight:850;cursor:pointer}.more{background:var(--blue);color:#fff}.share{background:transparent;color:#fff;border-color:#facc15}.end{text-align:center;padding:25px;color:var(--muted);font-weight:800}.loading{text-align:center;padding:20px;color:var(--muted)}@media(max-width:520px){.back{top:8px;left:7px;font-size:12px;padding:7px 8px}.lang{top:8px;right:7px}.topics{grid-template-columns:1fr}.actions{grid-template-columns:1fr}.hero h1{font-size:24px}.qt{font-size:17px}}
</style>
</head><body>

<main class="wrap"><section class="hero"><h1 id="pageHeading">Scrollanjem do Znanja</h1><p id="pageCopy">Odaberi način i samo skrolaj. Bez numeriranja, bez ponavljanja pitanja.</p><div class="picker"><button class="pick" data-mode="all" id="allBtn">Beskrajni niz</button><button class="pick" data-mode="50" id="fiftyBtn">Nasumičnih 50</button><button class="pick" id="topicsBtn">Teme ▾</button><div class="topics" id="topics"></div></div></section><section class="feed" id="feed"></section><div id="sentinel"></div></main>
<script>
const I18N={hr:{title:'Scrollanjem do Znanja | KvizToGo',description:'Scrollaj kroz KvizToGo pitanja, odgovaraj bez vremenskog ograničenja i uči usput.',back:'← Natrag na kvizove',heading:'Scrollanjem do Znanja',copy:'Odaberi način i samo skrolaj. Bez numeriranja, bez ponavljanja pitanja.',all:'Beskrajni niz',fifty:'Nasumičnih 50',topics:'Teme ▾',know:'Znaš ovo?',placeholder:'Upiši svoj odgovor...',confirm:'Potvrdi odgovor',more:'Saznaj više',share:'Pošalji prijatelju',correct:'✓ Točno!',wrong:'✕ Netočno. Točan odgovor: ',loading:'Učitavam pitanja…',none:'Nisam pronašao pitanja za ovaj odabir.',end:'Došao si do kraja. Nema više pitanja u ovom nizu.',copied:'Pitanje i link su kopirani.',shareTitle:'KvizToGo – znaš ovo?',shareText:'Znaš ovo? 🤔',shareTail:'Provjeri znaš li odgovor na KvizToGo.'},en:{title:'Scroll to Knowledge | KvizToGo',description:'Scroll through KvizToGo questions, answer without a time limit and learn as you go.',back:'← Back to quizzes',heading:'Scroll to Knowledge',copy:'Choose a mode and keep scrolling. No numbering and no repeated questions.',all:'Endless stream',fifty:'Random 50',topics:'Topics ▾',know:'Know this one?',placeholder:'Type your answer...',confirm:'Submit answer',more:'Learn more',share:'Send to a friend',correct:'✓ Correct!',wrong:'✕ Incorrect. Correct answer: ',loading:'Loading questions…',none:'No questions found for this selection.',end:'You reached the end. There are no more questions in this stream.',copied:'Question and link copied.',shareTitle:'KvizToGo – know this one?',shareText:'Know this one? 🤔',shareTail:'See if you know the answer on KvizToGo.'}};
const TOPIC_SOURCES=[['AmerickiPredsjednici.json','Američki predsjednici','U.S. Presidents'],['AntickiRim.json','Antički Rim','Ancient Rome'],['Film.json','Film','Film'],['FloraFauna.json','Flora i fauna','Flora & Fauna'],['Gaming.json','Gaming','Gaming'],['Glazba.json','Glazba','Music'],['Knjizevnost.json','Književnost','Literature'],['Moreplovci.json','Moreplovci','Seafarers'],['Nogomet.json','Nogomet','Football'],['Sport.json','Sport','Sport'],['Zemljopis.json','Zemljopis','Geography'],['Znanost.json','Znanost','Science']];
const ALL_SOURCES=[...TOPIC_SOURCES.map(x=>x[0]),'Svastara.json','online-kviz.json'];
const $=s=>document.querySelector(s),feed=$('#feed');let queue=[],pos=0,busy=false,endShown=false,currentLang=localStorage.getItem('kviztogo_lang')==='en'?'en':'hr';
const tx=k=>I18N[currentLang][k]||I18N.hr[k]||k;
function applyLang(){document.documentElement.lang=currentLang;document.title=tx('title');document.querySelector('meta[name="description"]').content=tx('description');$('#backLink').textContent=tx('back');$('#pageHeading').textContent=tx('heading');$('#pageCopy').textContent=tx('copy');$('#allBtn').textContent=tx('all');$('#fiftyBtn').textContent=tx('fifty');$('#topicsBtn').textContent=tx('topics');$('#langBtn').textContent=currentLang==='hr'?'🇭🇷':'🇬🇧';$('#langBtn').setAttribute('aria-label',currentLang==='hr'?'Promijeni jezik na engleski':'Switch language to Croatian');renderTopics();document.querySelectorAll('.q').forEach(refreshCardLanguage)}
function renderTopics(){const box=$('#topics');box.innerHTML='';TOPIC_SOURCES.forEach(([f,hr,en])=>{const b=document.createElement('button');b.className='pick';b.dataset.file=f;b.dataset.trackingTopic=hr;b.textContent=currentLang==='en'?en:hr;b.onclick=()=>start('topic',f);box.append(b)})}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function norm(s){return String(s??'').toLocaleLowerCase('hr').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9čćđšž ]/gi,'').replace(/\s+/g,' ').trim()}
function dist(a,b){a=norm(a);b=norm(b);const m=Array(b.length+1).fill(0).map((_,i)=>i);for(let i=1;i<=a.length;i++){let p=m[0];m[0]=i;for(let j=1;j<=b.length;j++){const t=m[j];m[j]=Math.min(m[j]+1,m[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return m[b.length]}
function allowed(n){return n<=3?0:n<=4?1:n<=7?2:n<=11?3:n<=15?4:4+Math.floor((n-15)/5)}
function correct(input,answers){const x=norm(input);return answers.some(a=>{const y=norm(a);return x===y||dist(x,y)<=allowed(y.length)})}
function shareKey(text){let h=2166136261;const v=norm(text);for(let i=0;i<v.length;i++){h^=v.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(36)}
function wrapLines(ctx,text,maxWidth){const words=String(text||'').split(/\s+/);const lines=[];let line='';for(const word of words){const test=line?line+' '+word:word;if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=word}else line=test}if(line)lines.push(line);return lines}
async function questionImageFile(question){const canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1350;const c=canvas.getContext('2d');c.fillStyle='#0b1220';c.fillRect(0,0,1080,1350);const g=c.createLinearGradient(0,0,1080,1350);g.addColorStop(0,'#162235');g.addColorStop(1,'#101b2d');c.fillStyle=g;c.roundRect(55,55,970,1240,38);c.fill();c.fillStyle='#fff';c.font='900 76px system-ui, sans-serif';c.fillText('Kviz',90,155);c.fillStyle='#2f80ff';c.fillText('To',250,155);c.fillStyle='#22c55e';c.fillText('Go',335,155);c.fillStyle='#86b7ff';c.font='800 34px system-ui, sans-serif';c.fillText(currentLang==='en'?'KNOW THIS ONE?':'ZNAŠ OVO?',90,255);c.fillStyle='#f5f7fb';let size=58;c.font='800 '+size+'px system-ui, sans-serif';let lines=wrapLines(c,question,880);while(lines.length>9&&size>42){size-=4;c.font='800 '+size+'px system-ui, sans-serif';lines=wrapLines(c,question,880)}const lh=Math.round(size*1.28);let y=360;for(const line of lines.slice(0,10)){c.fillText(line,90,y);y+=lh}c.fillStyle='#a8b3c7';c.font='700 31px system-ui, sans-serif';c.fillText(currentLang==='en'?'Answer on kviztogo.com':'Odgovori na kviztogo.com',90,1210);const blob=await new Promise(r=>canvas.toBlob(r,'image/png',0.96));return new File([blob],'kviztogo-pitanje.png',{type:'image/png'})}
async function load(files){feed.innerHTML='<div class="loading">'+tx('loading')+'</div>';const sets=await Promise.all(files.map(async f=>{try{const r=await fetch(f+'?v='+Date.now());return r.ok?await r.json():[]}catch{return []}}));const seen=new Set(),all=[];sets.flat().forEach(q=>{if(!q||!q.question||!Array.isArray(q.answers)||!q.answers.length)return;const k=norm(q.question);if(seen.has(k))return;seen.add(k);all.push(q)});return all}
function mark(mode,file){document.querySelectorAll('.pick').forEach(x=>x.classList.remove('on'));if(mode==='all')$('#allBtn')?.classList.add('on');if(mode==='50')$('#fiftyBtn')?.classList.add('on');if(file)document.querySelector(`[data-file="${CSS.escape(file)}"]`)?.classList.add('on')}
async function start(mode,file,shared,sharedKey){mark(mode,file);feed.innerHTML='';pos=0;queue=[];endShown=false;let all=await load(file?[file]:ALL_SOURCES);if(sharedKey){const hit=all.find(q=>shareKey(q.question)===sharedKey);queue=hit?[hit]:[]}else if(shared){const n=norm(shared),hit=all.find(q=>norm(q.question)===n);queue=hit?[hit]:[]}else{queue=shuffle(all);if(mode==='50')queue=queue.slice(0,50)}feed.innerHTML='';render(12);if(!queue.length)feed.innerHTML='<div class="end">'+tx('none')+'</div>'}
function render(n){if(busy||!queue.length)return;busy=true;const end=Math.min(pos+n,queue.length);for(;pos<end;pos++)feed.append(card(queue[pos]));if(pos>=queue.length&&!endShown){endShown=true;const e=document.createElement('div');e.className='end';e.textContent=tx('end');feed.append(e)}busy=false}
function refreshCardLanguage(el){el.querySelector('.know').textContent=tx('know');const inp=el.querySelector('input');if(inp&&!inp.disabled)inp.placeholder=tx('placeholder');const ok=el.querySelector('.ok');ok.title=tx('confirm');ok.setAttribute('aria-label',tx('confirm'));el.querySelector('.more').textContent=tx('more');el.querySelector('.share').textContent=tx('share')}
function card(q){const el=document.createElement('article');el.className='q';el.dataset.topic=q.topic||'';el.dataset.correctAnswer=q.answers[0]||'';el.innerHTML=`<div class="know"></div><div class="qt"></div><div class="answer"><input type="text" autocomplete="off" autocapitalize="sentences"><button class="ok"><span>✓</span></button></div><div class="result"></div><div class="actions"><button class="more"></button><button class="share"></button></div>`;el.querySelector('.qt').textContent=q.question;refreshCardLanguage(el);const inp=el.querySelector('input'),res=el.querySelector('.result'),ok=el.querySelector('.ok');function check(){if(!inp.value.trim())return;const good=correct(inp.value,q.answers);res.className='result '+(good?'good':'bad');res.textContent=good?tx('correct'):tx('wrong')+q.answers[0];inp.disabled=true;ok.disabled=true}ok.onclick=check;inp.addEventListener('keydown',e=>{if(e.key==='Enter')check()});el.querySelector('.more').onclick=()=>window.open('https://www.google.com/search?q='+encodeURIComponent(q.question+' '+q.answers[0]),'_blank','noopener');el.querySelector('.share').onclick=async()=>{const u=new URL('https://kviztogo.com/scroll-znanje.html');u.searchParams.set('q',shareKey(q.question));try{const file=await questionImageFile(q.question);if(navigator.share&&navigator.canShare?.({files:[file]})){await navigator.share({files:[file],text:u.toString()});}else if(navigator.share){await navigator.share({title:tx('shareTitle'),text:u.toString()});}else{await navigator.clipboard.writeText(u.toString());res.className='result good';res.textContent=tx('copied')}}catch{}};return el}
$('#topicsBtn').onclick=()=>$('#topics').classList.toggle('open');$('#allBtn').onclick=()=>start('all');$('#fiftyBtn').onclick=()=>start('50');$('#langBtn').onclick=()=>{currentLang=currentLang==='hr'?'en':'hr';localStorage.setItem('kviztogo_lang',currentLang);applyLang()};new IntersectionObserver(es=>{if(es[0].isIntersecting&&queue.length&&pos<queue.length)render(12)},{rootMargin:'700px'}).observe($('#sentinel'));
applyLang();
(async()=>{const p=new URLSearchParams(location.search);const shared=p.get('shared'),sharedKey=p.get('q'),mode=p.get('mode'),topic=p.get('topic');if(sharedKey){await start('shared',null,null,sharedKey);return}if(shared){await start('shared',null,shared);return}if(topic&&TOPIC_SOURCES.some(([f])=>f===topic)){await start('topic',topic);return}if(mode==='50'){await start('50');return}if(mode==='all'){await start('all')}})();
</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="scroll-tracking.js?v=20260906-2"></script></body></html>
