function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function norm(s){return String(s??'').toLocaleLowerCase('hr').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9čćđšž ]/gi,'').replace(/\s+/g,' ').trim()}
function dist(a,b){a=norm(a);b=norm(b);const m=Array(b.length+1).fill(0).map((_,i)=>i);for(let i=1;i<=a.length;i++){let p=m[0];m[0]=i;for(let j=1;j<=b.length;j++){const t=m[j];m[j]=Math.min(m[j]+1,m[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return m[b.length]}
function allowed(n){return n<=3?0:n<=4?1:n<=7?2:n<=11?3:n<=15?4:4+Math.floor((n-15)/5)}
function correct(input,answers){const x=norm(input);return answers.some(a=>{const y=norm(a);return x===y||dist(x,y)<=allowed(y.length)})}

async function questionImageFile(question){const canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1350;const c=canvas.getContext('2d');c.fillStyle='#0b1220';c.fillRect(0,0,1080,1350);const g=c.createLinearGradient(0,0,1080,1350);g.addColorStop(0,'#162235');g.addColorStop(1,'#101b2d');c.fillStyle=g;c.roundRect(55,55,970,1240,38);c.fill();c.fillStyle='#fff';c.font='900 76px system-ui, sans-serif';c.fillText('Kviz',90,155);c.fillStyle='#2f80ff';c.fillText('To',250,155);c.fillStyle='#22c55e';c.fillText('Go',335,155);c.fillStyle='#86b7ff';c.font='800 34px system-ui, sans-serif';c.fillText(currentLang==='en'?'KNOW THIS ONE?':'ZNAŠ OVO?',90,255);c.fillStyle='#f5f7fb';let size=58;c.font='800 '+size+'px system-ui, sans-serif';let lines=wrapLines(c,question,880);while(lines.length>9&&size>42){size-=4;c.font='800 '+size+'px system-ui, sans-serif';lines=wrapLines(c,question,880)}const lh=Math.round(size*1.28);let y=360;for(const line of lines.slice(0,10)){c.fillText(line,90,y);y+=lh}c.fillStyle='#a8b3c7';c.font='700 31px system-ui, sans-serif';c.fillText(currentLang==='en'?'Answer on kviztogo.com':'Odgovori na kviztogo.com',90,1210);const blob=await new Promise(r=>canvas.toBlob(r,'image/png',0.96));return new File([blob],'kviztogo-pitanje.png',{type:'image/png'})}
async function load(files){feed.innerHTML='<div class="loading">'+tx('loading')+'</div>';const sets=await Promise.all(files.map(async f=>{try{const r=await fetch(f+'?v='+Date.now());return r.ok?await r.json():[]}catch{return []}}));const seen=new Set(),all=[];sets.flat().forEach(q=>{if(!q||!q.question||!Array.isArray(q.answers)||!q.answers.length)return;const k=norm(q.question);if(seen.has(k))return;seen.add(k);all.push(q)});return all}
function mark(mode,file){document.querySelectorAll('.pick').forEach(x=>x.classList.remove('on'));if(mode==='all')$('#allBtn')?.classList.add('on');if(mode==='50')$('#fiftyBtn')?.classList.add('on');if(file)document.querySelector(`[data-file="${CSS.escape(file)}"]`)?.classList.add('on')}
async function start(mode,file,shared,sharedKey){mark(mode,file);feed.innerHTML='';pos=0;queue=[];endShown=false;let all=await load(file?[file]:ALL_SOURCES);if(sharedKey){const hit=all.find(q=>shareKey(q.question)===sharedKey);queue=hit?[hit]:[]}else if(shared){const n=norm(shared),hit=all.find(q=>norm(q.question)===n);queue=hit?[hit]:[]}else{queue=shuffle(all);if(mode==='50')queue=queue.slice(0,50)}feed.innerHTML='';render(12);if(!queue.length)feed.innerHTML='<div class="end">'+tx('none')+'</div>'}
function render(n){if(busy||!queue.length)return;busy=true;const end=Math.min(pos+n,queue.length);for(;pos<end;pos++)feed.append(card(queue[pos]));if(pos>=queue.length&&!endShown){endShown=true;const e=document.createElement('div');e.className='end';e.textContent=tx('end');feed.append(e)}busy=false}
function refreshCardLanguage(el){el.querySelector('.know').textContent=tx('know');const inp=el.querySelector('input');if(inp&&!inp.disabled)inp.placeholder=tx('placeholder');const ok=el.querySelector('.ok');ok.title=tx('confirm');ok.setAttribute('aria-label',tx('confirm'));el.querySelector('.more').textContent=tx('more');el.querySelector('.share').textContent=tx('share');const fb=el.querySelector('.scroll-feedback-btn');if(fb)fb.textContent=tx('feedbackBtn');const ta=el.querySelector('.scroll-feedback-box textarea');if(ta)ta.placeholder=tx('feedbackPlaceholder');const fst=el.querySelector('.scroll-feedback-title');if(fst)fst.textContent=tx('feedbackTitle');const fs=el.querySelector('.scroll-feedback-send');if(fs)fs.textContent=tx('feedbackSend');const fn=el.querySelector('.scroll-feedback-note');if(fn&&!fn.dataset.changed)fn.textContent=tx('feedbackNote')}
function card(q){const el=document.createElement('article');el.className='q';el.dataset.topic=q.topic||'';el.dataset.correctAnswer=q.answers[0]||'';el.dataset.answers=JSON.stringify(q.answers||[]);el.innerHTML=`<div class="know"></div><div class="qt"></div><div class="answer"><input type="text" autocomplete="off" autocapitalize="sentences"><button class="ok"><span>✓</span></button></div><div class="scroll-answer-result"></div><div class="scroll-feedback-actions"><button class="scroll-feedback-btn" type="button"></button><button class="scroll-vote-btn scroll-like" type="button">👍</button><button class="scroll-vote-btn scroll-dislike" type="button">👎</button></div><div class="scroll-feedback-box"><div class="scroll-feedback-title"></div><textarea></textarea><button class="scroll-feedback-send" type="button"></button><div class="scroll-feedback-note"></div></div><div class="actions"><button class="more"></button><button class="share"></button></div>`;el.querySelector('.qt').textContent=q.question;refreshCardLanguage(el);const inp=el.querySelector('input'),res=el.querySelector('.scroll-answer-result'),ok=el.querySelector('.ok');function check(){if(!inp.value.trim())return;const match=getMatchInfo(inp.value,q.answers),good=!!match;el.dataset.matchedAnswer=good?match.answer:'';el.dataset.matchExact=good&&match.exact?'true':'false';el.dataset.matchReason=good?(match.exact?'exact':'tolerance'):'wrong';const safe=document.createElement('div');safe.textContent=inp.value;const user=safe.innerHTML;const main=String(q.answers[0]||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));if(good){const verdict=match.exact?tx('correctShort'):tx('acceptedShort');res.innerHTML=`<div class="scroll-history-a"><span class="label">${tx('yourAnswer')}</span> ${user}<br><span class="scroll-status good"><span>✓</span> ${verdict}</span>${match.exact?'':`<br><span class="label">${tx('perfectAnswer')}</span> <strong>${main}</strong>`}</div>`;}else{res.innerHTML=`<div class="scroll-history-a"><span class="label">${tx('yourAnswer')}</span> ${user}<br><span class="scroll-status bad"><span>✗</span> ${tx('incorrectShort')}</span><br><span class="label">${currentLang==='en'?'Correct answer:':'Točan odgovor:'}</span> <strong>${main}</strong></div>`;}res.classList.add('open');inp.disabled=true;ok.disabled=true}ok.onclick=check;inp.addEventListener('keydown',e=>{if(e.key==='Enter')check()});const fbBtn=el.querySelector('.scroll-feedback-btn'),fbBox=el.querySelector('.scroll-feedback-box'),fbText=fbBox.querySelector('textarea'),fbSend=fbBox.querySelector('.scroll-feedback-send'),fbNote=fbBox.querySelector('.scroll-feedback-note');fbBtn.onclick=()=>fbBox.classList.toggle('open');fbSend.onclick=()=>{const message=fbText.value.trim();fbNote.dataset.changed='1';if(!message){fbNote.className='scroll-feedback-note error';fbNote.textContent=currentLang==='en'?'Please write a message first.':'Prvo napiši poruku.';return}fbSend.disabled=true;fbNote.className='scroll-feedback-note';fbNote.textContent=currentLang==='en'?'Sending...':'Šaljem...';document.dispatchEvent(new CustomEvent('scroll-feedback',{detail:{card:el,message,done:(doneOk)=>{fbSend.disabled=false;fbNote.className='scroll-feedback-note '+(doneOk?'success':'error');fbNote.textContent=doneOk?(currentLang==='en'?'Message sent. Thank you!':'Poruka je poslana. Hvala!'):(currentLang==='en'?'The message could not be sent.':'Poruka nije poslana.');if(doneOk)fbText.value='';}}}))};for(const [sel,vote] of [['.scroll-like','like'],['.scroll-dislike','dislike']]){const b=el.querySelector(sel);b.onclick=()=>{if(b.disabled)return;el.querySelectorAll('.scroll-vote-btn').forEach(x=>x.disabled=true);document.dispatchEvent(new CustomEvent('scroll-vote',{detail:{card:el,vote,done:(doneOk)=>{if(doneOk)b.classList.add('selected');else el.querySelectorAll('.scroll-vote-btn').forEach(x=>x.disabled=false)}}}))}}el.querySelector('.more').onclick=()=>window.open('https://www.google.com/search?q='+encodeURIComponent(q.question+' '+q.answers[0]),'_blank','noopener');el.querySelector('.share').onclick=async()=>{const u=new URL('https://kviztogo.com/scroll-znanje.html');u.searchParams.set('q',shareKey(q.question));try{const file=await questionImageFile(q.question);if(navigator.share&&navigator.canShare?.({files:[file]})){await navigator.share({files:[file],text:u.toString()});}else if(navigator.share){await navigator.share({title:tx('shareTitle'),text:u.toString()});}else{await navigator.clipboard.writeText(u.toString())}}catch{}};return el}
$('#topicsBtn').onclick=()=>$('#topics').classList.toggle('open');$('#allBtn').onclick=()=>start('all');$('#fiftyBtn').onclick=()=>start('50');$('#langBtn').onclick=()=>{currentLang=currentLang==='hr'?'en':'hr';localStorage.setItem('kviztogo_lang',currentLang);applyLang()};new IntersectionObserver(es=>{if(es[0].isIntersecting&&queue.length&&pos<queue.length)render(12)},{rootMargin:'700px'}).observe($('#sentinel'));
applyLang();
(async()=>{const p=new URLSearchParams(location.search);const shared=p.get('shared'),sharedKey=p.get('q'),mode=p.get('mode'),topic=p.get('topic');if(sharedKey){await start('shared',null,null,sharedKey);return}if(shared){await start('shared',null,shared);return}if(topic&&TOPIC_SOURCES.some(([f])=>f===topic)){await start('topic',topic);return}if(mode==='50'){await start('50');return}if(mode==='all'){await start('all')}})();
