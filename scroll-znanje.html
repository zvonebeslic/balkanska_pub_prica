<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scrollanjem do Znanja | KvizToGo</title>
<style>
:root{--bg:#0b1220;--card:#162235;--blue:#2f80ff;--green:#22c55e;--red:#ef4444;--muted:#a8b3c7;--border:rgba(148,163,184,.22)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f5f7fb;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.head{position:sticky;top:0;z-index:10;background:#000;border-bottom:1px solid #ffffff18;padding:12px;text-align:center}.logo{font-size:30px;font-weight:900;text-decoration:none;color:#fff}.logo b{color:var(--blue)}.logo i{color:var(--green);font-style:normal}.wrap{width:min(760px,calc(100% - 20px));margin:18px auto 60px}.back{color:#fff;text-decoration:none;font-weight:800}.hero{margin:14px 0;background:var(--card);border:1px solid var(--border);border-radius:22px;padding:18px}.hero h1{margin:0 0 8px;font-size:28px}.hero p{margin:0;color:var(--muted)}.picker{display:grid;gap:8px;margin-top:15px}.pick{width:100%;text-align:left;border:1px solid var(--border);background:#101b2d;color:#fff;border-radius:14px;padding:13px 15px;font-weight:850;cursor:pointer}.pick:hover,.pick.on{border-color:var(--blue);background:#17335b}.topics{display:none;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:8px}.topics.open{display:grid}.feed{display:grid;gap:16px}.q{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:17px;box-shadow:0 10px 26px #0004}.know{font-size:12px;font-weight:900;color:#86b7ff;text-transform:uppercase;letter-spacing:.08em;margin-bottom:9px}.qt{font-size:18px;font-weight:800;line-height:1.45}.answer{display:flex;gap:8px;margin-top:15px}.answer input{min-width:0;flex:1;border:1px solid var(--border);background:#0d1728;color:#fff;border-radius:12px;padding:12px;font-size:16px}.ok{width:48px;border:0;border-radius:12px;background:var(--green);color:#07140b;font-size:22px;font-weight:1000;cursor:pointer}.result{min-height:22px;margin-top:8px;font-weight:850}.result.good{color:#69e99a}.result.bad{color:#ff8181}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.more,.share{border-radius:12px;padding:11px;border:1px solid var(--blue);font-weight:850;cursor:pointer}.more{background:var(--blue);color:#fff}.share{background:transparent;color:#fff}.end{text-align:center;padding:25px;color:var(--muted);font-weight:800}.loading{text-align:center;padding:20px;color:var(--muted)}@media(max-width:520px){.topics{grid-template-columns:1fr}.actions{grid-template-columns:1fr}.hero h1{font-size:24px}.qt{font-size:17px}}
</style>
</head><body>
<header class="head"><a class="logo" href="index.html">Kviz<b>To</b><i>Go</i></a></header>
<main class="wrap"><a class="back" href="online-kviz.html">← Natrag na kvizove</a><section class="hero"><h1>Scrollanjem do Znanja</h1><p>Odaberi način i samo skrolaj. Bez numeriranja, bez ponavljanja pitanja.</p><div class="picker"><button class="pick" data-mode="all">Beskrajni niz</button><button class="pick" data-mode="50">Nasumičnih 50</button><button class="pick" id="topicsBtn">Teme ▾</button><div class="topics" id="topics"></div></div></section><section class="feed" id="feed"></section><div id="sentinel"></div></main>
<script>
const SOURCES=[['AmerickiPredsjednici.json','Američki predsjednici'],['AntickiRim.json','Antički Rim'],['Film.json','Film'],['FloraFauna.json','Flora i fauna'],['Gaming.json','Gaming'],['Glazba.json','Glazba'],['Knjizevnost.json','Književnost'],['Moreplovci.json','Moreplovci'],['Nogomet.json','Nogomet'],['Sport.json','Sport'],['Zemljopis.json','Zemljopis']];
const $=s=>document.querySelector(s), feed=$('#feed'); let queue=[],pos=0,busy=false;
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function norm(s){return String(s??'').toLocaleLowerCase('hr').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9čćđšž ]/gi,'').replace(/\s+/g,' ').trim()}
function dist(a,b){a=norm(a);b=norm(b);const m=Array(b.length+1).fill(0).map((_,i)=>i);for(let i=1;i<=a.length;i++){let p=m[0];m[0]=i;for(let j=1;j<=b.length;j++){const t=m[j];m[j]=Math.min(m[j]+1,m[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return m[b.length]}
function allowed(n){return n<=3?0:n<=4?1:n<=7?2:n<=11?3:n<=15?4:4+Math.floor((n-15)/5)}
function correct(input,answers){const x=norm(input);return answers.some(a=>{const y=norm(a);return x===y||dist(x,y)<=allowed(y.length)})}
async function load(files){feed.innerHTML='<div class="loading">Učitavam pitanja…</div>';const sets=await Promise.all(files.map(async f=>{try{const r=await fetch(f+'?v='+Date.now());return r.ok?await r.json():[]}catch{return []}}));const seen=new Set(),all=[];sets.flat().forEach(q=>{if(!q||!q.question||!Array.isArray(q.answers)||!q.answers.length)return;const k=norm(q.question);if(seen.has(k))return;seen.add(k);all.push(q)});return all}
async function start(mode,file){document.querySelectorAll('.pick').forEach(x=>x.classList.remove('on'));feed.innerHTML='';pos=0;queue=[];let all=await load(file?[file]:SOURCES.map(x=>x[0]));queue=shuffle(all);if(mode==='50')queue=queue.slice(0,50);feed.innerHTML='';render(12)}
function render(n){if(busy)return;busy=true;const end=Math.min(pos+n,queue.length);for(;pos<end;pos++)feed.append(card(queue[pos],pos));if(pos>=queue.length&&queue.length){const e=document.createElement('div');e.className='end';e.textContent='Došao si do kraja. Nema više pitanja u ovom nizu.';feed.append(e)}busy=false}
function card(q,i){const el=document.createElement('article');el.className='q';el.innerHTML=`<div class="know">Znaš ovo?</div><div class="qt"></div><div class="answer"><input autocomplete="off" placeholder="Upiši odgovor"><button class="ok" aria-label="Potvrdi">✓</button></div><div class="result"></div><div class="actions"><button class="more">Saznaj više</button><button class="share">Pošalji prijatelju</button></div>`;el.querySelector('.qt').textContent=q.question;const inp=el.querySelector('input'),res=el.querySelector('.result'),ok=el.querySelector('.ok');function check(){if(!inp.value.trim())return;const good=correct(inp.value,q.answers);res.className='result '+(good?'good':'bad');res.textContent=good?'✓ Točno!':'✕ Netočno. Točan odgovor: '+q.answers[0];inp.disabled=true;ok.disabled=true}ok.onclick=check;inp.addEventListener('keydown',e=>{if(e.key==='Enter')check()});el.querySelector('.more').onclick=()=>window.open('https://www.google.com/search?q='+encodeURIComponent(q.question+' '+q.answers[0]),'_blank','noopener');el.querySelector('.share').onclick=async()=>{const text='Znaš ovo? 🤔\n'+q.question+'\n\nProvjeri znaš li odgovor na KvizToGo.';try{if(navigator.share)await navigator.share({title:'KvizToGo',text,url:location.href});else{await navigator.clipboard.writeText(text+'\n'+location.href);res.textContent='Link i pitanje kopirani.'}}catch{}};return el}
const topics=$('#topics');SOURCES.forEach(([f,n])=>{const b=document.createElement('button');b.className='pick';b.textContent=n;b.onclick=()=>start('topic',f);topics.append(b)});$('#topicsBtn').onclick=()=>topics.classList.toggle('open');document.querySelector('[data-mode="all"]').onclick=()=>start('all');document.querySelector('[data-mode="50"]').onclick=()=>start('50');new IntersectionObserver(es=>{if(es[0].isIntersecting&&queue.length&&pos<queue.length)render(12)},{rootMargin:'700px'}).observe($('#sentinel'));
</script></body></html>
