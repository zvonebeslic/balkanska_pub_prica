<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scrollanjem do Znanja | KvizToGo</title>
<meta name="description" content="Scrollaj kroz KvizToGo pitanja, odgovaraj bez vremenskog ograničenja i uči usput.">
<style>
:root{--bg:#0b1220;--card:#162235;--blue:#2f80ff;--green:#22c55e;--red:#ef4444;--muted:#a8b3c7;--border:rgba(148,163,184,.22);--card-soft:#101b2d}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at top left,rgba(47,128,255,.14),transparent 42%),radial-gradient(circle at bottom right,rgba(34,197,94,.10),transparent 38%),var(--bg);color:#f5f7fb;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.head{position:sticky;top:0;z-index:10;background:#000;border-bottom:1px solid #ffffff18;padding:12px;text-align:center}.logo{font-size:30px;font-weight:900;text-decoration:none;color:#fff;letter-spacing:-.055em}.logo b{color:var(--blue)}.logo i{color:var(--green);font-style:normal}.wrap{width:min(760px,calc(100% - 20px));margin:18px auto 60px}.back{color:#fff;text-decoration:none;font-weight:800}.hero{margin:14px 0;background:linear-gradient(135deg,#162235f5,#101b2df5);border:1px solid var(--border);border-radius:22px;padding:18px}.hero h1{margin:0 0 8px;font-size:28px}.hero p{margin:0;color:var(--muted)}.picker{display:grid;gap:8px;margin-top:15px}.pick{width:100%;text-align:left;border:1px solid var(--border);background:#101b2d;color:#fff;border-radius:14px;padding:13px 15px;font-weight:850;cursor:pointer;text-decoration:none}.pick:hover,.pick.on{border-color:var(--blue);background:#17335b}.topics{display:none;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:8px}.topics.open{display:grid}.feed{display:grid;gap:16px}.q{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:17px;box-shadow:0 10px 26px #0004;scroll-margin-top:75px}.know{font-size:12px;font-weight:900;color:#86b7ff;text-transform:uppercase;letter-spacing:.08em;margin-bottom:9px}.qt{font-size:18px;font-weight:800;line-height:1.45}.answer{display:flex;gap:.4rem;align-items:center;margin-top:15px}.answer input{min-width:0;flex:1;border:1px solid var(--border);background:var(--card-soft);color:#f5f7fb;border-radius:16px;padding:.65rem 1.1rem;font-size:1rem;outline:none}.answer input::placeholder{color:rgba(245,247,251,.45)}.answer input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(47,128,255,.18)}.ok{width:44px;height:44px;flex:0 0 44px;border:1px solid var(--green);border-radius:12px;background:var(--green);color:#fff;-webkit-text-fill-color:#fff;font-size:22px;font-weight:950;line-height:1;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 0 16px rgba(34,197,94,.26)}.ok:hover:not(:disabled){background:#16a34a;border-color:#16a34a;box-shadow:0 0 20px rgba(34,197,94,.36)}.ok:disabled{opacity:.55}.result{min-height:22px;margin-top:8px;font-weight:850}.result.good{color:#69e99a}.result.bad{color:#ff8181}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.more,.share{border-radius:12px;padding:11px;border:2px solid var(--blue);font-weight:850;cursor:pointer}.more{background:var(--blue);color:#fff}.share{background:transparent;color:#fff;border-color:#facc15}.end{text-align:center;padding:25px;color:var(--muted);font-weight:800}.loading{text-align:center;padding:20px;color:var(--muted)}@media(max-width:520px){.topics{grid-template-columns:1fr}.actions{grid-template-columns:1fr}.hero h1{font-size:24px}.qt{font-size:17px}}
</style>
</head><body>
<header class="head"><a class="logo" href="index.html">Kviz<b>To</b><i>Go</i></a></header>
<main class="wrap"><a class="back" href="online-kviz.html">← Natrag na kvizove</a><section class="hero"><h1>Scrollanjem do Znanja</h1><p>Odaberi način i samo skrolaj. Bez numeriranja, bez ponavljanja pitanja.</p><div class="picker"><button class="pick" data-mode="all">Beskrajni niz</button><button class="pick" data-mode="50">Nasumičnih 50</button><button class="pick" id="topicsBtn">Teme ▾</button><div class="topics" id="topics"></div></div></section><section class="feed" id="feed"></section><div id="sentinel"></div></main>
<script>
const TOPIC_SOURCES=[['AmerickiPredsjednici.json','Američki predsjednici'],['AntickiRim.json','Antički Rim'],['Film.json','Film'],['FloraFauna.json','Flora i fauna'],['Gaming.json','Gaming'],['Glazba.json','Glazba'],['Knjizevnost.json','Književnost'],['Moreplovci.json','Moreplovci'],['Nogomet.json','Nogomet'],['Sport.json','Sport'],['Zemljopis.json','Zemljopis'],['Znanost.json','Znanost']];
const ALL_SOURCES=[...TOPIC_SOURCES.map(x=>x[0]),'Svastara.json','online-kviz.json'];
const $=s=>document.querySelector(s),feed=$('#feed');let queue=[],pos=0,busy=false,endShown=false;
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function norm(s){return String(s??'').toLocaleLowerCase('hr').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9čćđšž ]/gi,'').replace(/\s+/g,' ').trim()}
function dist(a,b){a=norm(a);b=norm(b);const m=Array(b.length+1).fill(0).map((_,i)=>i);for(let i=1;i<=a.length;i++){let p=m[0];m[0]=i;for(let j=1;j<=b.length;j++){const t=m[j];m[j]=Math.min(m[j]+1,m[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return m[b.length]}
function allowed(n){return n<=3?0:n<=4?1:n<=7?2:n<=11?3:n<=15?4:4+Math.floor((n-15)/5)}
function correct(input,answers){const x=norm(input);return answers.some(a=>{const y=norm(a);return x===y||dist(x,y)<=allowed(y.length)})}
async function load(files){feed.innerHTML='<div class="loading">Učitavam pitanja…</div>';const sets=await Promise.all(files.map(async f=>{try{const r=await fetch(f+'?v='+Date.now());return r.ok?await r.json():[]}catch{return []}}));const seen=new Set(),all=[];sets.flat().forEach(q=>{if(!q||!q.question||!Array.isArray(q.answers)||!q.answers.length)return;const k=norm(q.question);if(seen.has(k))return;seen.add(k);all.push(q)});return all}
function mark(mode,file){document.querySelectorAll('.pick').forEach(x=>x.classList.remove('on'));if(mode==='all')document.querySelector('[data-mode="all"]')?.classList.add('on');if(mode==='50')document.querySelector('[data-mode="50"]')?.classList.add('on');if(file){document.querySelector(`[data-file="${CSS.escape(file)}"]`)?.classList.add('on')}}
async function start(mode,file,shared){mark(mode,file);feed.innerHTML='';pos=0;queue=[];endShown=false;let all=await load(file?[file]:ALL_SOURCES);if(shared){const n=norm(shared),hit=all.find(q=>norm(q.question)===n);queue=hit?[hit]:[];}else{queue=shuffle(all);if(mode==='50')queue=queue.slice(0,50)}feed.innerHTML='';render(12);if(!queue.length)feed.innerHTML='<div class="end">Nisam pronašao pitanja za ovaj odabir.</div>'}
function render(n){if(busy||!queue.length)return;busy=true;const end=Math.min(pos+n,queue.length);for(;pos<end;pos++)feed.append(card(queue[pos]));if(pos>=queue.length&&!endShown){endShown=true;const e=document.createElement('div');e.className='end';e.textContent='Došao si do kraja. Nema više pitanja u ovom nizu.';feed.append(e)}busy=false}
function card(q){const el=document.createElement('article');el.className='q';el.innerHTML=`<div class="know">Znaš ovo?</div><div class="qt"></div><div class="answer"><input type="text" autocomplete="off" autocapitalize="sentences" placeholder="Upiši svoj odgovor..."><button class="ok" title="Potvrdi odgovor" aria-label="Potvrdi odgovor"><span>✓</span></button></div><div class="result"></div><div class="actions"><button class="more">Saznaj više</button><button class="share">Pošalji prijatelju</button></div>`;el.querySelector('.qt').textContent=q.question;const inp=el.querySelector('input'),res=el.querySelector('.result'),ok=el.querySelector('.ok');function check(){if(!inp.value.trim())return;const good=correct(inp.value,q.answers);res.className='result '+(good?'good':'bad');res.textContent=good?'✓ Točno!':'✕ Netočno. Točan odgovor: '+q.answers[0];inp.disabled=true;ok.disabled=true}ok.onclick=check;inp.addEventListener('keydown',e=>{if(e.key==='Enter')check()});el.querySelector('.more').onclick=()=>window.open('https://www.google.com/search?q='+encodeURIComponent(q.question+' '+q.answers[0]),'_blank','noopener');el.querySelector('.share').onclick=async()=>{const u=new URL(location.href);u.search='';u.searchParams.set('shared',q.question);const text='Znaš ovo? 🤔\n'+q.question+'\n\nProvjeri znaš li odgovor na KvizToGo.';try{if(navigator.share)await navigator.share({title:'KvizToGo – znaš ovo?',text,url:u.toString()});else{await navigator.clipboard.writeText(text+'\n'+u);res.className='result good';res.textContent='Pitanje i link su kopirani.'}}catch{}};return el}
const topics=$('#topics');TOPIC_SOURCES.forEach(([f,n])=>{const b=document.createElement('button');b.className='pick';b.dataset.file=f;b.textContent=n;b.onclick=()=>start('topic',f);topics.append(b)});$('#topicsBtn').onclick=()=>topics.classList.toggle('open');document.querySelector('[data-mode="all"]').onclick=()=>start('all');document.querySelector('[data-mode="50"]').onclick=()=>start('50');new IntersectionObserver(es=>{if(es[0].isIntersecting&&queue.length&&pos<queue.length)render(12)},{rootMargin:'700px'}).observe($('#sentinel'));
(async()=>{const p=new URLSearchParams(location.search);const shared=p.get('shared');const mode=p.get('mode');const topic=p.get('topic');if(shared){await start('shared',null,shared);return}if(topic&&TOPIC_SOURCES.some(([f])=>f===topic)){await start('topic',topic);return}if(mode==='50'){await start('50');return}if(mode==='all'){await start('all');return}})();
</script></body></html>
