<!doctype html><html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06162b"><title>Storytelling | KvizToGo</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#020914;color:#fff;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit}.app{width:min(100%,520px);min-height:100svh;margin:auto;background:#07172b;overflow:hidden;position:relative}.top{height:68px;position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;padding:8px 12px;background:linear-gradient(#09264b,#06172e);box-shadow:0 5px 20px #0008}.back{width:38px;height:38px;border-radius:13px;border:1px solid #2d78bb;background:#0a203b;color:#fff;font-size:25px}.brand{font-size:25px;font-weight:1000;letter-spacing:-1.4px;flex:1}.brand i{font-style:normal;color:#1b8cff}.brand b{color:#00d86a}.counter{padding:8px 10px;border-radius:13px;background:#06172d;border:1px solid #276eae;font-weight:900}.screen{display:none}.screen.on{display:block}.intro{min-height:calc(100svh - 68px);padding:22px 18px 100px;background:radial-gradient(circle at 50% 8%,#168dff55,transparent 35%),linear-gradient(#071b36,#061324)}.title{text-align:center}.title h1{font-size:38px;margin:4px 0;text-shadow:0 4px 0 #00152c}.title p{color:#c5dbef;margin:0 0 22px}.avatars{display:grid;grid-template-columns:1fr 1fr;gap:14px}.avatar{border:2px solid #24547f;border-radius:24px;padding:0;overflow:hidden;background:linear-gradient(145deg,#15385b,#081a30);color:#fff;box-shadow:inset 0 2px #ffffff18,0 10px 22px #0008}.avatar .face{height:155px;display:grid;place-items:center;font-size:83px;background:radial-gradient(circle at 50% 35%,#4fa9ff66,transparent 45%),linear-gradient(#143e67,#0b2038)}.avatar strong{display:block;padding:10px}.avatar.sel{border-color:#16a2ff;box-shadow:0 0 0 3px #00d86a55,0 0 28px #168dff99}.go,.next{width:100%;border:0;border-radius:18px;padding:16px;margin-top:18px;background:linear-gradient(#18ed72,#00a84d);color:#fff;font-size:19px;font-weight:1000;box-shadow:inset 0 2px #ffffff55,0 8px 0 #006d35,0 14px 25px #0007}.go:disabled{filter:grayscale(1);opacity:.5}.mapHead{padding:13px 15px;background:#07182c}.mapHead h2{margin:0;font-size:22px}.mapHead small{color:#b8cce0}.world{height:calc(100svh - 151px);min-height:680px;overflow:auto;position:relative;background:#77c9ff}.scene{height:1600px;position:relative;overflow:hidden;background:linear-gradient(#52baff 0 12%,#d9f4ff 12% 16%,#2e93dd 16% 28%,#63b96e 28% 56%,#dfb85f 56% 72%,#447cb0 72% 100%)}.scene:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 16% 12%,#fff 0 4%,transparent 5%),radial-gradient(ellipse at 78% 10%,#fff 0 5%,transparent 6%),radial-gradient(ellipse at 48% 25%,#0b6dbf 0 12%,transparent 13%),radial-gradient(ellipse at 15% 42%,#167f4c 0 15%,transparent 16%),radial-gradient(ellipse at 80% 49%,#0f743f 0 17%,transparent 18%),radial-gradient(ellipse at 20% 65%,#e8c36c 0 16%,transparent 17%),radial-gradient(ellipse at 78% 70%,#d59b43 0 14%,transparent 15%),radial-gradient(ellipse at 50% 88%,#174b83 0 24%,transparent 25%);opacity:.9}.mount{position:absolute;top:45px;left:-25px;width:270px;height:230px;background:linear-gradient(135deg,#fff 0 25%,#9dd4f3 26% 42%,#3c789e 43%);clip-path:polygon(50% 0,100% 100%,0 100%);filter:drop-shadow(0 12px 8px #00385d66)}.castle{position:absolute;top:100px;right:30px;font-size:100px;filter:drop-shadow(0 10px 6px #0006)}.sea{position:absolute;top:285px;left:-70px;width:410px;height:320px;border-radius:50%;background:radial-gradient(ellipse,#43c8ff,#0878c6 70%);transform:rotate(-20deg);box-shadow:inset 0 0 30px #fff5}.landmark{position:absolute;font-size:74px;filter:drop-shadow(0 8px 4px #0007);z-index:3}.light{top:330px;left:32px}.bridge{top:470px;right:8px}.trees{top:610px;left:18px}.pyramid{top:930px;right:20px}.city{top:1130px;left:20px}.road{position:absolute;z-index:4;left:50%;top:190px;width:145px;height:1260px;transform:translateX(-50%) rotate(2deg);border-left:16px solid #f4e2b0;border-radius:48% 52% 45% 55%;filter:drop-shadow(0 4px 3px #0005)}.road:after{content:"";position:absolute;left:-10px;top:0;height:100%;border-left:4px dashed #fff9}.levels{position:absolute;z-index:10;inset:0}.node{position:absolute;width:76px;height:58px;border-radius:50%;border:4px solid #8fa3b7;background:linear-gradient(#8293a6,#35485d);color:#fff;font-size:24px;font-weight:1000;box-shadow:inset 0 5px #ffffff55,0 8px 0 #243447,0 12px 18px #0007}.node.open{border-color:#75c6ff;background:linear-gradient(#1d9cff,#0761ce);box-shadow:inset 0 5px #ffffff66,0 8px 0 #064a9b,0 0 20px #00a8ff}.node.done{border-color:#6affaa;background:linear-gradient(#14e66f,#009e49);box-shadow:inset 0 5px #ffffff66,0 8px 0 #006e36}.node.lock:after{content:"🔒";position:absolute;font-size:20px;right:-10px;bottom:-12px}.stars{position:absolute;left:50%;bottom:-28px;transform:translateX(-50%);white-space:nowrap;font-size:18px;text-shadow:0 2px #8c5700}.walker{position:absolute;left:50%;top:-62px;transform:translateX(-50%);font-size:48px;filter:drop-shadow(0 6px 4px #0008)}.bottom{height:70px;position:sticky;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(4,1fr);background:linear-gradient(#08223f,#041326);border-top:1px solid #2783c8}.tab{text-align:center;padding:9px 2px;font-size:10px;color:#b7c8da}.tab b{display:block;font-size:23px}.tab.on{color:#20b7ff;box-shadow:inset 0 -4px #168cff}.quiz{min-height:calc(100svh - 68px);padding:18px 14px 90px;background:radial-gradient(circle at 50% 0,#137ee744,transparent 30%),#061426}.qtop{display:flex;align-items:center;gap:10px}.bar{height:10px;flex:1;background:#122b47;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#12a9ff,#00e36d);width:20%}.card{margin-top:17px;padding:18px;border-radius:25px;background:linear-gradient(145deg,#0c2a4d,#06162c);border:2px solid #227ac0;box-shadow:inset 0 2px #ffffff18,0 18px 35px #0008}.topic{display:inline-block;padding:6px 10px;border-radius:20px;background:#0d4d83;color:#d9efff;font-size:12px;font-weight:900}.q{font-size:21px;font-weight:900;line-height:1.3;margin:16px 0}.answers{display:grid;gap:10px}.ans{min-height:58px;border-radius:16px;border:2px solid #24547e;background:linear-gradient(#10365c,#0a223e);color:#fff;text-align:left;padding:9px 12px;font-weight:800;box-shadow:inset 0 2px #ffffff12}.ans b{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;margin-right:8px;background:#06172d;border:2px solid #4385bd}.ans.good{border-color:#00ef70;background:#075d37;box-shadow:0 0 18px #00e86a88}.ans.bad{border-color:#ff4f64;background:#5d1724}.feedback{text-align:center;font-weight:900;min-height:25px;margin-top:12px}.result{min-height:calc(100svh - 68px);display:grid;place-items:center;padding:25px 16px;background:radial-gradient(circle,#147fd955,transparent 45%),#061426}.resultCard{width:100%;border-radius:28px;padding:25px 18px;text-align:center;background:linear-gradient(145deg,#0d2d51,#061426);border:2px solid #2688d4;box-shadow:0 20px 50px #0009}.resultCard h1{color:#18ed72;font-size:30px}.big{font-size:50px}.stat{display:flex;justify-content:space-between;padding:13px;border-bottom:1px solid #ffffff20}.retry{width:100%;margin-top:12px;padding:14px;border-radius:16px;border:1px solid #2d6a9e;background:#0a203b;color:#fff;font-weight:900}@media(min-width:700px){body{padding:18px}.app{border-radius:30px;box-shadow:0 0 70px #000}}
</style></head><body><main class="app"><header class="top"><button class="back" onclick="location.href='online-kviz.html'">‹</button><div class="brand">Kviz<i>To</i><b>Go</b></div><div class="counter">👑 <span id="starCount">0</span></div></header>
<section id="intro" class="screen on"><div class="intro"><div class="title"><h1>Storytelling</h1><p>Kreni na put kroz svijet znanja!</p></div><div class="avatars"><button class="avatar" data-a="🧒"><div class="face">🧒</div><strong>Dječak</strong></button><button class="avatar" data-a="👧"><div class="face">👧</div><strong>Djevojčica</strong></button><button class="avatar" data-a="👨"><div class="face">👨</div><strong>Muškarac</strong></button><button class="avatar" data-a="👩"><div class="face">👩</div><strong>Žena</strong></button></div><button id="go" class="go" disabled>Kreni na put! ❯</button></div></section>
<section id="map" class="screen"><div class="mapHead"><h2>Storytelling</h2><small id="sub">5 pitanja po levelu • 3 točna za prolaz</small></div><div id="world" class="world"><div class="scene"><div class="mount"></div><div class="castle">🏰</div><div class="sea"></div><div class="landmark light">🗼</div><div class="landmark bridge">🌉</div><div class="landmark trees">🌲🌲</div><div class="landmark pyramid">🔺</div><div class="landmark city">🏙️</div><div class="road"></div><div id="levels" class="levels"></div></div></div><nav class="bottom"><div class="tab on"><b>🗺️</b>Storytelling</div><div class="tab"><b>🏆</b>Nagrade</div><div class="tab"><b>📊</b>Statistika</div><div class="tab"><b id="mini">👤</b>Profil</div></nav></section>
<section id="quiz" class="screen"><div class="quiz"><div class="qtop"><strong id="lev">Level 1</strong><div class="bar"><i id="fill"></i></div><strong id="pos">1/5</strong></div><div class="card"><span id="topic" class="topic">KvizToGo</span><div id="q" class="q"></div><div id="answers" class="answers"></div><div id="feedback" class="feedback"></div></div><button id="leave" class="retry">← Natrag na mapu</button></div></section>
<section id="result" class="screen"><div class="result"><div class="resultCard"><div class="brand">Kviz<i>To</i><b>Go</b></div><h1 id="rtitle">LEVEL ZAVRŠEN!</h1><div id="rstars" class="big">⭐⭐⭐</div><div class="stat"><span>✓ Točni odgovori</span><strong id="rscore">5/5</strong></div><div class="stat"><span>⏱ Vrijeme</span><strong id="rtime">0 sek</strong></div><div class="stat"><span>👑 Osvojene zvjezdice</span><strong id="rnum">3</strong></div><button id="cont" class="next">Nastavi ❯</button><button id="retry" class="retry">Ponovi level</button></div></div></section></main>
<script>(()=>{'use strict';const FILES=['AmerickiPredsjednici','AntickiRim','Film','FloraFauna','Gaming','Glazba','Knjizevnost','Moreplovci','Nogomet','Sport','Svastara','Zemljopis','Znanost','povijest'],KEY='kviztogo_storytelling_v2';let state={avatar:'',unlocked:1,stars:{}},pool=[],level=1,qs=[],pos=0,correct=0,start=0,lock=false;const $=x=>document.getElementById(x);function save(){localStorage.setItem(KEY,JSON.stringify(state))}function load(){try{state={...state,...JSON.parse(localStorage.getItem(KEY)||'{}')};state.stars=state.stars||{}}catch(e){}}function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('on',x.id===id));scrollTo(0,0)}function total(){return Object.values(state.stars).reduce((a,b)=>a+(+b||0),0)}function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}function shuffle(a,seed){a=a.slice();let x=seed||1;for(let i=a.length-1;i;i--){x^=x<<13;x^=x>>>17;x^=x<<5;let j=Math.floor(((x>>>0)/4294967296)*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function norm(q,s,i){let k=String(q?.correct_answer||'').toUpperCase(),a=q?.answers;if(!q?.question||!a||Array.isArray(a)||!['A','B','C'].every(x=>typeof a[x]==='string')||!['A','B','C'].includes(k))return null;return{id:s+'-'+i,q:q.question,a,correct:k,topic:q.topic||s}}async function loadQuestions(){let all=await Promise.all(FILES.map(async f=>{try{let r=await fetch('ABC%20pitanja/'+encodeURIComponent(f)+'.json');if(!r.ok)return[];let j=await r.json();return j.map((q,i)=>norm(q,f,i)).filter(Boolean)}catch(e){return[]}}));pool=all.flat();$('sub').textContent=pool.length?`${pool.length} pitanja • 5 po levelu • 3 za prolaz`:'Pitanja se nisu učitala';renderMap()}function renderMap(){let max=Math.max(12,state.unlocked+5),h=Math.max(1600,max*120+260),scene=$('levels').parentElement;scene.style.height=h+'px';$('levels').innerHTML='';$('starCount').textContent=total();$('mini').textContent=state.avatar||'👤';for(let n=1;n<=max;n++){let b=document.createElement('button'),y=h-150-n*112,x=50+Math.sin(n*1.18)*105;b.className='node '+(n<state.unlocked?'done':n===state.unlocked?'open':'lock');b.style.left=`calc(50% + ${x-88}px)`;b.style.top=y+'px';b.innerHTML=`${n}<span class="stars">${'⭐'.repeat(state.stars[n]||0)}</span>${n===state.unlocked?`<span class="walker">${state.avatar||'🧒'}</span>`:''}`;b.disabled=n>state.unlocked;b.onclick=()=>play(n);$('levels').appendChild(b)}setTimeout(()=>{let cur=$('levels').querySelector('.open');cur?.scrollIntoView({block:'center'})},80)}function play(n){if(!pool.length)return;level=n;qs=shuffle(pool,hash('KvizToGo-'+n)).slice(0,5);pos=0;correct=0;start=Date.now();lock=false;show('quiz');draw()}function draw(){let q=qs[pos];$('lev').textContent='Level '+level;$('pos').textContent=(pos+1)+'/5';$('fill').style.width=((pos+1)*20)+'%';$('topic').textContent=q.topic;$('q').textContent=q.q;$('feedback').textContent='';$('answers').innerHTML='';['A','B','C'].forEach(k=>{let b=document.createElement('button');b.className='ans';b.innerHTML=`<b>${k}</b>${q.a[k]}`;b.onclick=()=>answer(b,k);$('answers').appendChild(b)});lock=false}function answer(btn,k){if(lock)return;lock=true;let q=qs[pos],ok=k===q.correct;if(ok)correct++;document.querySelectorAll('.ans').forEach(b=>{b.disabled=true;if(b.querySelector('b').textContent===q.correct)b.classList.add('good')});if(!ok)btn.classList.add('bad');$('feedback').textContent=ok?'✓ Točno!':'✗ Točan odgovor: '+q.a[q.correct];setTimeout(()=>{pos++;pos<5?draw():finish()},700)}function finish(){let pass=correct>=3,stars=correct===5?3:correct===4?2:correct===3?1:0;if(pass){state.stars[level]=Math.max(state.stars[level]||0,stars);state.unlocked=Math.max(state.unlocked,level+1);save()}$('rtitle').textContent=pass?'LEVEL ZAVRŠEN!':'POKUŠAJ PONOVNO';$('rtitle').style.color=pass?'#18ed72':'#ff6878';$('rstars').textContent=stars?'⭐'.repeat(stars):'☆☆☆';$('rscore').textContent=correct+'/5';$('rtime').textContent=Math.round((Date.now()-start)/1000)+' sek';$('rnum').textContent=stars;$('cont').style.display=pass?'block':'none';show('result')}document.querySelectorAll('.avatar').forEach(b=>b.onclick=()=>{document.querySelectorAll('.avatar').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');state.avatar=b.dataset.a;$('go').disabled=false;save()});$('go').onclick=()=>{show('map');renderMap()};$('leave').onclick=()=>{show('map');renderMap()};$('cont').onclick=()=>{show('map');renderMap()};$('retry').onclick=()=>play(level);load();if(state.avatar){let b=document.querySelector(`[data-a="${state.avatar}"]`);b?.classList.add('sel');$('go').disabled=false}loadQuestions()})();</script></body></html>
